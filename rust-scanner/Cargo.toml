[package]
name = "repo2graph-scanner"
version = "0.2.0"
edition = "2021"
description = "High-speed parallel Rust core for repo2graph (discovery, hashing, binary/LFS sniff, BM25, unicode scan)"
license = "MIT"

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "repo2graph-scanner"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
pyo3 = { version = "0.28", features = ["extension-module"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
