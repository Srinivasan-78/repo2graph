: "def make_key(tool: str, params: Any) -> str:", "doc": "A total, stable cache key for one tool call. Args: tool: Tool name. params: The caller's arguments. Returns: A string key. Equal arguments always produce equal keys, whatever the insertion order, and no argument value can make this raise."}, {"id": "sym:repo2graph/cache.py::ResultCache", "label": "ResultCache", "type": "symbol", "deg": 6, "path": "repo2graph/cache.py", "kind": "class", "lang": "python", "start_line": 96, "end_line": 205, "sig": "class ResultCache:", "doc": "A thread-safe LRU cache with per-entry expiry. Args: max_size: Entries kept before the least recently used is evicted. 0 or less disables the cache entirely, which stays a valid configuration rather than an error. ttl: Seconds an entry may be served for. clock: Monotonic time source, injected so tests can advance it without sleeping."}, {"id": "sym:repo2graph/cache.py::ResultCache.get", "label": "ResultCache.get", "type": "symbol", "deg": 52, "path": "repo2graph/cache.py", "kind": "function", "lang": "python", "start_line": 128, "end_line": 156, "sig": "def get(self, key: str) -> Any:", "doc": "Return the cached value for `key`, or None when there is none. An expired entry is dropped and counted as a miss, so a caller cannot tell \"expired\" from \"never seen\" -- which is the point. Args: key: A key from `make_key`. Returns: The cached value, or None."}, {"id": "sym:repo2graph/cache.py::ResultCache.put", "label": "ResultCache.put", "type": "symbol", "deg": 3, "path": "repo2graph/cache.py", "kind": "function", "lang": "python", "start_line": 158, "end_line": 168, "sig": "def put(self, key: str, value: Any) -> None:", "doc": "Store `value` under `key`, evicting the oldest entry if needed."}, {"id": "sym:repo2graph/cache.py::ResultCache.clear", "label": "ResultCache.cl…", "type": "symbol", "deg": 9, "path": "repo2graph/cache.py", "kind": "function", "lang": "python", "start_line": 170, "end_line": 183, "sig": "def clear(self) -> int:", "doc": "Drop every entry. Called whenever the index is rebuilt. Counters are deliberately *not* reset: they describe the life of the process, and zeroing them on every rebuild would hide exactly the churn an operator is looking at them to find. Returns: How many entries were dropped."}, {"id": "sym:repo2graph/cache.py::ResultCache.stats", "label": "ResultCache.st…", "type": "symbol", "deg": 2, "path": "repo2graph/cache.py", "kind": "function", "lang": "python", "start_line": 185, "end_line": 205, "sig": "def stats(self) -> dict[str, Any]:", "doc": "Counters for the `repo_cache_stats` tool. Returns: hits, misses, size, max_size and ttl_s, plus eviction and hit-rate figures an operator needs to tell a working cache from a thrashing one. A cache at max_size with a hit rate near zero is sized wrong, and neither number says that alone."}, {"id": "file:repo2graph/changelog.py", "label": "changelog.py", "type": "file", "deg": 10, "path": "repo2graph/changelog.py", "lang": "python", "lines": 234}, {"id": "sym:repo2graph/changelog.py::build_changelog_markdown", "label": "build_changelo…", "type": "symbol", "deg": 9, "path": "repo2graph/changelog.py", "kind": "function", "lang": "python", "start_line": 133, "end_line": 206, "sig": "def build_changelog_markdown( g: Graph, prev_nodes: list[dict[str, Any]], prev_edges: list[dict[str, Any]], short_sha: str | None, prev_short_sha: str | None, build_date: str, ) -> str:", "doc": "The CHANGELOG.md body for a build that has a previous index to diff. `g` is the just-built `Graph` (its `.nodes`/`.edges` are the *new* state); `prev_nodes`/`prev_edges` is the snapshot `previous_state` took before this build's `dump_all` overwrote them."}, {"id": "sym:repo2graph/changelog.py::write_changelog", "label": "write_changelog", "type": "symbol", "deg": 7, "path": "repo2graph/changelog.py", "kind": "function", "lang": "python", "start_line": 209, "end_line": 233, "sig": "def write_changelog( outdir: str | Path, g: Graph, prev_state: tuple[list[dict[str, Any]], list[dict[str, Any]]] | None, short_sha: str | None, prev_short_sha: str | None, build_date: str, ) -> Path:", "doc": "Write `human/CHANGELOG.md` via the shared `atomic_write`. `prev_state` is `previous_state(outdir)`'s return value, captured before `dump_all` ran; None means \"no previous build\" and produces the `INITIAL_MESSAGE` file verbatim."}, {"id": "file:repo2graph/chunks.py", "label": "chunks.py", "type": "file", "deg": 27, "path": "repo2graph/chunks.py", "lang": "python", "lines": 282}, {"id": "sym:repo2graph/chunks.py::_split", "label": "_split", "type": "symbol", "deg": 7, "path": "repo2graph/chunks.py", "kind": "function", "lang": "python", "start_line": 43, "end_line": 75, "sig": "def _split(text: str, max_chars: int = MAX_CHARS):"}, {"id": "sym:repo2graph/chunks.py::build_chunks", "label": "build_chunks", "type": "symbol", "deg": 3, "path": "repo2graph/chunks.py", "kind": "function", "lang": "python", "start_line": 99, "end_line": 101, "sig": "def build_chunks(g, include_files: bool = True) -> list[dict]:", "doc": "All retrieval chunks as a list (stable public API)."}, {"id": "sym:repo2graph/chunks.py::iter_chunks", "label": "iter_chunks", "type": "symbol", "deg": 17, "path": "repo2graph/chunks.py", "kind": "function", "lang": "python", "start_line": 104, "end_line": 281, "sig": "def iter_chunks(g, include_files: bool = True):", "doc": "Yield chunk dicts ready for embedding, one at a time. A generator, not a list: on a large repo the chunk text is the single biggest allocation, so write_jsonl streams it straight to disk instead of holding every chunk in memory at once. Source text is dropped from the cache as soon as the last symbol on a file has been emitted."}, {"id": "file:repo2graph/cli.py", "label": "cli.py", "type": "file", "deg": 52, "path": "repo2graph/cli.py", "lang": "python", "lines": 847}, {"id": "sym:repo2graph/cli.py::_emit", "label": "_emit", "type": "symbol", "deg": 10, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 47, "end_line": 78, "sig": "def _emit(text: str) -> None:", "doc": "The single stdout write for the whole CLI. Cannot raise on encoding. A redirected or piped Windows stdout is a strict cp1252 TextIOWrapper, so `repo2graph rag \"...\" > pack.md` over any repository holding a single non-ASCII source byte would otherwise die with 'charmap' codec errors. Git Bash is worse: it hands a piped stdout `errors='surrogateescape'`, which still raises on any character cp1252 l…"}, {"id": "sym:repo2graph/cli.py::cmd_build", "label": "cmd_build", "type": "symbol", "deg": 10, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 81, "end_line": 130, "sig": "def cmd_build(args):"}, {"id": "sym:repo2graph/cli.py::_require_index", "label": "_require_index", "type": "symbol", "deg": 7, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 155, "end_line": 175, "sig": "def _require_index(out: Path, name: str) -> Path:"}, {"id": "sym:repo2graph/cli.py::cmd_embed", "label": "cmd_embed", "type": "symbol", "deg": 15, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 215, "end_line": 268, "sig": "def cmd_embed(args):", "doc": "Embed an index's chunks, reusing every vector whose text is unchanged."}, {"id": "sym:repo2graph/cli.py::cmd_query", "label": "cmd_query", "type": "symbol", "deg": 7, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 296, "end_line": 323, "sig": "def cmd_query(args):"}, {"id": "sym:repo2graph/cli.py::_rag_index_dir", "label": "_rag_index_dir", "type": "symbol", "deg": 10, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 333, "end_line": 353, "sig": "def _rag_index_dir(args) -> Path:", "doc": "Resolve the `rag` target to an index directory, building it if needed."}, {"id": "sym:repo2graph/cli.py::verify_rag", "label": "verify_rag", "type": "symbol", "deg": 6, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 356, "end_line": 424, "sig": "def verify_rag(idx, out, embed_model=None) -> tuple[dict, str | None]:", "doc": "Self-test the dense-retrieval path against one index. Answers the four questions that distinguish \"dense retrieval is working\" from \"dense retrieval silently is not\": are there vectors at all, which model and width were they built with, does the active embedder agree, and does every chunk actually have one. Args: idx: An open `Index`. out: The index directory, for error messages. embed_model: Mod…"}, {"id": "sym:repo2graph/cli.py::cmd_rag", "label": "cmd_rag", "type": "symbol", "deg": 8, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 449, "end_line": 482, "sig": "def cmd_rag(args):", "doc": "Pack an agent-ready, citation-carrying context for one question."}, {"id": "sym:repo2graph/cli.py::main", "label": "main", "type": "symbol", "deg": 19, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 610, "end_line": 842, "sig": "def main(argv=None):"}, {"id": "file:repo2graph/embed.py", "label": "embed.py", "type": "file", "deg": 14, "path": "repo2graph/embed.py", "lang": "python", "lines": 272}, {"id": "sym:repo2graph/embed.py::Embedder.encode", "label": "Embedder.encode", "type": "symbol", "deg": 13, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 45, "end_line": 45, "sig": "def encode(self, texts: list[str]) -> list[list[float]]:"}, {"id": "sym:repo2graph/embed.py::_npy_read", "label": "_npy_read", "type": "symbol", "deg": 14, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 71, "end_line": 117, "sig": "def _npy_read(path: Path) -> tuple[list, int]:", "doc": "Read a 2-D C-order '\u003cf4' NPY file; returns (rows, cols). Anything else -- a different dtype, Fortran order, a truncated header or a short payload -- is a ValueError, which load_vectors turns into \"no vectors\" rather than an exception in the middle of a query."}, {"id": "sym:repo2graph/embed.py::text_hash", "label": "text_hash", "type": "symbol", "deg": 7, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 129, "end_line": 133, "sig": "def text_hash(chunk) -> str:", "doc": "sha256 of a chunk's text. A chunk's vector depends on nothing else, so this is a sound reuse key even when the surrounding graph changed."}, {"id": "sym:repo2graph/embed.py::build_vectors", "label": "build_vectors", "type": "symbol", "deg": 10, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 157, "end_line": 185, "sig": "def build_vectors( chunks, embedder, batch: int = DEFAULT_BATCH, reuse=None ) -> dict[str, list[float]]:", "doc": "{chunk id: vector} for every chunk, embedding in batches. `reuse` is an optional {chunk id: vector} of vectors already known to be current (see cli.cmd_embed); those chunks are never handed to the embedder."}, {"id": "sym:repo2graph/embed.py::write_vectors", "label": "write_vectors", "type": "symbol", "deg": 11, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 188, "end_line": 217, "sig": "def write_vectors(path, vectors, model_id: str, dim: int, chunk_ids, text_hashes=None) -> int:", "doc": "Write vectors.npy plus its sibling vectors.meta.json; return the count. Row order is `chunk_ids` order, which is chunks.jsonl order, so re-running `embed` over an unchanged index reproduces the file byte for byte."}, {"id": "sym:repo2graph/embed.py::load_vectors", "label": "load_vectors", "type": "symbol", "deg": 8, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 220, "end_line": 240, "sig": "def load_vectors(path) -> tuple[dict[str, list[float]], dict]:", "doc": "Inverse of write_vectors: ({chunk id: vector}, meta). Raises ValueError/OSError on anything malformed; callers that must not fail (query.Index) catch both and fall back to BM25."}, {"id": "sym:repo2graph/embed.py::_SentenceTransformerEmbedder.encode", "label": "_SentenceTrans…", "type": "symbol", "deg": 16, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 253, "end_line": 255, "sig": "def encode(self, texts):"}, {"id": "file:repo2graph/events.py", "label": "events.py", "type": "file", "deg": 13, "path": "repo2graph/events.py", "lang": "python", "lines": 151}, {"id": "sym:repo2graph/events.py::encodable", "label": "encodable", "type": "symbol", "deg": 7, "path": "repo2graph/events.py", "kind": "function", "lang": "python", "start_line": 34, "end_line": 75, "sig": "def encodable(text: str, stream: Any) -> str:", "doc": "Return `text` reduced to something `stream` is guaranteed to accept. The stream's encoding and error handler are read at call time, not at import time: tests replace `sys.stdout` after import, and a caller may reconfigure it mid-run. Args: text: The text about to be written. stream: The destination stream, inspected for `.encoding`/`.errors`. Returns: `text` unchanged when the stream can represen…"}, {"id": "sym:repo2graph/events.py::write_safe", "label": "write_safe", "type": "symbol", "deg": 15, "path": "repo2graph/events.py", "kind": "function", "lang": "python", "start_line": 78, "end_line": 105, "sig": "def write_safe(stream: Any, text: str, newline: str = \"\\n\") -> None:", "doc": "Write `text` to `stream`, replacing anything it cannot encode. Never raises: a UnicodeEncodeError, a closed stream or a broken pipe all end as silence rather than as an exception in the caller. Args: stream: Destination, typically `sys.stdout` or `sys.stderr`. text: The line to write, without a trailing newline. newline: Appended to `text`; pass \"\" to suppress it."}, {"id": "sym:repo2graph/events.py::emit", "label": "emit", "type": "symbol", "deg": 6, "path": "repo2graph/events.py", "kind": "function", "lang": "python", "start_line": 120, "end_line": 150, "sig": "def emit( event: str, level: str = \"warning\", stream: TextIO | None = None, **fields: Any ) -> dict[str, Any]:", "doc": "Write one structured event as a single JSON line on stderr. Args: event: Machine-readable event name, e.g. `\"rag_fusion_disabled\"`. level: Severity label; \"warning\" by default. stream: Destination; defaults to `sys.stderr` resolved at call time. **fields: Additional JSON-serialisable fields merged into the record. Returns: The record that was emitted, so callers and tests can assert on it without…"}, {"id": "file:repo2graph/export.py", "label": "export.py", "type": "file", "deg": 53, "path": "repo2graph/export.py", "lang": "python", "lines": 1046}, {"id": "sym:repo2graph/export.py::atomic_write", "label": "atomic_write", "type": "symbol", "deg": 16, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 21, "end_line": 40, "sig": "def atomic_write(path: Path, mode: str = \"w\", **open_kw):", "doc": "Write via a sibling temp file renamed onto `path` only on a clean exit. A crash, exception or Ctrl-C mid-write then leaves the previous artifact (or none) intact rather than a truncated file that `query`/`map` would choke on. The temp file is in the target's own directory, so os.replace is atomic."}, {"id": "sym:repo2graph/export.py::make_paths", "label": "make_paths", "type": "symbol", "deg": 4, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 88, "end_line": 92, "sig": "def make_paths(outdir, name) -> list[Path]:"}, {"id": "sym:repo2graph/export.py::write_graphml", "label": "write_graphml", "type": "symbol", "deg": 12, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 324, "end_line": 446, "sig": "def write_graphml(g, path: Path):"}, {"id": "sym:repo2graph/export.py::write_cypher", "label": "write_cypher", "type": "symbol", "deg": 9, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 461, "end_line": 482, "sig": "def write_cypher(g, path: Path):"}, {"id": "sym:repo2graph/export.py::write_overview", "label": "write_overview", "type": "symbol", "deg": 11, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 485, "end_line": 517, "sig": "def write_overview(g, path: Path, top: int = 25):", "doc": "Human/LLM-readable repo map: top directories, hub files, entry points."}, {"id": "sym:repo2graph/export.py::write_overview_human", "label": "write_overview…", "type": "symbol", "deg": 14, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 562, "end_line": 657, "sig": "def write_overview_human(g, path: Path, top: int = 25):", "doc": "Structured, scannable repo map for `human/overview.md`. Unlike `write_overview` (still the agent/overview.md prose, unchanged), this reads edge-type and symbol-kind counts straight out of `g.stats` rather than rescanning `g.nodes`/`g.edges`, per the repo convention that `g.stats` is the single source of truth for those counts."}, {"id": "sym:repo2graph/export.py::write_manifest", "label": "write_manifest", "type": "symbol", "deg": 12, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 757, "end_line": 834, "sig": "def write_manifest(g, path: Path, written: list[str]):", "doc": "Describe the agent-facing output so a reader needs no other docs."}, {"id": "sym:repo2graph/export.py::_mark_has_vectors", "label": "_mark_has_vect…", "type": "symbol", "deg": 9, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 894, "end_line": 911, "sig": "def _mark_has_vectors(outdir) -> None:", "doc": "Flip stats.json's has_vectors to True after `embed` writes vectors.npy. Best-effort, same as register_written: a missing or unreadable stats.json (e.g. a fixture built with --formats that never writes one) is not embed's problem to fix, so any failure here is silently skipped."}, {"id": "sym:repo2graph/export.py::register_written", "label": "register_writt…", "type": "symbol", "deg": 16, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 914, "end_line": 945, "sig": "def register_written(outdir, names) -> bool:", "doc": "Merge `names` into an existing manifest's `written` and `files`. `embed` runs after `build` as a separate command, so it must append to the manifest dump_all already wrote rather than rewrite it: every other key -- counts, entrypoints, how_to_read -- is left exactly as it was. Returns False when there is no readable manifest to append to."}, {"id": "sym:repo2graph/export.py::load_parse_cache", "label": "load_parse_cac…", "type": "symbol", "deg": 9, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 977, "end_line": 1002, "sig": "def load_parse_cache(outdir: Path) -> dict:", "doc": "Read a previous build's parse cache out of an index directory. Every failure mode -- no index, no cache file, unreadable, malformed JSON, a format bump -- returns an empty dict, which makes the next build a full one. An incremental build that silently reuses entries it does not understand is the failure this whole feature was deferred to avoid, so the only safe response to an unrecognised cache i…"}, {"id": "sym:repo2graph/export.py::dump_all", "label": "dump_all", "type": "symbol", "deg": 20, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 1005, "end_line": 1045, "sig": "def dump_all(g, chunks, outdir: Path, formats: set[str], viz_nodes: int = MAX_NODES):", "doc": "Write the requested artifacts. `chunks` is an iterable of chunk dicts (a build_chunks generator) or None. Returns (written_paths, chunk_count)."}, {"id": "file:repo2graph/fetch.py", "label": "fetch.py", "type": "file", "deg": 35, "path": "repo2graph/fetch.py", "lang": "python", "lines": 272}, {"id": "sym:repo2graph/fetch.py::parse_spec", "label": "parse_spec", "type": "symbol", "deg": 6, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 78, "end_line": 90, "sig": "def parse_spec(spec: str) -> tuple[str, str]:", "doc": "'owner/repo', a GitHub URL or an SSH remote -> (owner, repo)."}, {"id": "sym:repo2graph/fetch.py::_auth_env", "label": "_auth_env", "type": "symbol", "deg": 9, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 105, "end_line": 131, "sig": "def _auth_env(token: str | None) -> dict:", "doc": "Environment carrying the clone credential out of band. The token must never be an argv element (ISS-16): it would be visible in `ps`/`/proc` to every other user. git reads http.extraheader from GIT_CONFIG_* for this one invocation only, so nothing lands on disk either."}, {"id": "sym:repo2graph/fetch.py::clone", "label": "clone", "type": "symbol", "deg": 13, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 134, "end_line": 195, "sig": "def clone( spec: str, dest: Path, ref: str | None = None, depth: int = 0, token: str | None = None ) -> Path:", "doc": "Clone a GitHub repo into dest/\u003crepo>. depth=0 means full history."}, {"id": "sym:repo2graph/fetch.py::index_github", "label": "index_github", "type": "symbol", "deg": 18, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 212, "end_line": 271, "sig": "def index_github( spec: str, outdir: Path, ref: str | None = None, depth: int = 0, git_history: int = 0, formats: str = \"jsonl,graphml,cypher,overview,html\", include=None, exclude=None, max_files: int = 0, keep_clone: Path | None = None, token: str | None", "doc": "Clone a GitHub repo, build its graph, write artifacts to outdir."}, {"id": "file:repo2graph/graph.py", "label": "graph.py", "type": "file", "deg": 46, "path": "repo2graph/graph.py", "lang": "python", "lines": 908}, {"id": "sym:repo2graph/graph.py::Graph", "label": "Graph", "type": "symbol", "deg": 7, "path": "repo2graph/graph.py", "kind": "class", "lang": "python", "start_line": 34, "end_line": 99, "sig": "class Graph:"}, {"id": "sym:repo2graph/graph.py::Graph.add_node", "label": "Graph.add_node", d. A file's `ParsedFile` is a pure function of its bytes and its language and nothing else, so reusing one for a file whose sha256 still matches is exact -- not an approximation. Everything downstream of parsing (the global name index, CALLS confidences, INHERITS, entrypoints and reach) is then recomputed from scratch over the full sym…"}, {"id": "sym:repo2graph/graph.py::parse_all", "label": "parse_all", "type": "symbol", "deg": 7, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 523, "end_line": 547, "sig": "def parse_all(files, jobs: int, config=None):", "doc": "Read and parse every file, in discovery order, across `jobs` processes. tree-sitter parsing is CPU bound and dominates a large build, so this is the difference between one core and all of them. Order is preserved, which keeps node ids and edge order identical to a serial run."}, {"id": "sym:repo2graph/graph.py::build", "label": "build", "type": "symbol", "deg": 30, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 551, "end_line": 784, "sig": "def build( root: Path, include=None, exclude=None, git_history: int = 0, max_files: int = 0, jobs: int = 0, cache: dict | None = None, max_call_candidates: int = 5, config=None, ) -> Graph:", "doc": "Parse `root` into a Graph. Args: root: Repository directory to index. include: Optional glob(s) restricting discovery. exclude: Optional glob(s) removing paths from discovery. git_history: When non-zero, add CO_CHANGE edges from the last N commits. max_files: When positive, index only the first N discovered files. jobs: Parser processes; 0 means one per core, 1 means serial. cache: A previous bui…"}, {"id": "sym:repo2graph/graph.py::add_cochange", "label": "add_cochange", "type": "symbol", "deg": 15, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 838, "end_line": 907, "sig": "def add_cochange(g: Graph, root: Path, commits: int, file_index: set[str], min_pairs: int = 3) , "kind": "function", "lang": "python", "start_line": 290, "end_line": 321, "sig": "def open_index(out, repo=None, cache=None) -> Index:", "doc": "One Index per output directory, reused for the life of the process. Building an Index reads and inverts every chunk; doing that per tool call would make the second call as expensive as the first. `repo` is the opt-in half. Without it this is what it has always been: open an index that exists, or exit naming the command that creates one. With it, an absent index is built from that directory first …"}, {"id": "sym:repo2graph/mcp.py::open_index_or_task", "label": "open_index_or_…", "type": "symbol", "deg": 6, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 324, "end_line": 363, "sig": "def open_index_or_task(out, repo=None, cache=None, tasks=None):", "doc": "Open the index, or start a background build and say so. Args: out: Index directory. repo: Repository to build from, or None. cache: A `ResultCache` to clear on a completed rebuild, or None. tasks: A `TaskManager` when `--async-build` is on, else None. Returns: `(index, None)` when an index is available, or `(None, message)` when a build is in flight or has failed -- the message being what the cal…"}, {"id": "sym:repo2graph/mcp.py::tool_repo_search", "label": "tool_repo_sear…", "type": "symbol", "deg": 6, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 374, "end_line": 400, "sig": "def tool_repo_search( index: Index, query: str, k: int = 8, hops: int = 1, budget_tokens=None ) -> str:", "doc": "Cited markdown for `query`, never wider than MCP_MAX_BUDGET_TOKENS."}, {"id": "sym:repo2graph/mcp.py::tool_repo_neighbours", "label": "tool_repo_neig…", "type": "symbol", "deg": 9, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 403, "end_line": 432, "sig": "def tool_repo_neighbours( index: Index, node_id: str, hops: int = 1, limit: int = MCP_NEIGHBOUR_LIMIT ) -> str:", "doc": "One graph hop from `node_id` — the thing grep cannot do."}, {"id": "sym:repo2graph/mcp.py::dispatch", "label": "dispatch", "type": "symbol", "deg": 9, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 516, "end_line": 584, "sig": "def dispatch(index: \"Index | None\", name: str, arguments: dict, cache=None, tasks=None) -> str:", "doc": "Route one tool call to its handler. Pure, so serve() holds no logic. Args: index: The open index every tool answers from. None is allowed only for `repo_build_status`, which reports on a build and therefore must be answerable while there is still no index to open. name: Tool name the caller asked for. arguments: The caller's arguments, which are JSON a model wrote and are treated as hostile throu…"}, {"id": "sym:repo2graph/mcp.py::serve", "label": "serve", "type": "symbol", "deg": 5, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 701, "end_line": 780, "sig": "def serve(out, repo=None, cache=None, tasks=None) -> None:", "doc": "Run the stdio MCP server against the index at `out`. Deliberately thin: every answer comes from dispatch(), which is tested without the SDK, so SDK API drift can break the wiring but nothing else."}, {"id": "sym:repo2graph/mcp.py::resolve_paths", "label": "resolve_paths", "type": "symbol", "deg": 3, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 783, "end_line": 805, "sig": "def resolve_paths(repo=None, out=None):", "doc": "Work out (index_dir, repo_to_build_from) from what the user passed. Returns a repo of None when there is nothing safe to infer, which turns auto-build off and leaves the \"build one first\" error in place. Only one convention is trusted: an index directory named `.r2g` belongs to the directory above it, which is how every command, doc and example in this project lays it out. Any other `--out` name …"}, {"id": "sym:repo2graph/mcp.py::main", "label": "main", "type": "symbol", "deg": 29, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 808, "end_line": 918, "sig": "def main(argv=None):"}, {"id": "sym:repo2graph/mcp.py::_auth_config", "label": "_auth_config", "type": "symbol", "deg": 5, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 1021, "end_line": 1038, "sig": "def _auth_config(args):", "doc": "Build an AuthConfig from parsed arguments. The token may come from `--auth-token` or the `R2G_AUTH_TOKEN` environment variable -- the same shape as the `GH_TOKEN`/`GITHUB_TOKEN` fallback in `fetch.py`. The flag wins when both are set, so it stays usable for interactive/CI convenience; the env var exists so the token need not appear in argv (and therefore in `ps`/`/proc`) at all."}, {"id": "file:repo2graph/parse.py", "label": "parse.py", "type": "file", "deg": 38, "path": "repo2graph/parse.py", "lang": "python", "lines": 818}, {"id": "sym:repo2graph/parse.py::discover", "label": "discover", "type": "symbol", "deg": 4, "path": "repo2graph/parse.py", "kind": "function", "lang": "python", "start_line": 375, "end_line": 434, "sig": "def discover( root: Path, include_globs=None, exclude_globs=None, stats=None, config: BuildConfig | None = None, ):", "doc": "Yield (relative_path, absolute_path) for candidate source files."}, {"id": "sym:repo2graph/parse.py::parse_source", "label": "parse_source", "type": "symbol", "deg": 11, "path": "repo2graph/parse.py", "kind": "function", "lang": "python", "start_line": 706, "end_line": 817, "sig": "def parse_source(source: bytes, lang: str, filepath: Path | str | None = None) -> ParsedFile:"}, {"id": "file:repo2graph/query.py", "label": "query.py", "type": "file", "deg": 44, "path": "repo2graph/query.py", "lang": "python", "lines": 928}, {"id": "sym:repo2graph/query.py::_is_secret_path", "label": "_is_secret_path", "type": "symbol", "deg": 10, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 130, "end_line": 163, "sig": "def _is_secret_path(path: str) -> bool:", "doc": "Return True if path points to a sensitive file (secrets, keys, credentials)."}, {"id": "sym:repo2graph/query.py::read_jsonl", "label": "read_jsonl", "type": "symbol", "deg": 7, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 166, "end_line": 182, "sig": "def read_jsonl(path: Path) -> list:", "doc": "Load a JSONL file written by export.write_jsonl. newline=\"\\n\" matters: json.dumps(ensure_ascii=False) passes U+2028, U+2029 and U+0085 through verbatim, and both str.splitlines() and universal-newline mode treat those as line breaks, which would cut records in half."}, {"id": "sym:repo2graph/query.py::count_tokens", "label": "count_tokens", "type": "symbol", "deg": 4, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 185, "end_line": 188, "sig": "def count_tokens(text: str) -> int:", "doc": "The default token estimate: len(text) // CHARS_PER_TOKEN, never 0 for a non-empty string (a block that costs nothing would defeat any budget)."}, {"id": "sym:repo2graph/query.py::Index", "label": "Index", "type": "symbol", "deg": 17, "path": "repo2graph/query.py", "kind": "class", "lang": "python", "start_line": 206, "end_line": 805, "sig": "class Index: # (fused, candidates) for the most recent score_rrf call, or None if no # fused query has run on this Index yet. A class-level default so every # Index has the attribute without __init__ having to care."}, {"id": "sym:repo2graph/query.py::Index.__init__", "label": "Index.__init__", "type": "symbol", "deg": 9, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 212, "end_line": 249, "sig": "def __init__(self, outdir: Path):"}, {"id": "sym:repo2graph/query.py::Index.fuse_ok", "label": "Index.fuse_ok", "type": "symbol", "deg": 4, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 275, "end_line": 307, "sig": "def fuse_ok(self, embedder) -> tuple[bool, str]:", "doc": "May `embedder`'s query vectors be fused with this index's vectors? A silent model or width mismatch is worse than no vectors at all: the rankings stay plausible while being meaningless, so the answer is a refusal naming both sides rather than a best effort."}, {"id": "sym:repo2graph/query.py::Index.score", "label": "Index.score", "type": "symbol", "deg": 8, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 369, "end_line": 387, "sig": "def score(self, query: str) -> list[tuple[float, int]]:"}, {"id": "sym:repo2graph/query.py::Index.score_rrf", "label": "Index.score_rrf", "type": "symbol", "deg": 10, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 411, "end_line": 459, "sig": "def score_rrf(self, query: str, vectors=None, embedder=None) -> list[tuple[float, int]]:", "doc": "BM25 fused with an optional dense ranking by reciprocal rank fusion. With neither `vectors` nor `embedder` this is exactly `score()` — the zero-dependency default path. `embedder` is any object with `.encode(list[str]) -> list[sequence[float]]` (sentence-transformers satisfies it); `vectors` is a mapping of chunk index -> vector, which may carry the query vector under the key \"query\". Similarity …"}, {"id": "sym:repo2graph/query.py::Index._vectors_for", "label": "Index._vectors…", "type": "symbol", "deg": 8, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 461, "end_line": 520, "sig": "def _vectors_for(self, query, candidates, vectors, embedder):", "doc": "Query vector plus one vector per candidate, or a reason there is none. Args: query: The raw query string. candidates: Chunk list-indices BM25 shortlisted, in rank order. vectors: Index-keyed vector mapping, or None to embed on the fly. embedder: An object with `.encode(list[str])`, or None. Returns: `(query_vector, candidate_vectors, reason)`. On success `reason` is the empty string; on failure t…"}, {"id": "sym:repo2graph/query.py::Index.expand", "label": "Index.expand", "type": "symbol", "deg": 11, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 522, "end_line": 568, "sig": "def expand( self, seed_nodes, hops=1, edge_types=None, per_hop=6, min_confidence=1.0, edge_dirs=None ):", "doc": "Walk `hops` edges out from `seed_nodes`, newest frontier first. `min_confidence` gates CALLS edges only: call resolution is name-based and an overloaded name fans out to several candidates at 1/n confidence, while IMPORTS/DEFINES/INHERITS carry no `confidence` key at all and must never be dropped by the gate. `edge_dirs` maps an edge type to the directions worth following (see DEFAULT_EDGE_DIRS)."}, {"id": "sym:repo2graph/query.py::Index.retrieve", "label": "Index.retrieve", "type": "symbol", "deg": 12, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 570, "end_line": 636, "sig": "def retrieve( self, query: str, k: int = 8, hops: int = 1, budget_chars: int = 24000, *, min_confidence: float | None = None, vectors=None, embedder=None, ):", "doc": "Lexical seeds plus their graph neighbours, budgeted on chunk text. `budget_chars` bounds the sum of the returned chunks' `text` only — it says nothing about how a caller renders them. pack_context() uses the other model (the whole rendered markdown); do not unify the two. `min_confidence=None` means \"do not filter CALLS on confidence\", which is this method's historical behaviour. With `vectors` a…"}, {"id": "sym:repo2graph/query.py::Index.pack_context", "label": "Index.pack_con…", "type": "symbol", "deg": 14, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 665, "end_line": 805, "sig": "def pack_context( self, query: str, k: int = 8, hops: int = 1, budget_chars: int = 24000, min_confidence: float = 1.0, expand_graph: bool = True, vectors=None, embedder=None, exclude_secrets: bool = False, budget", "doc": "An agent-ready markdown pack: repo map, `---`, then cited chunks. `budget_chars` bounds the WHOLE returned markdown — map prepend, `---` separator and every `### [cite: ...]` header included — unlike retrieve(), which budgets chunk text only. `budget_chars \u003c= 0` means unbounded. Spending order is map (capped at MAP_BUDGET_FRAC of the budget), then seeds in score order at full text, then graph nei…"}, {"id": "file:repo2graph/tasks.py", "label": "tasks.py", "type": "file", "deg": 11, "path": "repo2graph/tasks.py", "lang": "python", "lines": 264}, {"id": "sym:repo2graph/tasks.py::BuildTask.snapshot", "label": "BuildTask.snap…", "type": "symbol", "deg": 1, "path": "repo2graph/tasks.py", "kind": "function", "lang": "python", "start_line": 91, "end_line": 101, "sig": "def snapshot(self) -> dict[str, Any]:", "doc": "The status document `repo_build_status` returns."}, {"id": "sym:repo2graph/tasks.py::TaskManager", "label": "TaskManager", "type": "symbol", "deg": 6, "path": "repo2graph/tasks.py", "kind": "class", "lang": "python", "start_line": 104, "end_line": 221, "sig": "class TaskManager:", "doc": "Owns at most one in-flight build per index directory. One per directory, not one per request: two concurrent builds writing the same artifacts would race each other through `atomic_write`, and the loser's partial work would be silently discarded. A second request for a directory already building joins the existing task instead of starting another. Args: builder: Callable taking `(repo, out)` that…"}, {"id": "sym:repo2graph/tasks.py::TaskManager.start", "label": "TaskManager.st…", "type": "symbol", "deg": 10, "path": "repo2graph/tasks.py", "kind": "function", "lang": "python", "start_line": 133, "end_line": 160, "sig": "def start(self, repo: Any, out: Any) -> BuildTask:", "doc": "Begin (or join) a background build for `out`. Args: repo: Repository to index. out: Index directory to write. Returns: The task covering this build, new or already running."}, {"id": "sym:repo2graph/tasks.py::TaskManager.get", "label": "TaskManager.get", "type": "symbol", "deg"     n.vx = (n.vx - n.x * GRAVITY * alpha) * DAMP;
    n.vy = (n.vy - n.y * GRAVITY * alpha) * DAMP;
    n.x += Math.max(-MAX_STEP, Math.min(MAX_STEP, n.vx));
    n.y += Math.max(-MAX_STEP, Math.min(MAX_STEP, n.vy));
  }
  alpha *= 0.985;
}

function render() {
  const shownLinks = links.reduce((n, l) => n + (linkShown(l) ? 1 : 0), 0);
  const showLabels = scale >= 0.45 && shownLinks <= 420;
  for (const l of links) {
    const on = linkShown(l);
    l.line.style.display = on ? "" : "none";
    l.text.style.display = on && showLabels ? "" : "none";
    if (!on) continue;
    const a = l.source, b = l.target;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 0.01;
    const ux = dx / d, uy = dy / d;
    const x1 = a.x + ux * (radius(a) + 2), y1 = a.y + uy * (radius(a) + 2);
    const x2 = b.x - ux * (radius(b) + 7), y2 = b.y - uy * (radius(b) + 7);
    l.line.setAttribute("x1", x1.toFixed(1)); l.line.setAttribute("y1", y1.toFixed(1));
    l.line.setAttribute("x2", x2.toFixed(1)); l.line.setAttribute("y2", y2.toFixed(1));
    if (showLabels) {
      let ang = Math.atan2(dy, dx) * 180 / Math.PI;
      if (ang > 90 || ang < -90) ang += 180;   // labels stay right way up
      l.text.setAttribute("transform",
        "translate(" + ((x1 + x2) / 2).toFixed(1) + "," + ((y1 + y2) / 2).toFixed(1) +
        ") rotate(" + ang.toFixed(1) + ")");
    }
  }
  for (const n of nodes) {
    n.el.style.display = nodeShown(n) ? "" : "none";
    n.el.setAttribute("transform",
      "translate(" + n.x.toFixed(1) + "," + n.y.toFixed(1) + ")");
  }
  view.setAttribute("transform",
    "translate(" + tx.toFixed(1) + "," + ty.toFixed(1) + ") scale(" + scale.toFixed(3) + ")");
}

function frame() {
  step(); render();
  raf = (alpha > 0.02 || drag) ? requestAnimationFrame(frame) : null;
}
function reheat(a) {
  alpha = Math.max(alpha, a === undefined ? 0.6 : a);
  if (!raf) raf = requestAnimationFrame(frame);
}
function fit() {
  const active = nodes.filter(nodeShown);
  if (!active.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of active) {
    const r = radius(n) + 26;
    x0 = Math.min(x0, n.x - r); y0 = Math.min(y0, n.y - r);
    x1 = Math.max(x1, n.x + r); y1 = Math.max(y1, n.y + r);
  }
  const box = svg.getBoundingClientRect();
  scale = Math.max(0.15, Math.min(box.width / (x1 - x0), box.height / (y1 - y0), 1.6));
  tx = box.width / 2 - ((x0 + x1) / 2) * scale;
  ty = box.height / 2 - ((y0 + y1) / 2) * scale;
  render();
}
// How many settle iterations a relayout may run before it gives up and fits
// whatever it has. Overridable per page with data-max-iterations on #stage, so
// a very large graph can be given a longer settle without a rebuild.
const DEFAULT_MAX_ITERATIONS = 500;
// Iterations per animation frame. The browser gets control back between
// batches, so the page stays responsive and the progress bar actually paints.
const SETTLE_BATCH = 20;

function maxIterations() {
  const raw = parseInt(stage.dataset.maxIterations, 10);
  return (Number.isFinite(raw) && raw > 0) ? raw : DEFAULT_MAX_ITERATIONS;
}

function showProgress(done, total) {
  progress.hidden = false;
  progressBar.style.width = Math.round((done / total) * 100) + "%";
}

function relayout() {
  scatter();
  document.querySelectorAll(".node.pinned").forEach(el => el.classList.remove("pinned"));
  alpha = 1;
  // The settle used to run as one synchronous `while` loop, which blocks the
  // browser's main thread for its whole duration: on a large graph the page is
  // frozen -- no paint, no input, no scroll -- and looks hung. Iteration count
  // was capped to bound that, but a bounded freeze is still a freeze.
  //
  // Now it runs in small batches across animation frames. The thread is handed
  // back between batches, so the layout is visibly converging and the page
  // stays interactive while it does. Cancelling an in-flight settle matters
  // too: two overlapping relayouts would otherwise fight over `alpha`.
  if (settleRaf) cancelAnimationFrame(settleRaf);
  const cap = maxIterations();
  let iters = 0;
  function settle() {
    for (let i = 0; i < SETTLE_BATCH && alpha > 0.02 && iters < cap; i++) {
      step(); iters++;
    }
    showProgress(iters, cap);
    render();
    if (alpha > 0.02 && iters < cap) {
      settleRaf = requestAnimationFrame(settle);
      return;
    }
    settleRaf = null;
    progress.hidden = true;
    fit();
  }
  settleRaf = requestAnimationFrame(settle);
}

// ---------- selection + details ----------
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function kv(parent, key, value) {
  if (value === undefined || value === null || value === "") return;
  const row = el("div", "kv");
  row.append(el("span", "", key), el("span", "", String(value)));
  parent.appendChild(row);
}
function emptyDetails() {
  panel.replaceChildren(el("p", "sub", "Click a node to see what it is and what it touches."));
}
function showDetails(n) {
  panel.replaceChildren();
  const chip = el("span", "chip", n.type);
  chip.style.background = colorOf(n);
  panel.append(chip, el("h2", "", n.label));
  const box = el("div");
  kv(box, "id", n.id);
  kv(box, "path", n.path);
  kv(box, "kind", n.kind);
  kv(box, "lang", n.lang);
  kv(box, "lines", n.start_line ? n.start_line + "-" + n.end_line : n.lines);
  kv(box, "degree", n.deg);
  panel.appendChild(box);
  if (n.sig) { panel.append(el("h2", "", "signature"), el("pre", "", n.sig)); }
  if (n.doc) { panel.append(el("h2", "", "doc"), el("pre", "", n.doc)); }

  const list = neighbours(n.id);
  panel.appendChild(el("h2", "", "connections (" + list.length + ")"));
  for (const link of list.slice(0, 80)) {
    const b = el("button", "nb");
    const dot = el("span", "swatch");
    dot.style.background = colorOf(link.other);
    dot.style.display = "inline-block";
    dot.style.marginRight = "6px";
    b.append(dot, document.createTextNode(
      (link.dir === "out" ? "-[" : "<-[") + link.type + (link.dir === "out" ? "]-> " : "]- ") +
      link.other.label));
    b.addEventListener("click", () => selectNode(link.other, true));
    panel.appendChild(b);
  }
}
// ---------- focus mode + search: opacity combines, most restrictive wins ----------
// focus mode: clicked node 1, 1-hop .8, 2-hop .4, everything else .1
// search mode: matching 1, non-matching .15
// A node under both dims to whichever number is lower -- Math.min, per node.
const FOCUS_OPACITY = [1, 0.8, 0.4];
const FOCUS_FAR_OPACITY = 0.1;
const SEARCH_MISS_OPACITY = 0.15;
let focusNode = null;
let focusDist = new Map();
let searchQuery = "";

function computeFocusDistances(n) {
  const dist = new Map([[n.id, 0]]);
  const frontier = neighbours(n.id).map(l => l.other);
  for (const m of frontier) if (!dist.has(m.id)) dist.set(m.id, 1);
  for (const m of frontier) {
    for (const link of neighbours(m.id)) {
      if (!dist.has(link.other.id)) dist.set(link.other.id, 2);
    }
  }
  return dist;
}
function opacityFor(n) {
  let o = 1;
  if (focusNode) {
    const d = focusDist.get(n.id);
    o = Math.min(o, d === undefined ? FOCUS_FAR_OPACITY : FOCUS_OPACITY[d]);
  }
  if (searchQuery) {
    o = Math.min(o, n.hay.includes(searchQuery) ? 1 : SEARCH_MISS_OPACITY);
  }
  return o;
}
function applyOpacity() {
  for (const n of nodes) {
    n.el.style.opacity = opacityFor(n);
    n.el.classList.toggle("hit", searchQuery !== "" && n.hay.includes(searchQuery));
    n.el.classList.toggle("focused", focusNode === n);
  }
}
function clearFocus() {
  focusNode = null;
  focusDist = new Map();
  applyOpacity();
}

function selectNode(n, centre) {
  selected = n;
  focusNode = n;
  focusDist = computeFocusDistances(n);
  applyOpacity();
  for (const l of links) {
    const on = l.source.id === n.id || l.target.id === n.id;
    l.line.classList.toggle("dim", !on);
    l.text.classList.toggle("dim", !on);
  }
  if (centre) centreOn(n);
  showDetails(n);
}
function clearSelection() {
  selected = null;
  clearFocus();
  for (const l of links) { l.line.classList.remove("dim"); l.text.classList.remove("dim"); }
  emptyDetails();
}
function centreOn(n) {
  const box = svg.getBoundingClientRect();
  tx = box.width / 2 - n.x * scale;
  ty = box.height / 2 - n.y * scale;
  render();
}

// ---------- controls ----------
function legendRow(host, key, count, colour, kind, desc) {
  const wrap = el("div");
  const label = el("label");
  const box = el("input");
  box.type = "checkbox";
  box.checked = !(kind === "node" ? hiddenNodeTypes : hiddenEdgeTypes).has(key);
  box.addEventListener("change", () => {
    const hidden = kind === "node" ? hiddenNodeTypes : hiddenEdgeTypes;
    if (box.checked) hidden.delete(key); else hidden.add(key);
    reheat(0.5);
  });
  const mark = el("span", kind === "node" ? "swatch" : "bar");
  if (colour) mark.style.background = colour;
  label.append(box, mark, el("span", "", key), el("span", "count", count));
  wrap.appendChild(label);
  if (desc) wrap.appendChild(el("div", "legend-desc", desc));
  host.appendChild(wrap);
}
for (const [type, count] of DATA.nodeTypes) {
  legendRow(document.getElementById("node-legend"), type, count,
            DATA.colors[type] || DATA.colors._, "node", DATA.nodeDesc[type]);
}
for (const [type, count] of DATA.edgeTypes) {
  legendRow(document.getElementById("edge-legend"), type, count, null, "edge", DATA.edgeDesc[type]);
}
document.getElementById("counts").textContent =
  nodes.length + " of " + DATA.totals.nodes + " nodes · " +
  links.length + " of " + DATA.totals.edges + " edges";

// ---------- legend collapse, persisted per-viewer ----------
const legendToggle = document.getElementById("legend-toggle");
const legendBody = document.getElementById("legend-body");
const legendChevron = document.getElementById("legend-chevron");
const LEGEND_COLLAPSE_KEY = "r2g-legend-collapsed";
function setLegendCollapsed(collapsed) {
  legendBody.classList.toggle("collapsed", collapsed);
  legendChevron.textContent = collapsed ? "▸" : "▾";
  try { localStorage.setItem(LEGEND_COLLAPSE_KEY, collapsed ? "1" : "0"); } catch (_) {}
}
let legendCollapsed = false;
try { legendCollapsed = localStorage.getItem(LEGEND_COLLAPSE_KEY) === "1"; } catch (_) {}
setLegendCollapsed(legendCollapsed);
legendToggle.addEventListener("click", () => {
  setLegendCollapsed(!legendBody.classList.contains("collapsed"));
});

// ---------- search: highlight, dropdown, pan/zoom to a result ----------
const search = document.getElementById("search");
const searchWrap = document.getElementById("search-wrap");
const searchResults = document.getElementById("search-results");
function matchesFor(q) {
  return q ? nodes.filter(n => n.hay.includes(q)).slice(0, 30) : [];
}
function renderSearchResults(q) {
  searchResults.replaceChildren();
  const matches = matchesFor(q);
  if (!matches.length) { searchResults.hidden = true; return; }
  for (const n of matches) {
    const row = el("div", "search-result");
    row.tabIndex = 0;
    const dot = el("span", "swatch");
    dot.style.background = colorOf(n);
    row.append(dot, document.createTextNode(n.label + "  ·  " + n.type));
    row.addEventListener("click", () => {
      searchResults.hidden = true;
      selectNode(n, true);
    });
    searchResults.appendChild(row);
  }
  searchResults.hidden = false;
}
function applySearch(q) {
  searchQuery = q;
  applyOpacity();
  renderSearchResults(q);
}
search.addEventListener("input", () => applySearch(search.value.trim().toLowerCase()));
search.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const q = search.value.trim().toLowerCase();
  const hit = q && nodes.find(n => nodeShown(n) && n.hay.includes(q));
  if (hit) { searchResults.hidden = true; selectNode(hit, true); }
});
document.addEventListener("pointerdown", ev => {
  if (!searchWrap.contains(ev.target)) searchResults.hidden = true;
});
// Cmd/Ctrl+F focuses the search box instead of the browser's own find-in-page;
// Escape clears whichever of search / focus mode is active, search box first.
window.addEventListener("keydown", ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "f") {
    ev.preventDefault();
    search.focus();
    search.select();
    return;
  }
  if (ev.key !== "Escape") return;
  if (document.activeElement === search && search.value) {
    search.value = "";
    applySearch("");
    searchResults.hidden = true;
  } else if (focusNode) {
    clearSelection();
  }
});

document.getElementById("btn-fit").addEventListener("click", fit);
document.getElementById("btn-relayout").addEventListener("click", relayout);
document.getElementById("btn-unpin").addEventListener("click", () => {
  for (const n of nodes) { n.fx = null; n.fy = null; n.el.classList.remove("pinned"); }
  reheat(0.6);
});
document.getElementById("btn-clear-focus").addEventListener("click", clearSelection);

// ---------- pointer: drag nodes, pan and zoom the canvas ----------
function toGraph(ev) {
  const box = svg.getBoundingClientRect();
  return [(ev.clientX - box.left - tx) / scale, (ev.clientY - box.top - ty) / scale];
}
function startDrag(ev, n) {
  ev.stopPropagation();
  drag = n;
  n.fx = n.x; n.fy = n.y;
  n.el.classList.add("pinned");
  svg.setPointerCapture(ev.pointerId);
  reheat(0.4);
}
svg.addEventListener("pointerdown", ev => {
  if (ev.target.closest(".node")) return;
  pan = { x: ev.clientX, y: ev.clientY, tx: tx, ty: ty, moved: false };
  svg.classList.add("panning");
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove", ev => {
  if (drag) {
    const p = toGraph(ev);
    drag.fx = p[0]; drag.fy = p[1];
    reheat(0.3);
  } else if (pan) {
    tx = pan.tx + (ev.clientX - pan.x);
    ty = pan.ty + (ev.clientY - pan.y);
    if (Math.abs(ev.clientX - pan.x) + Math.abs(ev.clientY - pan.y) > 3) pan.moved = true;
    render();
  }
});
svg.addEventListener("pointerup", ev => {
  if (pan && !pan.moved && selected) clearSelection();
  drag = null; pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
});
svg.addEventListener("pointercancel", ev => {
  drag = null; pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
});
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const box = svg.getBoundingClientRect();
  const mx = ev.clientX - box.left, my = ev.clientY - box.top;
  const next = Math.max(0.12, Math.min(4, scale * Math.exp(-ev.deltaY * 0.0015)));
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next;
  render();
}, { passive: false });
window.addEventListener("resize", render);

emptyDetails();
relayout();
</script>
</body>
</html>
