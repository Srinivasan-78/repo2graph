.py", "type": "file", "deg": 48, "path": "repo2graph/export.py", "lang": "python", "lines": 588}, {"id": "sym:repo2graph/export.py::atomic_write", "label": "atomic_write", "type": "symbol", "deg": 13, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 24, "end_line": 43, "sig": "def atomic_write(path: Path, mode: str = \"w\", **open_kw):", "doc": "Write via a sibling temp file renamed onto `path` only on a clean exit. A crash, exception or Ctrl-C mid-write then leaves the previous artifact (or none) intact rather than a truncated file that `query`/`map` would choke on. The temp file is in the target's own directory, so os.replace is atomic."}, {"id": "sym:repo2graph/export.py::rels", "label": "rels", "type": "symbol", "deg": 5, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 60, "end_line": 62, "sig": "def rels(name: str) -> list[str]:", "doc": "Every path an artifact is written to, relative to the output directory."}, {"id": "sym:repo2graph/export.py::rel", "label": "rel", "type": "symbol", "deg": 3, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 65, "end_line": 67, "sig": "def rel(name: str) -> str:", "doc": "'nodes.jsonl' -> 'agent/nodes.jsonl'. The path readers should use."}, {"id": "sym:repo2graph/export.py::path", "label": "path", "type": "symbol", "deg": 4, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 70, "end_line": 72, "sig": "def path(outdir, name) -> Path:", "doc": "The path an artifact is read back from."}, {"id": "sym:repo2graph/export.py::paths", "label": "paths", "type": "symbol", "deg": 4, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 75, "end_line": 76, "sig": "def paths(outdir, name) -> list[Path]:"}, {"id": "sym:repo2graph/export.py::make_path", "label": "make_path", "type": "symbol", "deg": 5, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 79, "end_line": 83, "sig": "def make_path(outdir, name) -> Path:", "doc": "Like path(), but creates the section directory first."}, {"id": "sym:repo2graph/export.py::make_paths", "label": "make_paths", "type": "symbol", "deg": 4, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 86, "end_line": 90, "sig": "def make_paths(outdir, name) -> list[Path]:"}, {"id": "sym:repo2graph/export.py::write_jsonl", "label": "write_jsonl", "type": "symbol", "deg": 9, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 101, "end_line": 113, "sig": "def write_jsonl(path: Path, rows) -> int:", "doc": "Stream `rows` to `path` as JSONL; return how many were written. newline=\"\\n\" (ISS-28) + atomic: a crash mid-write must not leave a truncated last line that read_jsonl's json.loads then dies on. Streaming means `rows` may be a generator (build_chunks) that is never fully materialised."}, {"id": "sym:repo2graph/export.py::_grid_pairs", "label": "_grid_pairs", "type": "symbol", "deg": 5, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 130, "end_line": 147, "sig": "def _grid_pairs(pos, cell):", "doc": "Yield the node pairs sitting within one grid cell of each other. Every pair lands in the same bucket or in two adjacent ones, and each unordered pair is yielded once: only four of the eight neighbouring cells are scanned, the other four see the pair from their own side."}, {"id": "sym:repo2graph/export.py::_spring", "label": "_spring", "type": "symbol", "deg": 6, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 150, "end_line": 195, "sig": "def _spring(nodes, adjacency, iterations):", "doc": "Fruchterman-Reingold in pure Python: networkx's needs numpy, we do not. Repulsion runs only between nodes less than 2k apart, bucketed on a grid. Past that distance the k^2/d term moves a node by a rounding error, while the all-pairs form costs O(n^2) per iteration and dominates big exports."}, {"id": "sym:repo2graph/export.py::_layout", "label": "_layout", "type": "symbol", "deg": 9, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 225, "end_line": 253, "sig": "def _layout(g, sizes):", "doc": "Node positions in points, spread so labels do not collide."}, {"id": "sym:repo2graph/export.py::_separate", "label": "_separate", "type": "symbol", "deg": 5, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 262, "end_line": 300, "sig": "def _separate(pos, sizes, iterations):", "doc": "Push overlapping boxes apart; the spring layout only knows points. The grid cell is as wide as the widest box, so two overlapping boxes always share a cell or sit in adjacent ones and no pair is missed."}, {"id": "sym:repo2graph/export.py::_xml_safe", "label": "_xml_safe", "type": "symbol", "deg": 4, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 303, "end_line": 317, "sig": "def _xml_safe(text: str) -> str:", "doc": "Drop characters that are not legal in XML 1.0. A C0 control char (\\x0b, \\x0c, \\x00) sitting in a docstring or signature is written verbatim by ElementTree and then makes the file unparseable by any conforming reader (ISS-27). Legal set: tab, LF, CR, >=0x20 minus the surrogate block, up to 0x10FFFF, excluding 0xFFFE/0xFFFF."}, {"id": "sym:repo2graph/export.py::write_graphml", "label": "write_graphml", "type": "symbol", "deg": 22, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 320, "end_line": 409, "sig": "def write_graphml(g, path: Path):"}, {"id": "sym:repo2graph/export.py::write_graphml.key_for", "label": "write_graphml.…", "type": "symbol", "deg": 6, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 333, "end_line": 343, "sig": "def key_for(scope: str, name: str, value) -> str:"}, {"id": "sym:repo2graph/export.py::write_graphml.add_data", "label": "write_g ", "lines": 219}, {"id": "sym:repo2graph/fetch.py::_rmtree", "label": "_rmtree", "type": "symbol", "deg": 2, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 24, "end_line": 43, "sig": "def _rmtree(path: Path) -> None:", "doc": "Best-effort recursive delete of a temp clone. Git marks pack files under .git/objects read-only; on Windows os.unlink then raises PermissionError and shutil.rmtree(ignore_errors=True) would leave the whole clone (often hundreds of MB) behind. Clear the bit and retry."}, {"id": "sym:repo2graph/fetch.py::_git_version", "label": "_git_version", "type": "symbol", "deg": 3, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 52, "end_line": 62, "sig": "def _git_version() -> tuple[int, ...]:"}, {"id": "sym:repo2graph/fetch.py::parse_spec", "label": "parse_spec", "type": "symbol", "deg": 6, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 65, "end_line": 77, "sig": "def parse_spec(spec: str) -> tuple[str, str]:", "doc": "'owner/repo', a GitHub URL or an SSH remote -> (owner, repo)."}, {"id": "sym:repo2graph/fetch.py::_redact", "label": "_redact", "type": "symbol", "deg": 3, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 80, "end_line": 89, "sig": "def _redact(msg: str, token: str | None) -> str:", "doc": "Strip the token, its base64 'basic' form, and URL-encoded form from user-facing text (SH-3)."}, {"id": "sym:repo2graph/fetch.py::_auth_env", "label": "_auth_env", "type": "symbol", "deg": 7, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 92, "end_line": 118, "sig": "def _auth_env(token: str | None) -> dict:", "doc": "Environment carrying the clone credential out of band. The token must never be an argv element (ISS-16): it would be visible in `ps`/`/proc` to every other user. git reads http.extraheader from GIT_CONFIG_* for this one invocation only, so nothing lands on disk eithe ead_and_parse(item):", "doc": "Read one file and parse it if it is code. Top level, and returns only counts plus the ParsedFile, so a process pool can pickle both the call and its result."}, {"id": "sym:repo2graph/graph.py::resolve_jobs", "label": "resolve_jobs", "type": "symbol", "deg": 3, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 200, "end_line": 204, "sig": "def resolve_jobs(jobs: int) -> int:", "doc": "0 means one worker per core, capped so the parent keeps up with results."}, {"id": "sym:repo2graph/graph.py::parse_all", "label": "parse_all", "type": "symbol", "deg": 9, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 207, "end_line": 230, "sig": "def parse_all(files, jobs: int):", "doc": "Read and parse every file, in discovery order, across `jobs` processes. tree-sitter parsing is CPU bound and dominates a large build, so this is the difference between one core and all of them. Order is preserved, which keeps node ids and edge order identical to a serial run."}, {"id": "sym:repo2graph/graph.py::build", "label": "build", "type": "symbol", "deg": 37, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 234, "end_line": 343, "sig": "def build(root: Path, include=None, exclude=None, git_history: int = 0, max_files: int = 0, jobs: int = 0) -> Graph:"}, {"id": "sym:repo2graph/graph.py::mark_entrypoints", "label": "mark_entrypoin…", "type": "symbol", "deg": 8, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 350, "end_line": 375, "sig": "def mark_entrypoints(g: Graph):", "doc": "Flag the call-graph roots: symbols nothing else in the repo calls. Those are the doors into a codebase — CLI commands, request handlers, test bodies, public API — and they are where a reader tracing a flow has to start. A symbol nested inside a function is skipped: an uncalled closure is dead weight, not a door. `reach` (how many symbols the root can reach — the zero-dependency default path. `embedder` is any object with `.encode(list[str]) -> list[sequence[float]]` (sentence-transformers satisfies it); `vectors` is a mapping of chunk index -> vector, which may carry the query vector under the key \"query\". Similarity …"}, {"id": "sym:repo2graph/query.py::Index._vectors_for", "label": "Index._vectors…", "type": "symbol", "deg": 6, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 286, "end_line": 301, "sig": "def _vectors_for(self, query, candidates, vectors, embedder):"}, {"id": "sym:repo2graph/query.py::Index.expand", "label": "Index.expand", "type": "symbol", "deg": 15, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 303, "end_line": 346, "sig": "def expand(self, seed_nodes, hops=1, edge_types=None, per_hop=6, min_confidence=1.0, edge_dirs=None):", "doc": "Walk `hops` edges out from `seed_nodes`, newest frontier first. `min_confidence` gates CALLS edges only: call resolution is name-based and an overloaded name fans out to several candidates at 1/n confidence, while IMPORTS/DEFINES/INHERITS carry no `confidence` key at all and must never be dropped by the gate. `edge_dirs` maps an edge type to the directions worth following (see DEFAULT_EDGE_DIRS)."}, {"id": "sym:repo2graph/query.py::Index.retrieve", "label": "Index.retrieve", "type": "symbol", "deg": 13, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 348, "end_line": 396, "sig": "def retrieve(self, query: str, k: int = 8, hops: int = 1, budget_chars: int = 24000, *, min_confidence: float | None = None):", "doc": "Lexical seeds plus their graph neighbours, budgeted on chunk text. `budget_chars` bounds the sum of the returned chunks' `text` only — it says nothing about how a caller renders them. pack_context() uses the other model (the whole rendered markdown); do not unify the two. `min_confidence=None` means \"do not filter CALLS on confidence\", which is this method's historical behaviour."}, {"id": "sym:repo2graph/query.py::Index.map_prepend", "label": "Index.map_prep…", "type": "symbol", "deg": 8, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 400, "end_line": 423, "sig": "def map_prepend(self) -> str:", "doc": "The repo map: the prose overview plus the top entry points. Entry points come straight off `manifest[\"entrypoints\"]`, which export.write_manifest already sorted by reach. Both sources are optional; with neither, this is the empty string."}, {"id": "sym:repo2graph/query.py::Index.pack_context", "label": "Index.pack_con…", "type": "symbol", "deg": 22, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 425, "end_line": 525, "sig": "def pack_context(self, query: str, k: int = 8, hops: int = 1, budget_chars: int = 24000, min_confidence: float = 1.0, expand_graph: bool = True, vectors=None, embedder=None, exclude_secrets: bool = False) -> dict:", "doc": "An agent-ready markdown pack: repo map, `---`, then cited chunks. `budget_chars` bounds the WHOLE returned markdown — map prepend, `---` separator and every `### [cite: ...]` header included — unlike retrieve(), which budgets chunk text only. `budget_chars \u003c= 0` means unbounded. Spending order is map (capped at MAP_BUDGET_FRAC of the budget), then seeds in score order at full text, then graph nei…"}, {"id": "sym:repo2graph/query.py::_fit_lines", "label": "_fit_lines", "type": "symbol", "deg": 6, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 546, "end_line": 557, "sig": "def _fit_lines(text: str, limit: int) -> str:", "doc": "The longest whole-line prefix of `text` that fits in `limit` characters."}, {"id": "sym:repo2graph/query.py::_compress", "label": "_compress", "type": "symbol", "deg": 8, "path": "repo2graph/query.py", "kind": "function", "lang": "python", "start_line": 560, "end_line": 575, "sig": "def _compress(text: str) -> str:", "doc": "A chunk red aph.py::test_loaded_graph_round_trips", "label": "test_loaded_gr…", "type": "symbol", "deg": 5, "path": "tests/test_repo2graph.py", "kind": "function", "lang": "python", "start_line": 556, "end_line": 561, "sig": "def test_loaded_graph_round_trips(tmp_path, sample_repo):"}, {"id": "sym:tests/test_repo2graph.py::test_html_escapes_a_script_tag_in_the_source", "label": "test_html_esca…", "type": "symbol", "deg": 9, "path": "tests/test_repo2graph.py", "kind": "function", "lang": "python", "start_line": 564, "end_line": 582, "sig": "def test_html_escapes_a_script_tag_in_the_source(tmp_path):"}, {"id": "sym:tests/test_repo2graph.py::test_refactor_preserves_graph_shape", "label": "test_refactor_…", "type": "symbol", "deg": 4, "path": "tests/test_repo2graph.py", "kind": "function", "lang": "python", "start_line": 646, "end_line": 661, "sig": "def test_refactor_preserves_graph_shape(sample_repo):", "doc": "AC-13: node ids, (src, dst, type) triples and chunk ids are byte-identical before and after the refactor for the sample repo."}, {"id": "sym:tests/test_repo2graph.py::test_iss22_symbol_chunk_body_survives_unicode_line_separator", "label": "test_iss22_sym…", "type": "symbol", "deg": 5, "path": "tests/test_repo2graph.py", "kind": "function", "lang": "python", "start_line": 666, "end_line": 679, "sig": "def test_iss22_symbol_chunk_body_survives_unicode_line_separator(tmp_path):", "doc": "AC-1 (ISS-22): a file whose first line holds U+2028 must still slice each later symbol's chunk from the right source lines. At HEAD `splitlines()` splits on U+2028 while tree-sitter row numbers do not, so the body comes out as \"\\\\ndef uses_sep():\" and never contains \"return MSG\"."}, {"id": "sym:tests/test_repo2graph.py::test_iss22_file_residual_excludes_symbol_body", "label": "test_iss22_fil…", "type": "symbol", "deg": 4, "path": "tests/test_repo2graph.py", "kind": "function", "lang": "python", "start_line": 682, "end_line": 701, "sig": "def test_iss22_file_residual_excludes_symbol_body(tmp_path):", "doc": "AC-2 (ISS-22): the residual chunk holds only lines no symbol claimed. At HEAD the same mis-slice pulls `return MSG` (the body of uses_sep) into the residual and drops part of the real residual span."}, {"id": "sym:tests/test_repo2graph.py::test_iss06_cochange_survives_non_ascii_filenames", "label": "test_iss06_coc…", "type": "symbol", "deg": 6, "path": "tests/test_repo2graph.py", "kind": "function", "lang": "python", "start_line": 704, "end_line": 724, "sig": "def test_iss06_cochange_survives_non_ascii_filenames(tmp_path):", "doc": "AC-3/AC-4 (ISS-06): two non-ASCII paths committed together three times must yield a CO_CHANGE edge. At HEAD `git log` runs with text=True and core.quotepath=true, so the paths come back quoted/locale-decoded, never match file_index, and the edge silently vanishes (or raises UnicodeDecodeError on a non-UTF-8 locale)."}, {"id": "sym:tests/test_repo2graph.py::test_sh1_add_cochange_splits_git_log_on_newline_only", "label": "test_sh1_add_c…", "type": "symbol", "deg": 8, "path": "tests/test_repo2graph.py", "kind": "function", "lang": "python", "start_line": 727, "end_line": 742, "sig": "def test_sh1_add_cochange_splits_git_log_on_newline_only(monkeypatch):", "doc": "REVIEW SH-1 (ISS-22 bug class, graph.py:380): add_cochange must split `git log` output on \"\\\\n\" only. With core.quotepath=false git emits a path containing a raw U+2028; str.splitlines() would cut that path in two so neither fragment matches file_index and the CO_CHANGE edge vanishes."}, {"id": "sym:tests/test_repo2graph.py::test_iss27_graphml_roundtrips_with_a_control_char", "label": "test_iss27_gra…", "type": "symbol", "deg": 6, "path": "tests/test_repo2graph.py", "kind": "function", "lang": "python", "start_line": 745, "end_line": 764, "sig": "def test_iss27_graphml_roundtrips_with_a_control_char(tmp_path):", "doc": "AC-5 (ISS-27): a C0 control char inside a docstring must not make the GraphML unparseable. stdlib only, never skipped. At HEAD ElementTree     drag.fx = p[0]; drag.fy = p[1];
    reheat(0.3);
  } else if (pan) {
    tx = pan.tx + (ev.clientX - pan.x);
    ty = pan.ty + (ev.clientY - pan.y);
    if (Math.abs(ev.clientX - pan.x) + Math.abs(ev.clientY - pan.y) > 3) pan.moved = true;
    render();
  }
});
svg.addEventListener("pointerup", ev => {
  if (pan && !pan.moved && selected) clearSelection();
  drag = null; pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
});
svg.addEventListener("pointercancel", ev => {
  drag = null; pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
});
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const box = svg.getBoundingClientRect();
  const mx = ev.clientX - box.left, my = ev.clientY - box.top;
  const next = Math.max(0.12, Math.min(4, scale * Math.exp(-ev.deltaY * 0.0015)));
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next;
  render();
}, { passive: false });
window.addEventListener("resize", render);

emptyDetails();
relayout();
</script>
</body>
</html>
