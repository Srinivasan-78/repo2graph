 "end_line": 595, "sig": "def decode_jwt(token: str, jwks: JWKSCache, issuer: str, audience: str | None) -> dict[str, Any]:", "doc": "Validate a JWT's signature and claims, returning them. Args: token: The compact-serialised JWT. jwks: Key source for the issuer. issuer: The expected `iss` value. audience: The expected `aud` value, or None to skip the check. Returns: The validated claims. Raises: AuthError: On any structural, signature or claim failure."}, {"id": "sym:repo2graph/auth.py::AuthConfig", "label": "AuthConfig", "type": "symbol", "deg": 2, "path": "repo2graph/auth.py", "kind": "class", "lang": "python", "start_line": 631, "end_line": 659, "sig": "class AuthConfig:", "doc": "How the server authenticates requests. Attributes: token: A shared bearer token, or None. oidc_issuer: An OIDC issuer URL, or None. audience: Expected `aud` for OIDC tokens, or None to skip the check. jwks_ttl: Seconds a fetched JWKS is trusted."}, {"id": "sym:repo2graph/auth.py::Authenticator", "label": "Authenticator", "type": "symbol", "deg": 2, "path": "repo2graph/auth.py", "kind": "class", "lang": "python", "start_line": 662, "end_line": 754, "sig": "class Authenticator:", "doc": "Turns an Authorization header into an Identity, or refuses it. Args: config: The configured modes. opener: JSON fetcher for OIDC discovery, injected for tests. clock: Monotonic time source for the JWKS cache, injected for tests."}, {"id": "sym:repo2graph/auth.py::Authenticator.authenticate", "label": "Authenticator.…", "type": "symbol", "deg": 10, "path": "repo2graph/auth.py", "kind": "function", "lang": "python", "start_line": 684, "end_line": 754, "sig": "def authenticate(self, header: str | None) -> Identity:", "doc": "Validate one Authorization header. Args: header: The raw header value, or None when absent. Returns: The caller's Identity. With no auth configured this is always the anonymous identity and the header is ignored entirely. Raises: AuthError: When a credential is required and this one does che.py", "kind": "function", "lang": "python", "start_line": 188, "end_line": 201, "sig": "def clear(self) -> int:", "doc": "Drop every entry. Called whenever the index is rebuilt. Counters are deliberately *not* reset: they describe the life of the process, and zeroing them on every rebuild would hide exactly the churn an operator is looking at them to find. Returns: How many entries were dropped."}, {"id": "file:repo2graph/changelog.py", "label": "changelog.py", "type": "file", "deg": 12, "path": "repo2graph/changelog.py", "lang": "python", "lines": 240}, {"id": "file:repo2graph/chunks.py", "label": "chunks.py", "type": "file", "deg": 29, "path": "repo2graph/chunks.py", "lang": "python", "lines": 334}, {"id": "sym:repo2graph/chunks.py::build_chunks", "label": "build_chunks", "type": "symbol", "deg": 3, "path": "repo2graph/chunks.py", "kind": "function", "lang": "python", "start_line": 136, "end_line": 138, "sig": "def build_chunks(g, include_files: bool = True) -> list[dict]:", "doc": "All retrieval chunks as a list (stable public API)."}, {"id": "sym:repo2graph/chunks.py::iter_chunks", "label": "iter_chunks", "type": "symbol", "deg": 17, "path": "repo2graph/chunks.py", "kind": "function", "lang": "python", "start_line": 141, "end_line": 333, "sig": "def iter_chunks(g, include_files: bool = True):", "doc": "Yield chunk dicts ready for embedding, one at a time. A generator, not a list: on a large repo the chunk text is the single biggest allocation, so write_jsonl streams it straight to disk instead of holding every chunk in memory at once. Source text is dropped from the cache as soon as the last symbol on a file has been emitted."}, {"id": "file:repo2graph/cli.py", "label": "cli.py", "type": "file", "deg": 64, "path": "repo2graph/cli.py", "lang": "python", "lines": 1986}, {"id": "sym:repo2graph/cli.py::_emit", "label": "_emit", "type": "symbol", "deg": 8, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 52, "end_line": 83, "sig": "def _emit(text: str) -> None:", "doc": "The single stdout write for the whole CLI. Cannot raise on encoding. A redirected or piped Windows stdout is a strict cp1252 TextIOWrapper, so `repo2graph rag \"...\" > pack.md` over any repository holding a single non-ASCII source byte would otherwise die with 'charmap' codec errors. Git Bash is worse: it hands a piped stdout `errors='surrogateescape'`, which still raises on any character cp1252 l…"}, {"id": "sym:repo2graph/cli.py::cmd_build", "label": "cmd_build", "type": "symbol", "deg": 16, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 112, "end_line": 214, "sig": "def cmd_build(args):"}, {"id": "sym:repo2graph/cli.py::cmd_embed", "label": "cmd_embed", "type": "symbol", "deg": 18, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 350, "end_line": 423, "sig": "def cmd_embed(args):", "doc": "Embed an index's chunks, reusing every vector whose text is unchanged."}, {"id": "sym:repo2graph/cli.py::cmd_impact", "label": "cmd_impact", "type": "symbol", "deg": 25, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 999, "end_line": 1106, "sig": "def cmd_impact(args):", "doc": "Analyze PR / branch diff impact against a base branch using the code graph."}, {"id": "sym:repo2graph/cli.py::main", "label": "main", "type": "symbol", "deg": 6, "path": "repo2graph/cli.py", "kind": "function", "lang": "python", "start_line": 1231, "end_line": 1981, "sig": "def main(argv=None):"}, {"id": "file:repo2graph/demo.py", "label": "demo.py", "type": "file", "deg": 12, "path": "repo2graph/demo.py", "lang": "python", "lines": 661}, {"id": "sym:repo2graph/demo.py::run_demo", "label": "run_demo", "type": "symbol", "deg": 13, "path": "repo2graph/demo.py", "kind": "function", "lang": "python", "start_line": 556, "end_line": 660, "sig": "def run_demo( outdir: Path | str | None = None, *, keep: bool = False, brief: bool = True, emit: Callable[[str], None] = print, ) -> dict[str, Any]:", "doc": "Materialise, index and interrogate the bundled demo repository. Args: outdir: Where to put the demo repo. None uses a temp directory that is removed on the way out unless `keep` is set. keep: Leave the materialised repo and its index on disk, and print the follow-up commands that work against it. brief: Truncate each answer to `BRIEF_LINES` lines. False prints the whole cited pack for every quest…"}, {"id": "module:shutil", "label": "shutil", "type": "module", "deg": 15}, {"id": "file:repo2graph/doctor.py", "label": "doctor.py", "type": "file", "deg": 31, "path": "repo2graph/doctor.py", "lang": "python", "lines": 1514}, {"id": "sym:repo2graph/doctor.py::CheckResult", "label": "CheckResult", "type": "symbol", "deg": 5, "path": "repo2graph/doctor.py", "kind": "class", "lang": "python", "start_line": 25, "end_line": 43, "sig": "class CheckResult:", "doc": "The result of a single diagnostic probe."}, {"id": "sym:repo2graph/doctor.py::check_mcp_client_config", "label": "check_mcp_clie…", "type": "symbol", "deg": 12, "path": "repo2graph/doctor.py", "kind": "function", "lang": "python", "start_line": 966, "end_line": 1069, "sig": "def check_mcp_client_config(cwd: Path | None = None) -> CheckResult:", "doc": "Find and validate repo2graph entries in the MCP clients' config files."}, {"id": "sym:repo2graph/doctor.py::check_index_freshness", "label": "check_index_fr…", "type": "symbol", "deg": 7, "path": "repo2graph/doctor.py", "kind": "function", "lang": "python", "start_line": 1072, "end_line": 1168, "sig": "def check_index_freshness(path: Path) -> CheckResult:", "doc": "Does the index still describe the tree it was built from? Three independent signals, cheapest first: the commit the index records versus the tree's current HEAD; the set of files discovered now versus the set recorded in index.state.json; and, for files whose mtime is newer than the manifest's, a real sha256 against the hash the build recorded. The mtime is only used to choose what to hash -- a f…"}, {"id": "sym:repo2graph/doctor.py::check_parsers", "label": "check_parsers", "type": "symbol", "deg": 14, "path": "repo2graph/doctor.py", "kind": "function", "lang": "python", "start_line": 1171, "end_line": 1271, "sig": "def check_parsers(path: Path) -> CheckResult:", "doc": "Parse failures and unparsed file types in an index that already exists. check_tree_sitter answers \"can this machine load the grammars\"; this one answers \"did they work on this repository\" -- a grammar that loads fine still produces a symbol-free file node when the source uses syntax it does not model, and that file is then reachable by text but has no CALLS edges."}, {"id": "sym:repo2graph/doctor.py::check_generated_code", "label": "check_generate…", "type": "symbol", "deg": 24, "path": "repo2graph/doctor.py", "kind": "function", "lang": "python", "start_line": 1393, "end_line": 1486, "sig": "def check_generated_code(path: Path) -> CheckResult:", "doc": "Vendored or machine-written files that made it *into* the index. The cost is not disk: generated code is usually the largest and most repetitive text in a repository, so it dominates BM25 and crowds hand-written code out of a bounded pack. Finding it is the difference between \"the answers are vague\" and a one-flag fix."}, {"id": "sym:repo2graph/doctor.py::run_doctor", "label": "run_doctor", "type": "symbol", "deg": 7, "path": "repo2graph/doctor.py", "kind": "function", "lang": "python", "start_line": 1489, "end_line": 1513, "sig": "def run_doctor(path: str | Path = \".\") -> DoctorReport:", "doc": "Execute all diagnostic checks against the specified path."}, {"id": "file:repo2graph/edgemeta.py", "label": "edgemeta.py", "type": "file", "deg": 10, "path": "repo2graph/edgemeta.py", "lang": "python", "lines": 223}, {"id": "file:repo2graph/embed.py", "label": "embed.py", "type": "file", "deg": 12, "path": "repo2graph/embed.py", "lang": "python", "lines": 308}, {"id": "sym:repo2graph/embed.py::Embedder.encode", "label": "Embedder.encode", "type": "symbol", "deg": 11, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 45, "end_line": 45, "sig": "def encode(self, texts: list[str]) -> list[list[float]]:"}, {"id": "sym:repo2graph/embed.py::write_vectors", "label": "write_vectors", "type": "symbol", "deg": 9, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 194, "end_line": 231, "sig": "def write_vectors( path, vectors, model_id: str, dim: int, chunk_ids, text_hashes=None, build_id: str | None = None ) -> int:", "doc": "Write vectors.npy plus its sibling vectors.meta.json; return the count. Row order is `chunk_ids` order, which is chunks.jsonl order, so re-running `embed` over an unchanged index reproduces the file byte for byte. `build_id` is the manifest build_id for the index these vectors were built against; stored so `verify_artifacts` and `doctor` can detect when a rebuild has produced a new manifest build…"}, {"id": "sym:repo2graph/embed.py::load_vectors", "label": "load_vectors", "type": "symbol", "deg": 9, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 234, "end_line": 276, "sig": "def load_vectors(path) -> tuple[dict[str, list[float]], dict]:", "doc": "Inverse of write_vectors: ({chunk id: vector}, meta). Raises ValueError/OSError on anything malformed; callers that must not fail (query.Index) catch both and fall back to BM25."}, {"id": "sym:repo2graph/embed.py::_SentenceTransformerEmbedder.encode", "label": "_SentenceTrans…", "type": "symbol", "deg": 12, "path": "repo2graph/embed.py", "kind": "function", "lang": "python", "start_line": 289, "end_line": 291, "sig": "def encode(self, texts):"}, {"id": "file:repo2graph/events.py", "label": "events.py", "type": "file", "deg": 17, "path": "repo2graph/events.py", "lang": "python", "lines": 161}, {"id": "sym:repo2graph/events.py::write_safe", "label": "write_safe", "type": "symbol", "deg": 9, "path": "repo2graph/events.py", "kind": "function", "lang": "python", "start_line": 78, "end_line": 105, "sig": "def write_safe(stream: Any, text: str, newline: str = \"\\n\") -> None:", "doc": "Write `text` to `stream`, replacing anything it cannot encode. Never raises: a UnicodeEncodeError, a closed stream or a broken pipe all end as silence rather than as an exception in the caller. Args: stream: Destination, typically `sys.stdout` or `sys.stderr`. text: The line to write, without a trailing newline. newline: Appended to `text`; pass \"\" to suppress it."}, {"id": "sym:repo2graph/events.py::emit", "label": "emit", "type": "symbol", "deg": 11, "path": "repo2graph/events.py", "kind": "function", "lang": "python", "start_line": 120, "end_line": 160, "sig": "def emit( event: str, level: str = \"warning\", stream: TextIO | None = None, **fields: Any ) -> dict[str, Any]:", "doc": "Write one structured event as a single JSON line on stderr. Args: event: Machine-readable event name, e.g. `\"rag_fusion_disabled\"`. level: Severity label; \"warning\" by default. stream: Destination; defaults to `sys.stderr` resolved at call time. **fields: Additional JSON-serialisable fields merged into the record. Returns: The record that was emitted, so callers and tests can assert on it without…"}, {"id": "sym:repo2graph/explain.py::explain_retrieval", "label": "explain_retrie…", "type": "symbol", "deg": 11, "path": "repo2graph/explain.py", "kind": "function", "lang": "python", "start_line": 89, "end_line": 241, "sig": "def explain_retrieval( outdir: Path, query: str, k: int = 5, hops: int = 1, min_confidence: float | None = None, budget_chars: int = RETRIEVE_BUDGET_CHARS, *, exclude_secrets: bool = True, extra_secret_keywords: list[str] | None = None, extra_secret_dirs: list", "doc": "Trace query tokenization, seed ranking, graph expansion, and final chunk selection. Every step here has to reproduce `Index.retrieve`'s, because the chunks it claims to explain come from `Index.retrieve` twenty lines down. Three things that must not drift: the seed loop stops on `budget_chars` as well as on `k`, the seeds stay in score order (`expand` walks its frontier in order under a per-hop c…"}, {"id": "file:repo2graph/export.py", "label": "export.py", "type": "file", "deg": 70, "path": "repo2graph/export.py", "lang": "python", "lines": 1391}, {"id": "sym:repo2graph/export.py::atomic_write", "label": "atomic_write", "type": "symbol", "deg": 14, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 52, "end_line": 71, "sig": "def atomic_write(path: Path, mode: str = \"w\", **open_kw: Any) -> Iterator[IO[Any]]:", "doc": "Write via a sibling temp file renamed onto `path` only on a clean exit. A crash, exception or Ctrl-C mid-write then leaves the previous artifact (or none) intact rather than a truncated file that `query`/`map` would choke on. The temp file is in the target's own directory, so os.replace is atomic."}, {"id": "sym:repo2graph/export.py::path", "label": "path", "type": "symbol", "deg": 5, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 103, "end_line": 105, "sig": "def path(outdir: Path | str, name: str) -> Path:", "doc": "The path an artifact is read back from."}, {"id": "sym:repo2graph/export.py::write_graphml", "label": "write_graphml", "type": "symbol", "deg": 9, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 366, "end_line": 486, "sig": "def write_graphml(g: \"Graph\", path: Path) -> None:"}, {"id": "sym:repo2graph/export.py::write_manifest", "label": "write_manifest", "type": "symbol", "deg": 14, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 866, "end_line": 1017, "sig": "def write_manifest( g: Any, path: Path, written: list[str], *, checksums: dict[str, Any] | None = None ) -> None:", "doc": "Describe the agent-facing output so a reader needs no other docs. `g` is `Any`, not `Graph`, on purpose: every read below is a defaulted `getattr`, and the contract this function has always offered -- see the `max_call_candidates` note -- is that anything quacking like a Graph is accepted. Narrowing the annotation would document a promise it does not make."}, {"id": "sym:repo2graph/export.py::register_written", "label": "register_writt…", "type": "symbol", "deg": 23, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 1097, "end_line": 1139, "sig": "def register_written(outdir: Path | str, names: Iterable[str]) -> bool:", "doc": "Merge `names` into an existing manifest's `written`, `files`, and `checksums`. `embed` runs after `build` as a separate command, so it must append to the manifest dump_all already wrote rather than rewrite it: every other key -- counts, entrypoints, how_to_read -- is left exactly as it was. Returns False when there is no readable manifest to append to."}, {"id": "sym:repo2graph/export.py::dump_all", "label": "dump_all", "type": "symbol", "deg": 15, "path": "repo2graph/export.py", "kind": "function", "lang": "python", "start_line": 1296, "end_line": 1390, "sig": "def dump_all( g: \"Graph\", chunks: Iterable[Record] | None, outdir: Path, formats: set[str], viz_nodes: int = MAX_NODES, ) -> tuple[list[str], int]:", "doc": "Write the requested artifacts. `chunks` is an iterable of chunk dicts (a build_chunks generator) or None. Returns (written_paths, chunk_count). Artifacts are staged in a sibling directory and atomically swapped into outdir on success; a failed or interrupted build never leaves a partial index behind."}, {"id": "file:repo2graph/fetch.py", "label": "fetch.py", "type": "file", "deg": 33, "path": "repo2graph/fetch.py", "lang": "python", "lines": 370}, {"id": "sym:repo2graph/fetch.py::clone", "label": "clone", "type": "symbol", "deg": 12, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 172, "end_line": 282, "sig": "def clone( spec: str, dest: Path, ref: str | None = None, depth: int = 0, token: str | None = None ) -> Path:", "doc": "Clone a GitHub repo into dest/\u003crepo>. depth=0 means full history."}, {"id": "sym:repo2graph/fetch.py::index_github", "label": "index_github", "type": "symbol", "deg": 15, "path": "repo2graph/fetch.py", "kind": "function", "lang": "python", "start_line": 300, "end_line": 369, "sig": "def index_github( spec: str, outdir: Path, ref: str | None = None, depth: int = 0, git_history: int = 0, formats: str = \"jsonl,graphml,cypher,overview,html\", include=None, exclude=None, max_files: int = 0, keep_clone: Path | None = None, token: str | None", "doc": "Clone a GitHub repo, build its graph, write artifacts to outdir."}, {"id": "file:repo2graph/graph.py", "label": "graph.py", "type": "file", "deg": 56, "path": "repo2graph/graph.py", "lang": "python", "lines": 2134}, {"id": "sym:repo2graph/graph.py::Graph", "label": "Graph", "type": "symbol", "deg": 3, "path": "repo2graph/graph.py", "kind": "class", "lang": "python", "start_line": 172, "end_line": 269, "sig": "class Graph:"}, {"id": "sym:repo2graph/graph.py::Graph.add_node", "label": "Graph.add_node", "type": "symbol", "deg": 6, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 217, "end_line": 238, "sig": "def add_node(self, nid: str, **attrs):"}, {"id": "sym:repo2graph/graph.py::resolve_import", "label": "resolve_import", "type": "symbol", "deg": 16, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 378, "end_line": 643, "sig": "def resolve_import( target: str, from_path: str, lang: str, file_index: set[str], ctx: dict | None = None ) -> str | None:", "doc": "Map an import target to an in-repo file path when possible."}, {"id": "sym:repo2graph/graph.py::_chunk_and_parse", "label": "_chunk_and_par…", "type": "symbol", "deg": 15, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 718, "end_line": 846, "sig": "def _chunk_and_parse(rel, abspath, lang, config, size):"}, {"id": "sym:repo2graph/graph.py::_safe_read_bytes", "label": "_safe_read_byt…", "type": "symbol", "deg": 14, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 852, "end_line": 875, "sig": "def _safe_read_bytes(path: Path) -> bytes:", "doc": "Read file bytes using O_NOFOLLOW where supported to avoid symlink TOCTOU races (ISS-87). On POSIX systems, O_NOFOLLOW causes open() to fail if the trailing component is a symlink (protecting against an attacker replacing a discovered regular file with a symlink to a sensitive file before open). On Windows, O_NOFOLLOW is not supported by the OS open(), so standard read flags are used."}, {"id": "sym:repo2graph/graph.py::build", "label": "build", "type": "symbol", "deg": 27, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 1277, "end_line": 1884, "sig": "def build( root: Path, include=None, exclude=None, git_history: int = 0, max_files: int = 0, jobs: int = 0, cache: dict | None = None, max_call_candidates: int = DEFAULT_MAX_CALL_CANDIDATES, config=None, cochange_min: int = 3, ) -> Graph:", "doc": "Parse `root` into a Graph. Args: root: Repository directory to index. include: Optional glob(s) restricting discovery. exclude: Optional glob(s) removing paths from discovery. git_history: When non-zero, add CO_CHANGE edges from the last N commits. max_files: When positive, index only the first N discovered files. jobs: Parser processes; 0 means one per core, 1 means serial. cache: A previous bui…"}, {"id": "sym:repo2graph/graph.py::add_cochange", "label": "add_cochange", "type": "symbol", "deg": 13, "path": "repo2graph/graph.py", "kind": "function", "lang": "python", "start_line": 1996, "end_line": 2133, "sig": "def add_cochange(g: Graph, root: Path, commits: int, file_index: set[str], min_pairs: int = 3):", "doc": "CO_CHANGE edges from files edited together in the last N commits. Formula and semantics: - History depth: Scans up to `commits` commits (capped at MAX_COCHANGE_COMMITS = 5000). - Merge handling: t_line: Any = 1, end_line: Any = None, context: Any = 0, ) -> str:", "doc": "Widen a `[cite: path:start-end]` citation, from chunks.jsonl, not disk. Reading chunks rather than the filesystem is the load-bearing choice (#385): chunks have already passed secret-path exclusion and content redaction, the filesystem has not, and a served index may have no source tree beside it at all (the `graph` branch / Action-artifact case). A span not covered by any chunk -- including the …"}, {"id": "sym:repo2graph/mcp.py::tool_repo_path_between", "label": "tool_repo_path…", "type": "symbol", "deg": 13, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 1214, "end_line": 1329, "sig": "def tool_repo_path_between( index: Index, from_id: str, to_id: str, max_hops: Any = MCP_PATH_HOPS, edge_types: Any = None, max_paths: Any = MCP_PATH_PATHS, ) -> str:", "doc": "Bounded, bidirectional path(s) between `from_id` and `to_id`, with the minimum edge confidence along each -- the question a graph answers that grep cannot approximate at all (#386)."}, {"id": "sym:repo2graph/mcp.py::tool_repo_impact", "label": "tool_repo_impa…", "type": "symbol", "deg": 11, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 1332, "end_line": 1504, "sig": "def tool_repo_impact( index: Index, base: str = \"main\", head: str | None = None, diff: str = \"\", max_depth: Any = 2, format: str = \"markdown\", ) -> str:", "doc": "Analyze PR or git diff impact against a base branch using the code graph. With no `head`, the working tree (committed *and* uncommitted changes) is compared against `base` -- what `repo2graph impact` does. A `head` gives the three-dot `base...head` comparison of two refs instead. Enforces exclude_secrets=True unconditionally and clamps numeric arguments."}, {"id": "sym:repo2graph/mcp.py::tool_repo_blast_radius", "label": "tool_repo_blas…", "type": "symbol", "deg": 10, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 1558, "end_line": 1679, "sig": "def tool_repo_blast_radius( index: Index, node_id: str, max_hops: Any = MCP_IMPACT_HOPS, include_cochange: Any = True, limit: Any = MCP_IMPACT_LIMIT, ) -> str:", "doc": "Reverse reachability from `node_id`: what would break if it changed. The reverse of repo_neighbours' one hop in both directions: this is specifically the reverse *closure* -- callers of callers, subclasses of subclasses, importers of importers of the containing file -- by hop distance, plus CO_CHANGE files kept visually separate because they are historical correlation, not an edge the AST produce…"}, {"id": "sym:repo2graph/mcp.py::dispatch", "label": "dispatch", "type": "symbol", "deg": 13, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 1926, "end_line": 2042, "sig": "def dispatch(index: \"Index | None\", name: str, arguments: dict, cache=None, tasks=None) -> str:", "doc": "Route one tool call to its handler. Pure, so serve() holds no logic. Args: index: The open index every tool answers from. None is allowed only for `repo_build_status`, which reports on a build and therefore must be answerable while there is still no index to open. name: Tool name the caller asked for. arguments: The caller's arguments, which are JSON a model wrote and are treated as hostile throu…"}, {"id": "sym:repo2graph/mcp.py::serve", "label": "serve", "type": "symbol", "deg": 7, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 2243, "end_line": 2300, "sig": "def serve(out, repo=None, cache=None, tasks=None) -> None:", "doc": "Run the stdio MCP server against the index at `out`. Deliberately thin: every answer comes from dispatch(), which is tested without the SDK, so SDK API drift can break the wiring but nothing else."}, {"id": "sym:repo2graph/mcp.py::main", "label": "main", "type": "symbol", "deg": 12, "path": "repo2graph/mcp.py", "kind": "function", "lang": "python", "start_line": 2328, "end_line": 2481, "sig": "de   for (const n of active) {
    if (n.fx !== null && n.fx !== undefined) {
      n.x = n.fx; n.y = n.fy; n.vx = 0; n.vy = 0; continue;
    }
    n.vx = (n.vx - n.x * GRAVITY * alpha) * DAMP;
    n.vy = (n.vy - n.y * GRAVITY * alpha) * DAMP;
    n.x += Math.max(-MAX_STEP, Math.min(MAX_STEP, n.vx));
    n.y += Math.max(-MAX_STEP, Math.min(MAX_STEP, n.vy));
  }
  alpha *= 0.985;
}

function render() {
  const shownLinks = links.reduce((n, l) => n + (linkShown(l) ? 1 : 0), 0);
  const showLabels = scale >= 0.45 && shownLinks <= 420;
  for (const l of links) {
    const on = linkShown(l);
    l.line.style.display = on ? "" : "none";
    l.text.style.display = on && showLabels ? "" : "none";
    if (!on) continue;
    const a = l.source, b = l.target;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 0.01;
    const ux = dx / d, uy = dy / d;
    const x1 = a.x + ux * (radius(a) + 2), y1 = a.y + uy * (radius(a) + 2);
    const x2 = b.x - ux * (radius(b) + 7), y2 = b.y - uy * (radius(b) + 7);
    l.line.setAttribute("x1", x1.toFixed(1)); l.line.setAttribute("y1", y1.toFixed(1));
    l.line.setAttribute("x2", x2.toFixed(1)); l.line.setAttribute("y2", y2.toFixed(1));
    if (showLabels) {
      let ang = Math.atan2(dy, dx) * 180 / Math.PI;
      if (ang > 90 || ang < -90) ang += 180;   // labels stay right way up
      l.text.setAttribute("transform",
        "translate(" + ((x1 + x2) / 2).toFixed(1) + "," + ((y1 + y2) / 2).toFixed(1) +
        ") rotate(" + ang.toFixed(1) + ")");
    }
  }
  for (const n of nodes) {
    n.el.style.display = nodeShown(n) ? "" : "none";
    n.el.setAttribute("transform",
      "translate(" + n.x.toFixed(1) + "," + n.y.toFixed(1) + ")");
  }
  view.setAttribute("transform",
    "translate(" + tx.toFixed(1) + "," + ty.toFixed(1) + ") scale(" + scale.toFixed(3) + ")");
}

function frame() {
  step(); render();
  raf = (alpha > 0.02 || drag) ? requestAnimationFrame(frame) : null;
}
function reheat(a) {
  alpha = Math.max(alpha, a === undefined ? 0.6 : a);
  if (!raf) raf = requestAnimationFrame(frame);
}
function fit() {
  const active = nodes.filter(nodeShown);
  if (!active.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of active) {
    const r = radius(n) + 26;
    x0 = Math.min(x0, n.x - r); y0 = Math.min(y0, n.y - r);
    x1 = Math.max(x1, n.x + r); y1 = Math.max(y1, n.y + r);
  }
  const box = svg.getBoundingClientRect();
  scale = Math.max(0.15, Math.min(box.width / (x1 - x0), box.height / (y1 - y0), 1.6));
  tx = box.width / 2 - ((x0 + x1) / 2) * scale;
  ty = box.height / 2 - ((y0 + y1) / 2) * scale;
  render();
}
// How many settle iterations a relayout may run before it gives up and fits
// whatever it has. Overridable per page with data-max-iterations on #stage, so
// a very large graph can be given a longer settle without a rebuild.
const DEFAULT_MAX_ITERATIONS = 500;
// Iterations per animation frame. The browser gets control back between
// batches, so the page stays responsive and the progress bar actually paints.
const SETTLE_BATCH = 20;

function maxIterations() {
  const raw = parseInt(stage.dataset.maxIterations, 10);
  return (Number.isFinite(raw) && raw > 0) ? raw : DEFAULT_MAX_ITERATIONS;
}

function showProgress(done, total) {
  progress.hidden = false;
  progressBar.style.width = Math.round((done / total) * 100) + "%";
}

function relayout() {
  scatter();
  document.querySelectorAll(".node.pinned").forEach(el => el.classList.remove("pinned"));
  alpha = 1;
  // The settle used to run as one synchronous `while` loop, which blocks the
  // browser's main thread for its whole duration: on a large graph the page is
  // frozen -- no paint, no input, no scroll -- and looks hung. Iteration count
  // was capped to bound that, but a bounded freeze is still a freeze.
  //
  // Now it runs in small batches across animation frames. The thread is handed
  // back between batches, so the layout is visibly converging and the page
  // stays interactive while it does. Cancelling an in-flight settle matters
  // too: two overlapping relayouts would otherwise fight over `alpha`.
  if (settleRaf) cancelAnimationFrame(settleRaf);
  const cap = maxIterations();
  let iters = 0;
  function settle() {
    for (let i = 0; i < SETTLE_BATCH && alpha > 0.02 && iters < cap; i++) {
      step(); iters++;
    }
    showProgress(iters, cap);
    render();
    if (alpha > 0.02 && iters < cap) {
      settleRaf = requestAnimationFrame(settle);
      return;
    }
    settleRaf = null;
    progress.hidden = true;
    fit();
  }
  settleRaf = requestAnimationFrame(settle);
}

// ---------- selection + details ----------
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function kv(parent, key, value) {
  if (value === undefined || value === null || value === "") return;
  const row = el("div", "kv");
  row.append(el("span", "", key), el("span", "", String(value)));
  parent.appendChild(row);
}
function emptyDetails() {
  panel.replaceChildren(el("p", "sub", "Click a node to see what it is and what it touches."));
}
function showDetails(n) {
  panel.replaceChildren();
  const chip = el("span", "chip", n.type);
  chip.style.background = colorOf(n);
  panel.append(chip, el("h2", "", n.label));
  const box = el("div");
  kv(box, "id", n.id);
  kv(box, "path", n.path);
  kv(box, "kind", n.kind);
  kv(box, "lang", n.lang);
  kv(box, "lines", n.start_line ? n.start_line + "-" + n.end_line : n.lines);
  kv(box, "degree", n.deg);
  panel.appendChild(box);
  if (n.sig) { panel.append(el("h2", "", "signature"), el("pre", "", n.sig)); }
  if (n.doc) { panel.append(el("h2", "", "doc"), el("pre", "", n.doc)); }

  const list = neighbours(n.id);
  panel.appendChild(el("h2", "", "connections (" + list.length + ")"));
  for (const link of list.slice(0, 80)) {
    const b = el("button", "nb");
    const dot = el("span", "swatch");
    dot.style.background = colorOf(link.other);
    dot.style.display = "inline-block";
    dot.style.marginRight = "6px";
    b.append(dot, document.createTextNode(
      (link.dir === "out" ? "-[" : "<-[") + link.type + (link.dir === "out" ? "]-> " : "]- ") +
      link.other.label));
    b.addEventListener("click", () => selectNode(link.other, true));
    panel.appendChild(b);
  }
}
// ---------- focus mode + search: opacity combines, most restrictive wins ----------
// focus mode: clicked node 1, 1-hop .8, 2-hop .4, everything else .1
// search mode: matching 1, non-matching .15
// A node under both dims to whichever number is lower -- Math.min, per node.
const FOCUS_OPACITY = [1, 0.8, 0.4];
const FOCUS_FAR_OPACITY = 0.1;
const SEARCH_MISS_OPACITY = 0.15;
let focusNode = null;
let focusDist = new Map();
let searchQuery = "";

function computeFocusDistances(n) {
  const dist = new Map([[n.id, 0]]);
  const frontier = neighbours(n.id).map(l => l.other);
  for (const m of frontier) if (!dist.has(m.id)) dist.set(m.id, 1);
  for (const m of frontier) {
    for (const link of neighbours(m.id)) {
      if (!dist.has(link.other.id)) dist.set(link.other.id, 2);
    }
  }
  return dist;
}
function opacityFor(n) {
  let o = 1;
  if (focusNode) {
    const d = focusDist.get(n.id);
    o = Math.min(o, d === undefined ? FOCUS_FAR_OPACITY : FOCUS_OPACITY[d]);
  }
  if (searchQuery) {
    o = Math.min(o, n.hay.includes(searchQuery) ? 1 : SEARCH_MISS_OPACITY);
  }
  return o;
}
function applyOpacity() {
  for (const n of nodes) {
    n.el.style.opacity = opacityFor(n);
    n.el.classList.toggle("hit", searchQuery !== "" && n.hay.includes(searchQuery));
    n.el.classList.toggle("focused", focusNode === n);
  }
}
function clearFocus() {
  focusNode = null;
  focusDist = new Map();
  applyOpacity();
}

function selectNode(n, centre) {
  selected = n;
  focusNode = n;
  focusDist = computeFocusDistances(n);
  applyOpacity();
  for (const l of links) {
    const on = l.source.id === n.id || l.target.id === n.id;
    l.line.classList.toggle("dim", !on);
    l.text.classList.toggle("dim", !on);
  }
  if (centre) centreOn(n);
  showDetails(n);
}
function clearSelection() {
  selected = null;
  clearFocus();
  for (const l of links) { l.line.classList.remove("dim"); l.text.classList.remove("dim"); }
  emptyDetails();
}
function centreOn(n) {
  const box = svg.getBoundingClientRect();
  tx = box.width / 2 - n.x * scale;
  ty = box.height / 2 - n.y * scale;
  render();
}

// ---------- controls ----------
function legendRow(host, key, count, colour, kind, desc) {
  const wrap = el("div");
  const label = el("label");
  const box = el("input");
  box.type = "checkbox";
  box.checked = !(kind === "node" ? hiddenNodeTypes : hiddenEdgeTypes).has(key);
  box.addEventListener("change", () => {
    const hidden = kind === "node" ? hiddenNodeTypes : hiddenEdgeTypes;
    if (box.checked) hidden.delete(key); else hidden.add(key);
    reheat(0.5);
  });
  const mark = el("span", kind === "node" ? "swatch" : "bar");
  if (colour) mark.style.background = colour;
  label.append(box, mark, el("span", "", key), el("span", "count", count));
  wrap.appendChild(label);
  if (desc) wrap.appendChild(el("div", "legend-desc", desc));
  host.appendChild(wrap);
}
for (const [type, count] of DATA.nodeTypes) {
  legendRow(document.getElementById("node-legend"), type, count,
            DATA.colors[type] || DATA.colors._, "node", DATA.nodeDesc[type]);
}
for (const [type, count] of DATA.edgeTypes) {
  legendRow(document.getElementById("edge-legend"), type, count, null, "edge", DATA.edgeDesc[type]);
}
document.getElementById("counts").textContent =
  nodes.length + " of " + DATA.totals.nodes + " nodes · " +
  links.length + " of " + DATA.totals.edges + " edges";

// ---------- legend collapse, persisted per-viewer ----------
const legendToggle = document.getElementById("legend-toggle");
const legendBody = document.getElementById("legend-body");
const legendChevron = document.getElementById("legend-chevron");
const LEGEND_COLLAPSE_KEY = "r2g-legend-collapsed";
function setLegendCollapsed(collapsed) {
  legendBody.classList.toggle("collapsed", collapsed);
  legendChevron.textContent = collapsed ? "▸" : "▾";
  try { localStorage.setItem(LEGEND_COLLAPSE_KEY, collapsed ? "1" : "0"); } catch (_) {}
}
let legendCollapsed = false;
try { legendCollapsed = localStorage.getItem(LEGEND_COLLAPSE_KEY) === "1"; } catch (_) {}
setLegendCollapsed(legendCollapsed);
legendToggle.addEventListener("click", () => {
  setLegendCollapsed(!legendBody.classList.contains("collapsed"));
});

// ---------- search: highlight, dropdown, pan/zoom to a result ----------
const search = document.getElementById("search");
const searchWrap = document.getElementById("search-wrap");
const searchResults = document.getElementById("search-results");
function matchesFor(q) {
  return q ? nodes.filter(n => n.hay.includes(q)).slice(0, 30) : [];
}
function renderSearchResults(q) {
  searchResults.replaceChildren();
  const matches = matchesFor(q);
  if (!matches.length) { searchResults.hidden = true; return; }
  for (const n of matches) {
    const row = el("div", "search-result");
    row.tabIndex = 0;
    const dot = el("span", "swatch");
    dot.style.background = colorOf(n);
    row.append(dot, document.createTextNode(n.label + "  ·  " + n.type));
    row.addEventListener("click", () => {
      searchResults.hidden = true;
      selectNode(n, true);
    });
    searchResults.appendChild(row);
  }
  searchResults.hidden = false;
}
function applySearch(q) {
  searchQuery = q;
  applyOpacity();
  renderSearchResults(q);
}
search.addEventListener("input", () => applySearch(search.value.trim().toLowerCase()));
search.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const q = search.value.trim().toLowerCase();
  const hit = q && nodes.find(n => nodeShown(n) && n.hay.includes(q));
  if (hit) { searchResults.hidden = true; selectNode(hit, true); }
});
document.addEventListener("pointerdown", ev => {
  if (!searchWrap.contains(ev.target)) searchResults.hidden = true;
});
// Cmd/Ctrl+F focuses the search box instead of the browser's own find-in-page;
// Escape clears whichever of search / focus mode is active, search box first.
window.addEventListener("keydown", ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "f") {
    ev.preventDefault();
    search.focus();
    search.select();
    return;
  }
  if (ev.key !== "Escape") return;
  if (document.activeElement === search && search.value) {
    search.value = "";
    applySearch("");
    searchResults.hidden = true;
  } else if (focusNode) {
    clearSelection();
  }
});

document.getElementById("btn-fit").addEventListener("click", fit);
document.getElementById("btn-relayout").addEventListener("click", relayout);
document.getElementById("btn-unpin").addEventListener("click", () => {
  for (const n of nodes) { n.fx = null; n.fy = null; n.el.classList.remove("pinned"); }
  reheat(0.6);
});
document.getElementById("btn-clear-focus").addEventListener("click", clearSelection);

// ---------- pointer: drag nodes, pan and zoom the canvas ----------
function toGraph(ev) {
  const box = svg.getBoundingClientRect();
  return [(ev.clientX - box.left - tx) / scale, (ev.clientY - box.top - ty) / scale];
}
function startDrag(ev, n) {
  ev.stopPropagation();
  drag = n;
  n.fx = n.x; n.fy = n.y;
  n.el.classList.add("pinned");
  svg.setPointerCapture(ev.pointerId);
  reheat(0.4);
}
svg.addEventListener("pointerdown", ev => {
  if (ev.target.closest(".node")) return;
  pan = { x: ev.clientX, y: ev.clientY, tx: tx, ty: ty, moved: false };
  svg.classList.add("panning");
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove", ev => {
  if (drag) {
    const p = toGraph(ev);
    drag.fx = p[0]; drag.fy = p[1];
    reheat(0.3);
  } else if (pan) {
    tx = pan.tx + (ev.clientX - pan.x);
    ty = pan.ty + (ev.clientY - pan.y);
    if (Math.abs(ev.clientX - pan.x) + Math.abs(ev.clientY - pan.y) > 3) pan.moved = true;
    render();
  }
});
svg.addEventListener("pointerup", ev => {
  if (pan && !pan.moved && selected) clearSelection();
  drag = null; pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
});
svg.addEventListener("pointercancel", ev => {
  drag = null; pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
});
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const box = svg.getBoundingClientRect();
  const mx = ev.clientX - box.left, my = ev.clientY - box.top;
  const next = Math.max(0.12, Math.min(4, scale * Math.exp(-ev.deltaY * 0.0015)));
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next;
  render();
}, { passive: false });
window.addEventListener("resize", render);

emptyDetails();
relayout();
</script>
</body>
</html>
