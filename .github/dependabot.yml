version: 2
updates:
  # pip: resolved from pyproject.toml at the repo root, extras included.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees: ["Srinivasan-78"]
    groups:
      # Minor and patch bumps arrive as one PR; a major gets its own, because
      # a major is a decision and should not ride in on a group merge.
      pip-minor-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    ignore:
      # Capped below 1.0 deliberately (see pyproject.toml comment): 1.x downloads
      # unsigned native grammars over the network at runtime, breaking offline
      # and security guarantees.
      - dependency-name: "tree-sitter-language-pack"
        update-types: ["version-update:semver-major"]
  # github-actions: every `uses:` in .github/workflows. Dependabot rewrites the
  # pinned SHA *and* the tag comment beside it, which is what keeps SHA pinning
  # maintainable rather than a one-off that rots.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees: ["Srinivasan-78"]
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
  # npm: the two manifests that are actually shipped or installed from.
  # `benchmarks/corpus/*/package.json` are deliberately NOT here -- that corpus
  # is input to the parser, not code that runs, and its dependencies exist to
  # contain the reflection dispatch and barrel re-exports the benchmark pins as
  # known failures. Bumping them would change benchmark baselines for no
  # security benefit.
  #
  # `npm/` is the npx launcher published to the registry; `editors/vscode/` is
  # the extension. Both were unwatched, so a vulnerable transitive dev
  # dependency in either had no alert path at all.
  - package-ecosystem: "npm"
    directories:
      - "/npm"
      - "/editors/vscode"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees: ["Srinivasan-78"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
    ignore:
      # Pinned to match `engines.vscode` (`^1.85.0`) in editors/vscode/package.json;
      # tests/test_vscode_extension.py enforces exact parity.
      - dependency-name: "@types/vscode"
  # docker: the root Dockerfile's base image. Tag-pinned today rather than
  # digest-pinned (DEP-04), so this is what surfaces a rebuilt base image.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees: ["Srinivasan-78"]
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
