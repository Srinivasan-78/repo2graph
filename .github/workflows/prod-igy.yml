name: prod-igy

# Automated PR assistant for repo2graph:
# - Classifies PRs and assigns type, size, area, and status labels
# - Analyzes base branch alignment, commit divergence, and linked issues
# - Reminds and tags PR authors if their branch is behind base or has merge conflicts
# - Surfaces repository-specific architecture and review reminders from AGENTS.md
'on':
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to inspect (leave blank or 'all' to inspect all open PRs)"
        required: false
        default: "all"
  issue_comment:
    types: [created]

# Top-level default: read-only
permissions:
  contents: read

jobs:
  triage:
    name: PR Triage & Inspection
    if: |
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (contains(github.event.comment.body, '@prod-igy') || contains(github.event.comment.body, '/prod-igy')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # Checkout the base repository (main) to obtain the trusted prod-igy script
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/prod-igy.js
          sparse-checkout-cone-mode: false

      - name: Run prod-igy PR Assistant
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/prod-igy.js');
            await run({ github, context, core });
