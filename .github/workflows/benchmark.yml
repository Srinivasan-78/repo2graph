name: Benchmark and Regression Corpus

on:
  push:
    branches: [main, develop]
    paths:
      - "repo2graph/**"
      - "benchmarks/**"
      - "scripts/benchmark_runner.py"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "repo2graph/**"
      - "benchmarks/**"
      - "scripts/benchmark_runner.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run benchmark suite and regression gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark_runner.py --ci --output benchmarks/results_ci_${{ matrix.os }}.json

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: benchmark-results-${{ matrix.os }}
          path: benchmarks/results_ci_${{ matrix.os }}.json

