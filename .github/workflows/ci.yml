name: CI

# Runs the test suite and smoke-tests the composite action itself, so a tag
# never ships an action that cannot build a graph.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The `drift` job only. 05:00 Monday sits between self-index (04:00) and
  # dependency-audit (06:00) so the three weekly jobs do not contend.
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  # A newer push to the same PR makes the older matrix run redundant. Pushes
  # to main are NOT cancelled: main's runs are the record of what that commit
  # did, and the expression keeps them running.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    # The scheduled run exists for `drift` alone; this job is what gates a PR.
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    # Every job in this file carries a timeout. The bound exists to catch a
    # *hang* -- without one a wedged job runs to GitHub's 6-hour default -- not
    # to police a slow run, so it is set well above the real cost: the last six
    # CI runs completed end to end in 3.8-4.3 minutes, and this is a per-cell
    # bound on a 9-cell matrix, not a budget for the matrix as a whole.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install the dependency graph that was reviewed, not whatever PyPI
      # resolves this morning. uv.lock is committed and docs/ENTERPRISE_DEPLOYMENT.md
      # tells operators it pins "the exact dependency graph that was reviewed" --
      # until now CI was the one place not building it, so the matrix was not
      # reproducible and a changed upstream release reached it with no review
      # gate. It showed: test_cpp_parse.py::test_iss126_cpp_fallback_line_numbers_match_original
      # passed, failed on windows/3.10 for a commit touching only lock.py and
      # export.py, then passed again on re-run, because tree-sitter-language-pack
      # is floored at >=0.7 with no cap. `drift` below is what still watches
      # upstream.
      #
      # uv is version-pinned for the same reason everything else here is SHA-pinned.
      - run: pip install "uv==0.12.15"
      # --locked fails if uv.lock has drifted from pyproject.toml rather than
      # quietly re-resolving, so a dependency change that skipped `uv lock` is a
      # red CI run and not a silent difference between the lockfile and the run.
      - name: Export the locked dependency set
        run: uv export --locked --no-emit-project --extra dev --extra mcp -o requirements-ci.txt
      # The export carries a --hash for every artifact, so pip verifies each
      # download against the lockfile instead of trusting the registry.
      - run: pip install --require-hashes -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy repo2graph
      # Every version surface must agree with pyproject.toml. This was a
      # pre-commit hook and a publish.yml step and nothing in between, so it
      # only ran for contributors who had installed pre-commit -- and otherwise
      # first fired at release time, which is exactly the "burnt version number"
      # its own docstring says it exists to avoid. It is also what catches the
      # documented `@vN` tag and the `repo2graph==X.Y.Z` pin examples going
      # stale, which is how the README told users to pin `@v1` for a while after
      # 2.0.0 shipped.
      - run: python scripts/check_version.py
      # Branch coverage, gated at a floor. The baseline that BACKLOG item 7 said
      # was missing now exists: see [tool.coverage] in pyproject.toml for the
      # measured number and why the floor sits below it.
      - run: pytest -q --cov=repo2graph --cov-report=term-missing

      - name: Real embedder smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          R2G_TEST_REAL_EMBEDDER: "1"
        # Locked like the rest of the cell. `pip install ".[rag]"` also
        # reinstalled the project non-editable over the editable install above.
        run: |
          uv export --locked --no-emit-project --extra rag -o requirements-rag.txt
          pip install --require-hashes -r requirements-rag.txt
          pytest -q tests/test_vectors.py -k test_real_sentence_transformers_smoke_test

  drift:
    name: Upstream drift (unlocked)
    # What the locked matrix gives up: it no longer notices that a new release
    # of a dependency breaks this project. That signal is worth keeping, just
    # not on the path that gates every PR -- a PR should fail for what the PR
    # changed. So the same suite runs weekly against a fresh resolution, and a
    # failure here means "upstream moved", which is a different question from
    # "this change is wrong" and wants a different answer.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Deliberately not the full 9 cells: this is a canary, not a gate. Both
      # ends of the supported Python range on the two platforms whose native
      # wheels differ most -- the flake that prompted this was windows/3.10.
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # No lockfile on purpose: this job's whole value is resolving what a new
      # user would get today.
      - run: pip install -e ".[dev,mcp]"
      - run: pytest -q

      - name: Show what was actually resolved
        # Runs even on failure: the resolved versions are the first thing
        # anyone triaging this job needs, and re-running it would resolve
        # something else by then.
        if: always()
        run: pip freeze

  packaging:
    # The schedule trigger exists for `drift` alone.
    if: github.event_name != 'schedule'
    # Reproduces how third-party hosts install and start this server, which the
    # rest of the suite cannot: it imports `repo2graph.mcp` directly, and never
    # installs the package *without* an extra or spawns the real console script.
    #
    # Glama's build ran `uv sync` -- base dependencies only -- then
    # `repo2graph-mcp`, which exits 1 because the MCP SDK lives behind the `mcp`
    # extra. The server was right and the install was wrong, and nothing here
    # could see it. Both halves are now covered.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install "uv==0.12.15"

      - name: uv.lock must be current
        # A stale lockfile makes `uv sync` fail outright, so it would break the
        # very hosts the lockfile exists to make reproducible.
        run: |
          if ! uv lock --check; then
            echo "::error title=Stale uv.lock::uv.lock is out of sync with pyproject.toml. Please run 'uv lock' locally and commit the updated uv.lock file."
            exit 1
          fi

      - name: Without the mcp extra, the server refuses legibly
        run: |
          set -euo pipefail
          uv sync
          if uv run repo2graph-mcp . < /dev/null > out.txt 2> err.txt; then
            echo "::error::repo2graph-mcp exited 0 without the mcp extra"; exit 1
          fi
          cat err.txt
          grep -qF 'repo2graph[mcp]' err.txt || {
            echo "::error::the refusal must name the extra to install"; exit 1; }
          test ! -s out.txt || {
            echo "::error::nothing may reach stdout; it carries the JSON-RPC stream"
            cat out.txt; exit 1; }

      - name: With the mcp extra, a real stdio round trip succeeds
        # `uv sync --extra mcp` is the invocation a Glama build spec needs;
        # see the Registry section of .github/CONTRIBUTING.md.
        run: |
          set -euo pipefail
          uv sync --extra mcp
          uv run python scripts/mcp_roundtrip.py

  windows-cp1252-pipe:
    # The schedule trigger exists for `drift` alone.
    if: github.event_name != 'schedule'
    # The regression class this project keeps hitting: not "does Windows work",
    # but "does Windows work when stdout is a *pipe*". An interactive console is
    # UTF-8 capable and hides the bug; a redirect gives a cp1252 TextIOWrapper,
    # and Git Bash gives one with errors='surrogateescape', which still raises
    # on any character cp1252 lacks. The unit tests mock this; this job is the
    # one place it happens for real.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: cp1252
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Build a repo whose source is outside cp1252
        shell: bash
        run: |
          mkdir -p sample/pkg
          printf 'TABLE = {"caf\xc3\xa9": 1}\n\n\ndef arrow():\n    """Maps a \xe2\x86\x92 b, \xe4\xb8\xad."""\n    return TABLE\n' \
            > sample/pkg/unicode_source.py
          printf '# caf\xc3\xa9 \xe2\x86\x92 \xe4\xb8\xad\n\nNotes with U+2192, U+00E9 and U+4E2D.\n' \
            > sample/README.md

      - name: build, with stdout redirected to a file
        shell: bash
        run: |
          python -m repo2graph.cli build sample -o .r2g --formats jsonl,overview > build.out 2>build.err
          test -s build.out || { echo "build wrote nothing to stdout"; cat build.err; exit 1; }

      - name: rag and query, redirected
        shell: bash
        run: |
          python -m repo2graph.cli rag "what does arrow do" -o .r2g > rag.out 2>rag.err
          python -m repo2graph.cli query "arrow" -o .r2g > query.out 2>query.err
          python -m repo2graph.cli stats -o .r2g > stats.out 2>stats.err
          for f in rag.out query.out stats.out; do
            test -s "$f" || { echo "$f is empty"; exit 1; }
          done

      - name: piped stdout, which is what Git Bash makes surrogateescape
        shell: bash
        run: |
          python -m repo2graph.cli rag "what does arrow do" -o .r2g | head -20 > piped.out
          test -s piped.out || { echo "piped output was empty"; exit 1; }

  action:
    # The schedule trigger exists for `drift` alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run the action against this repository
        id: r2g
        uses: ./
        with:
          path: .
          out: .r2g
          git-history: "50"
          artifact-name: ""   # smoke test only, nothing to upload
          query: "how does pack_context enforce the budget"
          query-budget: "8000"

      - name: Check the outputs are non-empty
        env:
          NODES: ${{ steps.r2g.outputs.nodes }}
          EDGES: ${{ steps.r2g.outputs.edges }}
          CHUNKS: ${{ steps.r2g.outputs.chunks }}
        run: |
          set -euo pipefail
          echo "nodes=$NODES edges=$EDGES chunks=$CHUNKS"
          test "${NODES:-0}" -gt 0
          test "${EDGES:-0}" -gt 0
          test "${CHUNKS:-0}" -gt 0
          test -f .r2g/human/graph.html
          test -f .r2g/agent/chunks.jsonl

      - name: Check the GraphRAG pack was written and carries citations
        env:
          PACK_FILE: ${{ steps.r2g.outputs.pack-file }}
          PACK_CHARS: ${{ steps.r2g.outputs.pack-chars }}
        run: |
          set -euo pipefail
          echo "pack-file=$PACK_FILE pack-chars=$PACK_CHARS"
          test -n "$PACK_FILE"
          test -s "$PACK_FILE"
          test "${PACK_CHARS:-0}" -gt 0
          grep -q '\[cite:' "$PACK_FILE"
