name: CI

# Runs the test suite, code quality checks, and smoke-tests the composite action itself,
# so a release never ships an action or package that cannot build a graph.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The `drift` job only. 05:00 Monday sits between self-index (04:00) and
  # dependency-audit (06:00) so the three weekly jobs do not contend.
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  # A newer push to the same PR makes the older matrix run redundant. Pushes
  # to main are NOT cancelled: main's runs are the record of what that commit
  # did, and the expression keeps them running.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  code-quality:
    name: Code Quality & Static Analysis
    # The scheduled run exists for `drift` alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install "uv==0.12.15"

      - name: Export locked dependency set
        run: uv export --locked --no-emit-project --extra dev --extra mcp -o requirements-ci.txt

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Linter (Ruff)
        id: lint
        run: ruff check --output-format=github .

      - name: Formatting Check (Ruff)
        id: format
        run: ruff format --check .

      # Once per supported platform, on this one runner. typeshed guards a
      # good deal of the standard library on `sys.platform`, so a single
      # native run checks only the stubs the runner's own platform selects:
      # `resource.getrusage` is win32-guarded, and `cli._peak_rss_mb` called
      # it behind a `try/except ImportError` that mypy cannot narrow, so
      # `make typecheck` and the `mypy-strict` pre-commit hook were red on
      # every Windows checkout while this step stayed green (#484).
      #
      # `--platform` resolves those guards as the named platform would without
      # a second runner, so the cost is two extra mypy passes over a warm
      # cache rather than two more jobs. The test matrix already covers
      # windows and macos at runtime; this covers them at type level.
      - name: Type Check (Mypy, every supported platform)
        id: typecheck
        run: |
          for platform in linux darwin win32; do
            echo "::group::mypy --platform $platform"
            mypy --platform "$platform" repo2graph
            echo "::endgroup::"
          done

      - name: Version Surfaces Consistency Check
        id: version_check
        run: python scripts/check_version.py

      - name: Workflow Summary Integrity Check
        id: summary_check
        run: python scripts/check_workflow_summaries.py

      - name: Generate Code Quality Step Summary
        if: always()
        shell: bash
        env:
          # Reports each step's real outcome. Hardcoding "✅ Passed" under
          # `if: always()` rendered a green row in the summary of a run whose
          # lint, format, typecheck, or version check had just failed.
          LINT: ${{ steps.lint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          VERSION_CHECK: ${{ steps.version_check.outcome }}
          SUMMARY_CHECK: ${{ steps.summary_check.outcome }}
        run: |
          status() { [ "$1" = "success" ] && echo "✅ Passed" || echo "❌ Failed ($1)"; }
          # printf with placeholders rather than an unquoted heredoc -- an
          # unquoted `cat << EOF` performs command substitution, so a stray
          # backtick or `$(` in a future row would execute.
          {
            printf '### 🛡️ Code Quality & Static Analysis Summary\n\n'
            printf '| Check | Status | Verification Tool |\n'
            printf '| :--- | :---: | :--- |\n'
            printf '| **Code Linting** | %s | Ruff (inline PR annotations enabled) |\n' "$(status "$LINT")"
            printf '| **Code Formatting** | %s | Ruff Formatter |\n' "$(status "$FORMAT")"
            printf '| **Strict Type Checking** | %s | Mypy (`--platform` linux, darwin, win32) |\n' "$(status "$TYPECHECK")"
            printf '| **Version Surfaces Integrity** | %s | `scripts/check_version.py` |\n' "$(status "$VERSION_CHECK")"
            printf '| **Workflow Summary Integrity** | %s | `scripts/check_workflow_summaries.py` |\n' "$(status "$SUMMARY_CHECK")"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    # The scheduled run exists for `drift` alone; this job is what gates a PR.
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    # Headroom for a slow runner, not for a slow suite. A Windows cell that
    # finished in 5m37s on one run reached 93% of the same suite in 20 minutes
    # on the next and was cancelled at the ceiling -- same commit, same
    # configuration, a runner roughly 4x slower. A timeout is a ceiling rather
    # than a cost, so it should sit above the worst runner rather than just
    # above the usual one; this is ~3x the slowest honest run (10m2s).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14 is here because a classifier claiming it is a promise, and
        # `tests/test_packaging.py` now ties the two together. 3.10 was dropped
        # once it reached end of life (October 2026) and `filelock` stopped
        # shipping a 3.10-compatible release carrying its advisory fixes -- that
        # was a `requires-python` bump, a breaking change, not a matrix edit.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: pip install "uv==0.12.15"

      - name: Export the locked dependency set
        run: uv export --locked --no-emit-project --extra dev --extra mcp -o requirements-ci.txt

      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r requirements-ci.txt
          pip install -e . --no-deps

      # `-n auto` uses every vCPU the runner has (4 on the hosted Linux and
      # Windows images). Coverage still combines correctly because
      # [tool.coverage.run] sets parallel = true, which the multiprocessing
      # build path already needed.
      #
      # Windows caps that at 2. Four xdist workers there each run tests that
      # spawn their own coverage-traced multiprocessing pools, plus `node` and
      # `git` children, on a 4-vCPU image with a small pagefile -- so the
      # runner is oversubscribed several times over and what breaks is never
      # the code under test. Five of the twelve CI runs before this change
      # were red, every one of them on a Windows cell and every one of them on
      # a resource symptom: three elapsed-time assertions, one count that
      # depends on a timeout, and `WinError 1455` (the commit limit) raised
      # while spawning `node` in test_npm_launcher. A 40% red rate with no
      # real finding behind it is worse than a slower Windows cell, because it
      # teaches everyone to re-run the job rather than read it.
      #
      # `PYTEST_XDIST_AUTO_NUM_WORKERS` is how xdist takes this without
      # changing the command: it overrides what `-n auto` resolves to, and an
      # empty value (every non-Windows cell) leaves `auto` alone.
      #
      # Windows also runs without `--cov`, which is the other half of the same
      # problem and the larger half. `[tool.coverage.run]` sets
      # `concurrency = multiprocessing`, so every process the suite spawns --
      # parse pools, the MCP stdio probe, `node`, `git` -- starts a tracer of
      # its own and writes its own data file. Measured on a Windows box,
      # `tests/test_mcp.py tests/test_mcp_tools.py` take 17s without `--cov`
      # and 26s with it; on a 4-vCPU runner that multiplier is what turned a
      # 180s subprocess timeout and a worker's startup into failures. Capping
      # the workers alone was not enough: 3.11 and 3.12 went green, the since
      # dropped 3.10 cell lost a worker and 3.13 timed out spawning the probe.
      #
      # Nothing is given up by doing this. Coverage is a property of the test
      # suite, not of the operating system, and the `fail_under = 80` floor is
      # still enforced on the eight Linux and macOS cells; the one cell that
      # reports coverage anywhere (the step summary below) is Ubuntu 3.13.
      # Together these took Windows from four red cells to one, and each cell
      # from 6-10 minutes to around 5m35s.
      #
      # These two were found while chasing Windows cells that failed on
      # allocation rather than on behaviour -- `WinError 1455`,
      # `0xC000012D STATUS_COMMITMENT_LIMIT`, `MemoryError`,
      # `RuntimeError: can't start new thread`, a different test each run. The
      # cause turned out not to be the runner being small or the suite being
      # greedy: sampling total commit every 5s during a run named it outright,
      #
      #   35,518 MB committed, limit 33,665 MB
      #   cc1=32656MB  MsMpEng=249  python=122  python=119
      #
      # a single `cc1` holding 32.6 GB while every Python process sat at ~120
      # MB. That is `tests/test_cpp_parse.py`'s macro bomb expanding inside the
      # real preprocessor, which `_run_cpp` bounded for output and wall clock
      # but not for memory; `parse.CPP_MEMORY_MB` now caps it. Profiling the
      # suite itself first was a detour worth recording: peak commit of any
      # single pytest process is 167 MB and the whole run moves system commit
      # by 356 MB, so the suite was never the consumer.

      - name: Run Test Suite & Branch Coverage
        if: matrix.os != 'windows-latest'
        run: pytest -q -n auto --cov=repo2graph --cov-report=term-missing

      - name: Run Test Suite (Windows, uninstrumented)
        if: matrix.os == 'windows-latest'
        env:
          # Two, after measuring one. A single worker was tried for exactly the
          # reason above and did not clear the wall either -- it failed the same
          # two-of-four cells while adding three minutes to each (8m40s against
          # 5m35s), so there is no evidence for paying that. See the note above
          # the non-Windows step for what is actually left.
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: pytest -q -n auto

      - name: Append Test Coverage to Step Summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          if [ -f .coverage ]; then
            echo "### 📈 Branch Coverage Summary (Ubuntu, Python 3.13)" >> "$GITHUB_STEP_SUMMARY"
            coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Real embedder smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          R2G_TEST_REAL_EMBEDDER: "1"
        run: |
          uv export --locked --no-emit-project --extra rag -o requirements-rag.txt
          pip install --require-hashes -r requirements-rag.txt
          pytest -q tests/test_vectors.py -k test_real_sentence_transformers_smoke_test

  drift:
    name: Upstream Dependency Drift Canary (Unlocked)
    # What the locked matrix gives up: it no longer notices that a new release
    # of a dependency breaks this project. That signal is worth keeping, just
    # not on the path that gates every PR -- a PR should fail for what the PR
    # changed. So the same suite runs weekly against a fresh resolution, and a
    # failure here means "upstream moved", which is a different question from
    # "this change is wrong" and wants a different answer.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The floor and the newest, which are the two ends upstream breaks at:
        # the floor loses support, the newest gains an untested interpreter.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install fresh packages
        run: pip install -e ".[dev,mcp]"

      - name: Run test suite against fresh upstream
        run: pytest -q -n auto

      - name: Show what was actually resolved
        if: always()
        run: pip freeze

  packaging:
    name: Package Distribution & MCP Stdio Smoke Test
    # The schedule trigger exists for `drift` alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install "uv==0.12.15"

      - name: Verify uv.lock Currency
        id: lock_check
        run: |
          if ! uv lock --check; then
            echo "::error title=Stale uv.lock::uv.lock is out of sync with pyproject.toml. Please run 'uv lock' locally and commit the updated uv.lock file."
            exit 1
          fi

      - name: Verify Refusal Without MCP Extra
        id: mcp_refusal
        run: |
          set -euo pipefail
          uv sync
          if uv run repo2graph-mcp . < /dev/null > out.txt 2> err.txt; then
            echo "::error::repo2graph-mcp exited 0 without the mcp extra"; exit 1
          fi
          cat err.txt
          grep -qF 'repo2graph[mcp]' err.txt || {
            echo "::error::the refusal must name the extra to install"; exit 1; }
          test ! -s out.txt || {
            echo "::error::nothing may reach stdout; it carries the JSON-RPC stream"
            cat out.txt; exit 1; }

      - name: Verify Real MCP Stdio Round-Trip
        id: mcp_roundtrip
        run: |
          set -euo pipefail
          uv sync --extra mcp
          uv run python scripts/mcp_roundtrip.py

      - name: Append Packaging & MCP Smoke Summary
        if: always()
        shell: bash
        env:
          # Reports each step's real outcome. Hardcoding "✅ Passed" under
          # `if: always()` rendered a green row in the summary of a run whose
          # lock check, refusal check, or roundtrip check had just failed.
          LOCK_CHECK: ${{ steps.lock_check.outcome }}
          MCP_REFUSAL: ${{ steps.mcp_refusal.outcome }}
          MCP_ROUNDTRIP: ${{ steps.mcp_roundtrip.outcome }}
        run: |
          status() { [ "$1" = "success" ] && echo "✅ Passed" || echo "❌ Failed ($1)"; }
          {
            printf '### 📦 Packaging & Distribution Smoke Summary\n\n'
            printf '| Check | Status | Details |\n'
            printf '| :--- | :---: | :--- |\n'
            printf '| **uv.lock Currency** | %s | Up to date with `pyproject.toml` |\n' "$(status "$LOCK_CHECK")"
            printf '| **Refusal Without MCP Extra** | %s | Fails cleanly with installation guidance |\n' "$(status "$MCP_REFUSAL")"
            printf '| **Real MCP Stdio Round-Trip** | %s | Verified stdio handshake and query response |\n' "$(status "$MCP_ROUNDTRIP")"
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Container Image Build & Read-Only Smoke Test
    # The schedule trigger exists for `drift` alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the --git-history assertion below needs real history
          persist-credentials: false

      # `.github/SECURITY.md` documents this image in detail -- non-root
      # 10000:10000, `PYTHONDONTWRITEBYTECODE` for a read-only rootfs, git
      # present so discovery uses `git ls-files`, `safe.directory /repo`
      # written into the system config -- and then says the image "is not
      # currently built in CI". Every one of those claims was therefore
      # unverified, and a Dockerfile nothing builds is a Dockerfile that
      # breaks without anyone finding out. This job does not publish an image;
      # it builds it and checks the documented properties actually hold.
      - name: Build the image
        id: build
        run: docker build -t repo2graph:ci .

      - name: Runs as the documented non-root UID/GID
        id: nonroot
        run: |
          set -euo pipefail
          got=$(docker run --rm repo2graph:ci id -u):$(docker run --rm repo2graph:ci id -g)
          echo "id=$got"
          test "$got" = "10000:10000"

      # The whole point of PYTHONDONTWRITEBYTECODE and the system-level
      # safe.directory: a --read-only rootfs with no writable HOME must still
      # index a mounted checkout. A tmpfs is given for /tmp only, as the
      # documented run does.
      - name: Build a graph with a read-only rootfs
        id: readonly
        run: |
          set -euo pipefail
          # Docker creates a missing bind-mount source as root, and the
          # container is UID 10000, so the output directory has to exist and
          # be writable by it before the mount.
          mkdir -p out && chmod 777 out
          docker run --rm --read-only --tmpfs /tmp \
            -v "$PWD:/repo:ro" -v "$PWD/out:/out" \
            repo2graph:ci repo2graph build /repo -o /out --git-history 50
          test -s out/agent/chunks.jsonl
          test -s out/agent/nodes.jsonl
          test -f out/human/graph.html

      # Discovery must have used `git ls-files` rather than falling back to
      # os.walk -- the fallback does not honour .gitignore, so the image would
      # silently index a different file set than every other way of running
      # the same build. A CO_CHANGE edge can only come from reading git
      # history, so its presence proves git worked inside the container.
      - name: Confirm git-backed discovery and CO_CHANGE edges
        id: git_backed
        run: |
          set -euo pipefail
          # A CO_CHANGE edge can only come from reading git history, so its
          # presence proves git ran inside the container at all.
          grep -q '"CO_CHANGE"' out/agent/edges.jsonl
          # And this proves discovery went through `git ls-files` rather than
          # falling back to `os.walk`, which does not honour .gitignore:
          # `requirements-ci.txt` is gitignored (it is generated by `uv export`
          # in the other jobs), so a walk would have indexed it and git cannot.
          # Written *after* the build above, so re-run it against a tree that
          # contains the file.
          printf 'tree-sitter==0.26.0\n' > requirements-ci.txt
          rm -rf out2 && mkdir -p out2 && chmod 777 out2
          docker run --rm --read-only --tmpfs /tmp \
            -v "$PWD:/repo:ro" -v "$PWD/out2:/out" \
            repo2graph:ci repo2graph build /repo -o /out
          test -s out2/agent/nodes.jsonl
          ! grep -qF '"path": "requirements-ci.txt"' out2/agent/nodes.jsonl

      - name: Query the index inside the container
        id: query
        run: |
          set -euo pipefail
          docker run --rm --read-only --tmpfs /tmp -v "$PWD/out:/out:ro" \
            repo2graph:ci repo2graph rag "how does pack_context enforce the budget" \
            -o /out > pack.txt
          grep -q '\[cite:' pack.txt

      - name: Append Container Smoke Summary
        if: always()
        shell: bash
        env:
          # Each step's real outcome. A hardcoded "✅" under `if: always()` is
          # the bug every other summary here had to have fixed.
          BUILD: ${{ steps.build.outcome }}
          NONROOT: ${{ steps.nonroot.outcome }}
          READONLY: ${{ steps.readonly.outcome }}
          GIT_BACKED: ${{ steps.git_backed.outcome }}
          QUERY: ${{ steps.query.outcome }}
        run: |
          status() { [ "$1" = "success" ] && echo "✅ Passed" || echo "❌ Failed ($1)"; }
          {
            printf '### 🐳 Container Image Smoke Summary\n\n'
            printf '| Property | Status | What it proves |\n'
            printf '| :--- | :---: | :--- |\n'
            printf '| **Image builds** | %s | `Dockerfile` is not stale |\n' "$(status "$BUILD")"
            printf '| **Non-root 10000:10000** | %s | Matches SECURITY.md |\n' "$(status "$NONROOT")"
            printf '| **Read-only rootfs build** | %s | No writable HOME needed |\n' "$(status "$READONLY")"
            printf '| **git-backed discovery** | %s | `git ls-files`, not `os.walk` |\n' "$(status "$GIT_BACKED")"
            printf '| **Cited pack from container** | %s | `rag` works in the image |\n' "$(status "$QUERY")"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-cp1252-pipe:
    name: Windows CP1252 Non-UTF8 Pipeline Compatibility
    # The schedule trigger exists for `drift` alone.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: cp1252
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build repository containing non-ASCII symbols
        id: unicode_build
        shell: bash
        run: |
          mkdir -p sample/pkg
          printf 'TABLE = {"caf\xc3\xa9": 1}\n\n\ndef arrow():\n    """Maps a \xe2\x86\x92 b, \xe4\xb8\xad."""\n    return TABLE\n' \
            > sample/pkg/unicode_source.py
          printf '# caf\xc3\xa9 \xe2\x86\x92 \xe4\xb8\xad\n\nNotes with U+2192, U+00E9 and U+4E2D.\n' \
            > sample/README.md

      - name: Build with stdout redirected to file
        id: cli_build
        shell: bash
        run: |
          python -m repo2graph.cli build sample -o .r2g --formats jsonl,overview > build.out 2>build.err
          test -s build.out || { echo "build wrote nothing to stdout"; cat build.err; exit 1; }

      - name: RAG and query with stdout redirected to file
        id: cli_rag
        shell: bash
        run: |
          python -m repo2graph.cli rag "what does arrow do" -o .r2g > rag.out 2>rag.err
          python -m repo2graph.cli query "arrow" -o .r2g > query.out 2>query.err
          python -m repo2graph.cli stats -o .r2g > stats.out 2>stats.err
          for f in rag.out query.out stats.out; do
            test -s "$f" || { echo "$f is empty"; exit 1; }
          done

      - name: Pipeline handling with piped stdout (surrogateescape check)
        id: pipe_check
        shell: bash
        run: |
          python -m repo2graph.cli rag "what does arrow do" -o .r2g | head -20 > piped.out
          test -s piped.out || { echo "piped output was empty"; exit 1; }

      - name: Append Windows CP1252 Compatibility Summary
        if: always()
        shell: bash
        env:
          # Reports each phase's real outcome. Hardcoding "✅ Passed" under
          # `if: always()` rendered a green row in the summary of a run whose
          # build, CLI, or pipe check had just failed.
          UNICODE_BUILD: ${{ steps.unicode_build.outcome }}
          CLI_BUILD: ${{ steps.cli_build.outcome }}
          CLI_RAG: ${{ steps.cli_rag.outcome }}
          PIPE_CHECK: ${{ steps.pipe_check.outcome }}
        run: |
          status() { [ "$1" = "success" ] && echo "✅ Passed" || echo "❌ Failed ($1)"; }
          # Combine build+RAG: fails if either step failed.
          if [ "$CLI_BUILD" = "success" ] && [ "$CLI_RAG" = "success" ]; then
            cli_status="✅ Passed"
          else
            cli_status="❌ Failed (build=$CLI_BUILD, rag=$CLI_RAG)"
          fi
          {
            printf '### 🪟 Windows CP1252 Non-UTF8 Pipeline Summary\n\n'
            printf '| Test Phase | Result | Details |\n'
            printf '| :--- | :---: | :--- |\n'
            printf '| **Unicode Ingestion** | %s | Non-ASCII symbols (café, arrows, CJK) parsed |\n' "$(status "$UNICODE_BUILD")"
            printf '| **CLI Build & RAG with CP1252** | %s | Build, RAG, query, and stats non-empty |\n' "$cli_status"
            printf '| **Stdout Pipeline Streaming** | %s | Safe surrogateescape pipe handling verified |\n' "$(status "$PIPE_CHECK")"
          } >> "$GITHUB_STEP_SUMMARY"

  action:
    name: GitHub Action Composite Integration Test
    # The schedule trigger exists for `drift` alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run composite action against this repository
        id: r2g
        uses: ./
        with:
          path: .
          out: .r2g
          git-history: "50"
          artifact-name: ""   # smoke test only, nothing to upload
          query: "how does pack_context enforce the budget"
          query-budget: "8000"

      - name: Check output counts and files are non-empty
        id: counts_check
        env:
          NODES: ${{ steps.r2g.outputs.nodes }}
          EDGES: ${{ steps.r2g.outputs.edges }}
          CHUNKS: ${{ steps.r2g.outputs.chunks }}
        run: |
          set -euo pipefail
          echo "nodes=$NODES edges=$EDGES chunks=$CHUNKS"
          test "${NODES:-0}" -gt 0
          test "${EDGES:-0}" -gt 0
          test "${CHUNKS:-0}" -gt 0
          test -f .r2g/human/graph.html
          test -f .r2g/agent/chunks.jsonl

      - name: Check GraphRAG pack carries citations
        id: citations_check
        env:
          PACK_FILE: ${{ steps.r2g.outputs.pack-file }}
          PACK_CHARS: ${{ steps.r2g.outputs.pack-chars }}
        run: |
          set -euo pipefail
          echo "pack-file=$PACK_FILE pack-chars=$PACK_CHARS"
          test -n "$PACK_FILE"
          test -s "$PACK_FILE"
          test "${PACK_CHARS:-0}" -gt 0
          grep -q '\[cite:' "$PACK_FILE"

      - name: Append Composite Action Summary
        if: always()
        env:
          NODES: ${{ steps.r2g.outputs.nodes }}
          EDGES: ${{ steps.r2g.outputs.edges }}
          CHUNKS: ${{ steps.r2g.outputs.chunks }}
          PACK_CHARS: ${{ steps.r2g.outputs.pack-chars }}
          # Reports each check's real outcome. Hardcoding "✅ Non-zero" under
          # `if: always()` rendered a green row even when the counts check or
          # the citations check had just failed.
          COUNTS_CHECK: ${{ steps.counts_check.outcome }}
          CITATIONS_CHECK: ${{ steps.citations_check.outcome }}
        shell: bash
        run: |
          counts_status() { [ "$COUNTS_CHECK" = "success" ] && echo "✅ Non-zero" || echo "❌ Failed ($COUNTS_CHECK)"; }
          citations_status() { [ "$CITATIONS_CHECK" = "success" ] && echo "✅ Verified present" || echo "❌ Failed ($CITATIONS_CHECK)"; }
          citations_value() { [ "$CITATIONS_CHECK" = "success" ] && echo "Grounded (\`[cite:...]\`)" || echo "Not verified"; }
          {
            printf '### ⚡ GitHub Action Composite Integration Summary\n\n'
            printf '| Metric | Value | Verification |\n'
            printf '| :--- | :---: | :---: |\n'
            printf '| **Nodes Generated** | `%s` | %s |\n' "$NODES" "$(counts_status)"
            printf '| **Edges Generated** | `%s` | %s |\n' "$EDGES" "$(counts_status)"
            printf '| **Chunks Created** | `%s` | %s |\n' "$CHUNKS" "$(counts_status)"
            printf '| **GraphRAG Pack Chars** | `%s` | %s |\n' "$PACK_CHARS" "$(citations_status)"
            printf '| **Citations Verified** | %s | %s |\n' "$(citations_value)" "$(citations_status)"
          } >> "$GITHUB_STEP_SUMMARY"
