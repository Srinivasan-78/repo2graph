name: CI

# Runs the test suite, code quality checks, and smoke-tests the composite action itself,
# so a release never ships an action or package that cannot build a graph.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The `drift` job only. 05:00 Monday sits between self-index (04:00) and
  # dependency-audit (06:00) so the three weekly jobs do not contend.
  schedule:
    - cron: "0 5 * * 1"

concurrency:
  # A newer push to the same PR makes the older matrix run redundant. Pushes
  # to main are NOT cancelled: main's runs are the record of what that commit
  # did, and the expression keeps them running.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  code-quality:
    name: Code Quality & Static Analysis
    # The scheduled run exists for `drift` alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install "uv==0.12.15"

      - name: Export locked dependency set
        run: uv export --locked --no-emit-project --extra dev --extra mcp -o requirements-ci.txt

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Linter (Ruff)
        run: ruff check --output-format=github .

      - name: Formatting Check (Ruff)
        run: ruff format --check .

      - name: Type Check (Mypy)
        run: mypy repo2graph

      - name: Version Surfaces Consistency Check
        run: python scripts/check_version.py

      - name: Generate Code Quality Step Summary
        if: always()
        shell: bash
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### 🛡️ Code Quality & Static Analysis Summary

          | Check | Status | Verification Tool |
          | :--- | :---: | :--- |
          | **Code Linting** | ✅ Passed | Ruff (inline PR annotations enabled) |
          | **Code Formatting** | ✅ Passed | Ruff Formatter |
          | **Strict Type Checking** | ✅ Passed | Mypy |
          | **Version Surfaces Integrity** | ✅ Passed | `scripts/check_version.py` |
          EOF

  tests:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    # The scheduled run exists for `drift` alone; this job is what gates a PR.
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: pip install "uv==0.12.15"

      - name: Export the locked dependency set
        run: uv export --locked --no-emit-project --extra dev --extra mcp -o requirements-ci.txt

      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Run Test Suite & Branch Coverage
        run: pytest -q --cov=repo2graph --cov-report=term-missing

      - name: Append Test Coverage to Step Summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          if [ -f .coverage ]; then
            echo "### 📈 Branch Coverage Summary (Ubuntu, Python 3.13)" >> "$GITHUB_STEP_SUMMARY"
            coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Real embedder smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          R2G_TEST_REAL_EMBEDDER: "1"
        run: |
          uv export --locked --no-emit-project --extra rag -o requirements-rag.txt
          pip install --require-hashes -r requirements-rag.txt
          pytest -q tests/test_vectors.py -k test_real_sentence_transformers_smoke_test

  drift:
    name: Upstream Dependency Drift Canary (Unlocked)
    # What the locked matrix gives up: it no longer notices that a new release
    # of a dependency breaks this project. That signal is worth keeping, just
    # not on the path that gates every PR -- a PR should fail for what the PR
    # changed. So the same suite runs weekly against a fresh resolution, and a
    # failure here means "upstream moved", which is a different question from
    # "this change is wrong" and wants a different answer.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install fresh packages
        run: pip install -e ".[dev,mcp]"

      - name: Run test suite against fresh upstream
        run: pytest -q

      - name: Show what was actually resolved
        if: always()
        run: pip freeze

  packaging:
    name: Package Distribution & MCP Stdio Smoke Test
    # The schedule trigger exists for `drift` alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install "uv==0.12.15"

      - name: Verify uv.lock Currency
        run: |
          if ! uv lock --check; then
            echo "::error title=Stale uv.lock::uv.lock is out of sync with pyproject.toml. Please run 'uv lock' locally and commit the updated uv.lock file."
            exit 1
          fi

      - name: Verify Refusal Without MCP Extra
        run: |
          set -euo pipefail
          uv sync
          if uv run repo2graph-mcp . < /dev/null > out.txt 2> err.txt; then
            echo "::error::repo2graph-mcp exited 0 without the mcp extra"; exit 1
          fi
          cat err.txt
          grep -qF 'repo2graph[mcp]' err.txt || {
            echo "::error::the refusal must name the extra to install"; exit 1; }
          test ! -s out.txt || {
            echo "::error::nothing may reach stdout; it carries the JSON-RPC stream"
            cat out.txt; exit 1; }

      - name: Verify Real MCP Stdio Round-Trip
        run: |
          set -euo pipefail
          uv sync --extra mcp
          uv run python scripts/mcp_roundtrip.py

      - name: Append Packaging & MCP Smoke Summary
        if: always()
        shell: bash
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### 📦 Packaging & Distribution Smoke Summary

          | Check | Status | Details |
          | :--- | :---: | :--- |
          | **uv.lock Currency** | ✅ Passed | Up to date with `pyproject.toml` |
          | **Refusal Without MCP Extra** | ✅ Passed | Fails cleanly with installation guidance |
          | **Real MCP Stdio Round-Trip** | ✅ Passed | Verified stdio handshake and query response |
          EOF

  windows-cp1252-pipe:
    name: Windows CP1252 Non-UTF8 Pipeline Compatibility
    # The schedule trigger exists for `drift` alone.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: cp1252
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build repository containing non-ASCII symbols
        shell: bash
        run: |
          mkdir -p sample/pkg
          printf 'TABLE = {"caf\xc3\xa9": 1}\n\n\ndef arrow():\n    """Maps a \xe2\x86\x92 b, \xe4\xb8\xad."""\n    return TABLE\n' \
            > sample/pkg/unicode_source.py
          printf '# caf\xc3\xa9 \xe2\x86\x92 \xe4\xb8\xad\n\nNotes with U+2192, U+00E9 and U+4E2D.\n' \
            > sample/README.md

      - name: Build with stdout redirected to file
        shell: bash
        run: |
          python -m repo2graph.cli build sample -o .r2g --formats jsonl,overview > build.out 2>build.err
          test -s build.out || { echo "build wrote nothing to stdout"; cat build.err; exit 1; }

      - name: RAG and query with stdout redirected to file
        shell: bash
        run: |
          python -m repo2graph.cli rag "what does arrow do" -o .r2g > rag.out 2>rag.err
          python -m repo2graph.cli query "arrow" -o .r2g > query.out 2>query.err
          python -m repo2graph.cli stats -o .r2g > stats.out 2>stats.err
          for f in rag.out query.out stats.out; do
            test -s "$f" || { echo "$f is empty"; exit 1; }
          done

      - name: Pipeline handling with piped stdout (surrogateescape check)
        shell: bash
        run: |
          python -m repo2graph.cli rag "what does arrow do" -o .r2g | head -20 > piped.out
          test -s piped.out || { echo "piped output was empty"; exit 1; }

      - name: Append Windows CP1252 Compatibility Summary
        if: always()
        shell: bash
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### 🪟 Windows CP1252 Non-UTF8 Pipeline Summary

          | Test Phase | Result | Details |
          | :--- | :---: | :--- |
          | **Unicode Ingestion** | ✅ Passed | Non-ASCII symbols (café, arrows, CJK) parsed |
          | **CLI Build & RAG with CP1252** | ✅ Passed | Build, RAG, query, and stats non-empty |
          | **Stdout Pipeline Streaming** | ✅ Passed | Safe surrogateescape pipe handling verified |
          EOF

  action:
    name: GitHub Action Composite Integration Test
    # The schedule trigger exists for `drift` alone.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run composite action against this repository
        id: r2g
        uses: ./
        with:
          path: .
          out: .r2g
          git-history: "50"
          artifact-name: ""   # smoke test only, nothing to upload
          query: "how does pack_context enforce the budget"
          query-budget: "8000"

      - name: Check output counts and files are non-empty
        env:
          NODES: ${{ steps.r2g.outputs.nodes }}
          EDGES: ${{ steps.r2g.outputs.edges }}
          CHUNKS: ${{ steps.r2g.outputs.chunks }}
        run: |
          set -euo pipefail
          echo "nodes=$NODES edges=$EDGES chunks=$CHUNKS"
          test "${NODES:-0}" -gt 0
          test "${EDGES:-0}" -gt 0
          test "${CHUNKS:-0}" -gt 0
          test -f .r2g/human/graph.html
          test -f .r2g/agent/chunks.jsonl

      - name: Check GraphRAG pack carries citations
        env:
          PACK_FILE: ${{ steps.r2g.outputs.pack-file }}
          PACK_CHARS: ${{ steps.r2g.outputs.pack-chars }}
        run: |
          set -euo pipefail
          echo "pack-file=$PACK_FILE pack-chars=$PACK_CHARS"
          test -n "$PACK_FILE"
          test -s "$PACK_FILE"
          test "${PACK_CHARS:-0}" -gt 0
          grep -q '\[cite:' "$PACK_FILE"

      - name: Append Composite Action Summary
        if: always()
        env:
          NODES: ${{ steps.r2g.outputs.nodes }}
          EDGES: ${{ steps.r2g.outputs.edges }}
          CHUNKS: ${{ steps.r2g.outputs.chunks }}
          PACK_CHARS: ${{ steps.r2g.outputs.pack-chars }}
        shell: bash
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### ⚡ GitHub Action Composite Integration Summary

          | Metric | Value | Verification |
          | :--- | :---: | :---: |
          | **Nodes Generated** | \`$NODES\` | ✅ Non-zero |
          | **Edges Generated** | \`$EDGES\` | ✅ Non-zero |
          | **Chunks Created** | \`$CHUNKS\` | ✅ Non-zero |
          | **GraphRAG Pack Chars** | \`$PACK_CHARS\` | ✅ Non-zero |
          | **Citations Verified** | Grounded (\`[cite:...]\`) | ✅ Verified present |
          EOF
