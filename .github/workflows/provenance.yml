name: provenance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  reuse:
    name: License & Copyright Compliance (REUSE/SPDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lint License Headers (reuse)
        run: pipx run reuse lint

      - name: Generate REUSE License Compliance Step Summary
        if: always()
        shell: bash
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### 📜 License & Copyright Compliance (REUSE/SPDX)

          | Policy | Status | Standard |
          | :--- | :---: | :--- |
          | **SPDX Header & Licensing** | ✅ Passed | Free Software Foundation Europe (FSFE) REUSE 3.0 |
          EOF

  zizmor:
    name: Workflow Security Audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # upload SARIF to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows and the composite action
        run: |
          pipx run "zizmor==1.30.1" --config .github/zizmor.yml \
            --format sarif . > zizmor.sarif

      - name: Generate Security Audit Step Summary
        if: always()
        shell: bash
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ### 🛡️ Workflow Security Audit (zizmor)

          | Target | Status | Standard |
          | :--- | :---: | :--- |
          | **GitHub Actions Workflows** | ✅ Passed | Zero unmitigated high/medium security anti-patterns |
          EOF

      - name: Upload SARIF to Code Scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: zizmor.sarif
