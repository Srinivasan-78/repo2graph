name: provenance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE / SPDX compliance
        run: pipx run reuse lint

  # Lints every workflow and action.yml for the risk that lives in the YAML
  # itself, not the Python: dangerous triggers, excessive permissions,
  # template injection, unpinned actions. `.github/zizmor.yml` records every
  # accepted finding at its exact file:line with a reason -- a new finding of
  # the same kind elsewhere still fails this job. Not (yet) one of the
  # required status checks SECURITY.md lists, the same as `reuse` above.
  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # upload SARIF to Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows and the composite action
        run: |
          pipx run "zizmor==1.30.1" --config .github/zizmor.yml \
            --format sarif . > zizmor.sarif

      - name: Upload SARIF to Code Scanning
        # Runs even if the audit step above failed, so a real finding still
        # shows up in Code Scanning. Skipped only for a fork PR: GITHUB_TOKEN
        # there is read-only regardless of the `permissions:` block above, so
        # the upload would just fail -- the audit step already gated the PR
        # itself on findings, SARIF or not.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: zizmor.sarif
