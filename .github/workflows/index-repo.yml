name: Index repository
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo: owner/repo or a GitHub URL"
        required: true
      ref:
        description: "Branch or tag (blank = default branch)"
        required: false
        default: ""
      git_history:
        description: "Commits to scan for CO_CHANGE edges (0 = skip)"
        required: false
        default: "200"
      formats:
        description: "Comma list: jsonl,graphml,cypher,overview,html"
        required: false
        default: "jsonl,graphml,cypher,overview,html"
      exclude:
        description: "Space-separated globs to exclude, e.g. '**/test/**'"
        required: false
        default: ""
      publish_release:
        description: "Also attach the graph to a GitHub Release in this repo"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo2graph
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install repo2graph
        run: pip install -e .

      - name: Build the graph
        id: build
        # Inputs go through the environment, never straight into the script:
        # ${{ }} is substituted before bash sees it, so an input containing shell
        # metacharacters would otherwise execute.
        env:
          # Needed only for private targets; the default token can read this repo's org
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN || github.token }}
          R2G_REPO: ${{ inputs.repo }}
          R2G_REF: ${{ inputs.ref }}
          R2G_HISTORY: ${{ inputs.git_history }}
          R2G_FORMATS: ${{ inputs.formats }}
          R2G_EXCLUDE: ${{ inputs.exclude }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$R2G_REPO" | sed -E 's#.*github\.com[:/]##; s#\.git/?$##; s#/#__#g')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          mkdir -p "out/$slug"
          args=(github "$R2G_REPO" -o "out/$slug"
                --git-history "$R2G_HISTORY"
                --formats "$R2G_FORMATS")
          if [ -n "$R2G_REF" ]; then args+=(--ref "$R2G_REF"); fi
          # read -a splits on spaces without letting bash expand the globs
          if [ -n "$R2G_EXCLUDE" ]; then
            read -r -a exc <<< "$R2G_EXCLUDE"
            args+=(--exclude "${exc[@]}")
          fi
          repo2graph "${args[@]}" | tee "out/$slug/summary.json"
          {
            echo "### Graph for \`$R2G_REPO\`"
            echo
            echo '```json'
            jq 'del(.stats)' "out/$slug/summary.json"
            echo '```'
            echo
            # overview.md only exists when 'overview' is one of the formats
            if [ -f "out/$slug/overview.md" ]; then sed -n '1,40p' "out/$slug/overview.md"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: graph-${{ steps.build.outputs.slug }}
          path: out/${{ steps.build.outputs.slug }}
          retention-days: 30

      - name: Attach graph to a release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          R2G_REPO: ${{ inputs.repo }}
          R2G_SLUG: ${{ steps.build.outputs.slug }}
        run: |
          set -euo pipefail
          slug="$R2G_SLUG"
          tag="graph-$slug-$(date -u +%Y%m%d%H%M%S)"
          (cd out && zip -qr "$slug.zip" "$slug")
          notes=(--notes "Graph artifacts for $R2G_REPO")
          if [ -f "out/$slug/overview.md" ]; then notes=(--notes-file "out/$slug/overview.md"); fi
          gh release create "$tag" "out/$slug.zip" \
            --title "Graph: $R2G_REPO" "${notes[@]}"
