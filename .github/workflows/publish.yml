name: Publish

# Unified Release Pipeline:
# 1. prepare-release: Bumps version across all files, commits, tags, and validates consistency.
# 2. publish: Tests and publishes to PyPI via OIDC, waits for CDN, then publishes to the MCP Registry.
# 3. release: Creates GitHub Release from CHANGELOG.md and advances the floating major tag (e.g. v1).
#
# workflow_dispatch only, deliberately. prepare-release's own tag push and the
# release job's `gh release create` each used to match this same workflow's
# `push: tags:` / `release: types: [published]` triggers, so every successful
# release re-triggered itself two more times for the same tag. The pypi job
# tolerated the duplicate (skip-existing); mcp-registry does not
# ("cannot publish duplicate version", a hard failure) -- and every extra run
# is pure wasted CI time regardless. One trigger, run by a human, is correct:
# this pipeline already does the tag push and the release creation itself in
# the same run, so there is no separate "release already tagged, now publish"
# case to support.
#
# The release branch is an explicit input, defaulting to `main`, and every
# stage reads it rather than assuming the dispatch ref. That matters because
# workflow_dispatch runs against whatever ref the operator picked in the UI:
# before this input existed, dispatching from `develop` bumped *develop's*
# content but opened the release PR against a hardcoded `main` base, so the
# tag and the published artifact could disagree about what was in them.
# Checking out `inputs.branch` explicitly removes that mismatch -- the branch
# named here is the one that is bumped, merged, tagged and published, whatever
# ref the run was launched from.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: >-
          Branch to release from. The version bump is committed against this
          branch, merged into it, and the tag is cut from the merge commit.
          Leave as `main` unless you are deliberately publishing from elsewhere.
        required: false
        default: main
        type: string

concurrency:
  # One release at a time, and NEVER cancelled. Concurrency groups are already
  # scoped to the repository, so a constant group name serialises every run of
  # this workflow -- deliberately not keyed on the branch input, because two
  # dispatches for two different branches are exactly the collision to prevent:
  # each runs bump_version.py, then they race on the tag push and on the PyPI
  # upload. Queueing the second is correct; cancelling a release part-way
  # through an upload is not.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: prepare-release
  # --------------------------------------------------------------------------
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Generate prod-igy token
        id: app-token
        if: ${{ env.HAS_APP_ID != '' && env.HAS_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.PRODIGY_APP_ID }}
          private-key: ${{ secrets.PRODIGY_PRIVATE_KEY }}
        env:
          HAS_APP_ID: ${{ secrets.PRODIGY_APP_ID }}
          HAS_PRIVATE_KEY: ${{ secrets.PRODIGY_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The release branch, not the dispatch ref: see the header comment.
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv and tooling
        run: pip install uv

      # Fail before anything is bumped, committed or tagged.
      #
      # A branch that does not exist is already caught by the checkout above,
      # which is why that is not the case worth guarding. An *empty* input is:
      # `required: false` lets the operator clear the field, `ref: ''` makes
      # actions/checkout silently fall back to the dispatch ref, and the run
      # would then release whatever branch it happened to be launched from
      # while every later step interpolated an empty "$RELEASE_BASE".
      - name: Check the release branch is usable
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RELEASE_BASE: ${{ inputs.branch }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_BASE" ]; then
            echo "::error::branch input is empty"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/remotes/origin/$RELEASE_BASE" >/dev/null; then
            echo "::error::no such branch on origin: $RELEASE_BASE"
            exit 1
          fi
          if [ "$RELEASE_BASE" != "$DISPATCH_REF" ]; then
            # Not fatal: Actions always loads the workflow *file* from the
            # dispatch ref, so running a fixed publish.yml from one branch
            # against another is legitimate. It is worth saying out loud.
            echo "::warning::workflow file came from '$DISPATCH_REF' but releasing '$RELEASE_BASE'"
          fi
          echo "Releasing from branch: $RELEASE_BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release version and tag
        id: prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_ID: ${{ secrets.PRODIGY_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          # Routed through env:, never interpolated into the shell body --
          # the `${{ inputs.X }}`-straight-into-`run:` pattern issue #108
          # closed on examples.yml.
          RELEASE_BASE: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          echo "Scanning changes and determining version bump automatically..."
          python scripts/bump_version.py auto
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          branch="release/v$version"

          bot_name="${APP_SLUG:-prod-igy}[bot]"
          if [ -n "${APP_ID:-}" ]; then
            bot_email="${APP_ID}+${bot_name}@users.noreply.github.com"
          else
            bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git config user.name "$bot_name"
          git config user.email "$bot_email"

          # Create the release commit via the GitHub API instead of `git commit` +
          # push: a runner-made commit is never marked Verified even when pushed
          # with an authenticated App token, and the release branch requires
          # signed commits. An unsigned bump commit here blocks every auto-merge
          # attempt below until someone with branch-protection bypass merges it
          # by hand.
          commit_sha=$(python scripts/commit_release_via_api.py \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$branch" \
            --base "$RELEASE_BASE" \
            --message "chore(release): bump version to $version" \
            --files pyproject.toml server.json repo2graph/__init__.py CHANGELOG.md uv.lock)
          echo "Created verified commit $commit_sha on $branch"

          # bump_version.py's edits are already captured in the commit created
          # above via the API; discard them from the local worktree so the
          # `git pull origin "$RELEASE_BASE"` after merge below (which re-fetches
          # the bumped content properly, via the merge) doesn't fail with "local
          # changes would be overwritten".
          git checkout -- pyproject.toml server.json repo2graph/__init__.py CHANGELOG.md uv.lock

          # Create PR if not already existing
          pr_url=$(gh pr list --head "$branch" --base "$RELEASE_BASE" --json url -q '.[0].url' || true)
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create \
              --title "chore(release): bump version to $version" \
              --body "Automated release PR for version **$version**." \
              --head "$branch" \
              --base "$RELEASE_BASE")
            echo "Created Release PR: $pr_url"
          else
            echo "Existing Release PR found: $pr_url"
          fi

          # Try to enable auto-merge if repo settings permit
          gh pr merge "$pr_url" --auto --squash || true

          # Wait and check mergeability up to 30 times with 120s delay (60 mins max)
          echo "Waiting and checking mergeability for $pr_url (up to 30 attempts with 120s delay)..."
          merged=false
          for attempt in $(seq 1 30); do
            echo "=== Attempt $attempt of 30: Checking PR status ==="
            pr_info=$(gh pr view "$pr_url" --json state,mergeable,mergeStateStatus)
            pr_state=$(echo "$pr_info" | jq -r .state)
            mergeable=$(echo "$pr_info" | jq -r .mergeable)
            status=$(echo "$pr_info" | jq -r .mergeStateStatus)
            echo "PR state: $pr_state, mergeable: $mergeable, mergeStateStatus: $status"

            if [ "$pr_state" = "MERGED" ]; then
              echo "PR $pr_url is merged!"
              merged=true
              break
            fi

            if [ "$status" = "CLEAN" ] || [ "$status" = "HAS_HOOKS" ]; then
              echo "Checks passed and branch is clean. Merging PR..."
              if gh pr merge "$pr_url" --squash --delete-branch; then
                echo "Successfully merged $pr_url!"
                merged=true
                break
              fi
            fi

            if [ "$attempt" -lt 30 ]; then
              echo "Checks not ready yet (status: $status). Waiting 120 seconds..."
              sleep 120
            fi
          done

          if [ "$merged" != "true" ]; then
            echo "::error::PR $pr_url could not be merged after 30 attempts (60 minutes)."
            exit 1
          fi

          # Fetch the merged, signed commit from the release branch and tag it
          git fetch origin "$RELEASE_BASE"
          git checkout "$RELEASE_BASE"
          git pull origin "$RELEASE_BASE"

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag -a "$tag" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi

          # Assert version consistency across pyproject.toml, server.json, and repo2graph/__init__.py
          python scripts/check_version.py

          # Verify server.json carries ownership marker in README.md
          name=$(python -c "import json;print(json.load(open('server.json'))['name'])")
          if ! grep -qF "mcp-name: $name" README.md; then
            echo "::error::README.md is missing the line 'mcp-name: $name'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Stage 2: publish (PyPI + MCP Registry)
  # --------------------------------------------------------------------------
  pypi:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/repo2graph
    permissions:
      id-token: write        # mints short-lived Trusted Publishing token
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The locked dependency graph, for the same reason ci.yml switched to it:
      # a bare `pip install -e ".[dev,mcp]"` resolves whatever PyPI serves at
      # the moment of the run, so this gate could fail on an upstream release
      # nobody reviewed -- and failing *here* aborts a release that is already
      # tagged and has an open, merged bump commit behind it. That is a worse
      # place to discover upstream drift than a PR run, and `drift` in ci.yml
      # is the job that exists to discover it. uv is version-pinned like every
      # other tool in this file; --locked fails rather than re-resolving if
      # uv.lock has drifted from pyproject.toml; --require-hashes makes pip
      # verify each download against the lockfile.
      #
      # The export lands in RUNNER_TEMP, not the checkout: `python -m build`
      # runs against this same tree a step later, and a stray file in it is a
      # file that can end up inside the sdist.
      - name: Install the locked dependency set
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "uv==0.12.15"
          uv export --locked --no-emit-project --extra dev --extra mcp \
            -o "$RUNNER_TEMP/requirements-publish.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/requirements-publish.txt"
          python -m pip install -e . --no-deps

      - name: Run test suite before building
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata PyPI will render
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        # skip-existing: this workflow's own `release` job publishes a GitHub
        # Release for the tag, which matches this workflow's `release:
        # types: [published]` trigger and re-runs the whole pipeline for a tag
        # already published a few minutes earlier. Without this, the re-run's
        # upload always 400s ("File already exists") since PyPI rejects
        # re-uploading identical filenames -- same idempotency idiom this file
        # already uses for the release PR and the tag (see "Create PR if not
        # already existing" and the `git rev-parse -q --verify refs/tags/...`
        # check above).
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true
          attestations: true

  mcp-registry:
    needs: [prepare-release, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write        # mcp-publisher login github-oidc needs this
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Wait for PyPI to serve the new version
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/repo2graph/$VERSION/json" > /dev/null; then
              echo "repo2graph $VERSION is live on PyPI"
              exit 0
            fi
            echo "attempt $attempt: not visible yet, waiting 10s"
            sleep 10
          done
          echo "::error::repo2graph $VERSION never appeared on PyPI"
          exit 1

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

  # --------------------------------------------------------------------------
  # Stage 3: release (GitHub Release + Floating Major Tag)
  # --------------------------------------------------------------------------
  release:
    needs: [prepare-release, pypi, mcp-registry]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Generate prod-igy token
        id: app-token
        if: ${{ env.HAS_APP_ID != '' && env.HAS_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.PRODIGY_APP_ID }}
          private-key: ${{ secrets.PRODIGY_PRIVATE_KEY }}
        env:
          HAS_APP_ID: ${{ secrets.PRODIGY_APP_ID }}
          HAS_PRIVATE_KEY: ${{ secrets.PRODIGY_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Extract this version's CHANGELOG section
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY' > release-notes.md
          import os, re, sys, pathlib
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf8")
          pattern = re.compile(
              r"^## \[?" + re.escape(version) + r"\]?.*?$(.*?)(?=^## |\Z)",
              re.M | re.S)
          match = pattern.search(text)
          if not match or not match.group(1).strip():
              print(f"::error::CHANGELOG.md has no section for {version}",
                    file=sys.stderr)
              raise SystemExit(1)
          print(match.group(1).strip())
          PY
          test -s release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes..."
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      - name: Advance floating major tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_ID: ${{ secrets.PRODIGY_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"
          bot_name="${APP_SLUG:-prod-igy}[bot]"
          if [ -n "${APP_ID:-}" ]; then
            bot_email="${APP_ID}+${bot_name}@users.noreply.github.com"
          else
            bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git config user.name "$bot_name"
          git config user.email "$bot_email"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
          echo "Advanced floating tag $major to $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Release summary
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_BASE: ${{ inputs.branch }}
        run: |
          {
            echo "### Published and Released repo2graph $VERSION"
            echo
            echo "- **Released from branch**: \`$RELEASE_BASE\`"
            echo "- **PyPI**: https://pypi.org/project/repo2graph/$VERSION/"
            echo "- **MCP Registry**: \`io.github.Srinivasan-78/repo2graph\`"
            echo "- **GitHub Release**: https://github.com/Srinivasan-78/repo2graph/releases/tag/v$VERSION"
            echo
            echo '```bash'
            echo "uvx --from 'repo2graph[mcp]' repo2graph-mcp /path/to/project"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
