name: repo2graph
description: Build a browsable code graph and cited, budget-bounded context for your repo — in CI, no LLM call
author: Srinivasan-78

branding:
  icon: share-2
  color: purple

inputs:
  repo:
    description: "Target repo (owner/repo or URL). Leave blank to index `path` in the workspace. Note: cross-repo indexing stores the target repository's graph and chunk excerpts in the caller's workflow artifacts."
    required: false
    default: ""
  path:
    description: "Local path to index when `repo` is blank"
    required: false
    default: "."
  ref:
    description: "Branch or tag to index when cloning a remote repo"
    required: false
    default: ""
  out:
    description: "Output directory for the graph artifacts"
    required: false
    default: ".r2g"
  formats:
    description: "Comma list: jsonl,graphml,cypher,overview,html"
    required: false
    default: "jsonl,graphml,cypher,overview,html"
  git-history:
    description: "Commits to scan for CO_CHANGE edges (0 = skip)"
    required: false
    default: "0"
  include:
    description: "Space-separated globs to include"
    required: false
    default: ""
  exclude:
    description: "Space-separated globs to exclude"
    required: false
    default: ""
  query:
    description: "Question to pack a cited GraphRAG context for (blank = skip). No LLM call is ever made."
    required: false
    default: ""
  query-k:
    description: "Lexical seed chunks for `query`"
    required: false
    default: "8"
  query-hops:
    description: "Graph expansion hops for `query`"
    required: false
    default: "1"
  query-budget:
    description: "Character budget for the whole pack (map and cite headers included)"
    required: false
    default: "24000"
  query-budget-tokens:
    description: "Token budget for the whole pack; replaces `query-budget` when set (blank = use query-budget)"
    required: false
    default: ""
  query-min-conf:
    description: "Drop CALLS edges below this confidence (0.0-1.0)"
    required: false
    default: "1.0"
  query-format:
    description: "Pack format: markdown or json"
    required: false
    default: "markdown"
  query-out:
    description: "File to write the pack to (blank = <out>/agent/pack.md or pack.json)"
    required: false
    default: ""
  embed:
    description: "Set to true to embed the chunks for dense retrieval (installs the `rag` extra)"
    required: false
    default: "false"
  embed-model:
    description: "sentence-transformers model for `embed` (blank = the built-in default)"
    required: false
    default: ""
  artifact-name:
    description: "Upload the output under this artifact name (blank = no upload)"
    required: false
    default: "repo-graph"
  commit-branch:
    description: "Push the output to this orphan branch (blank = no push)"
    required: false
    default: ""
  commit-force:
    description: "Whether to force-push when pushing to `commit-branch` (true or false, default: false). Force-push is only permitted for dedicated graph branches (branch names containing 'graph')."
    required: false
    default: "false"
  version:
    description: "pip spec to install repo2graph from (blank = install the action checkout itself)"
    required: false
    default: ""
  token:
    description: "Token used to clone a private target repo. Note: cross-repo indexing stores the target repository's graph and chunk excerpts in the caller's workflow artifacts."
    required: false
    default: ""
  include-secrets:
    description: "Set to true to index secret/credential files (default: false)"
    required: false
    default: "false"
  secret-policy:
    description: "Policy for inline content secrets: redact-match, exclude-file, warn-only, off (default: redact-match)"
    required: false
    default: "redact-match"
  incremental:
    description: "Enable incremental graph builds using the parse cache (default: false)"
    required: false
    default: "false"
  parse-policy:
    # `best-effort`, not `lenient`: these are passed straight to
    # `repo2graph build --parse-policy`, whose argparse `choices` are
    # (best-effort, warn, strict). `lenient` was never one of them -- it only
    # looked harmless because the step below drops the value when it equals the
    # default, so the documented default was the one value that never reached
    # the CLI. Any correction to that guard would have started forwarding it.
    description: "Policy for AST parse errors: best-effort, warn, strict (default: best-effort)"
    required: false
    default: "best-effort"
  max-call-candidates:
    description: "Maximum call edge candidates to retain per ambiguous call site (default: 5)"
    required: false
    default: "5"
  max-chunks:
    description: "Maximum chunks to build (0 = no limit)"
    required: false
    default: ""
  max-nodes:
    description: "Maximum graph nodes to retain (0 = no limit)"
    required: false
    default: ""
  max-total-bytes:
    description: "Maximum total source bytes to index (0 = no limit)"
    required: false
    default: ""
  max-build-seconds:
    description: "Maximum build duration in seconds before limit policy triggers (0 = no limit)"
    required: false
    default: ""
  limit-policy:
    description: "Policy when graph limits are reached: fail, truncate, warn (default: fail)"
    required: false
    default: "fail"
  secret-keywords:
    description: "Additional keywords to exclude as secret file/path (space- or newline-separated)"
    required: false
    default: ""
  secret-dirs:
    description: "Additional directory names to exclude as secret path (space- or newline-separated)"
    required: false
    default: ""
  smoke-check:
    description: "Fail build if discovery is not 'git' or symbol count is 0 (default: true)"
    required: false
    default: "true"

outputs:
  out:
    description: "Directory holding human/ (overview.md, graph.html, ...) and agent/ (chunks.jsonl, ...)"
    value: ${{ inputs.out }}
  nodes:
    description: "Node count"
    value: ${{ steps.build.outputs.nodes }}
  edges:
    description: "Edge count"
    value: ${{ steps.build.outputs.edges }}
  chunks:
    description: "Chunk count"
    value: ${{ steps.build.outputs.chunks }}
  pack-file:
    description: "Path to the GraphRAG pack written for `query` (empty when `query` is blank)"
    value: ${{ steps.rag.outputs.pack-file }}
  pack-chars:
    description: "Character length of the GraphRAG pack (0 when `query` is blank)"
    value: ${{ steps.rag.outputs.pack-chars }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.12"

    - name: Install repo2graph
      shell: bash
      # The `version` input decides where the package comes from, and nothing
      # else does. This used to gate on `[ -f "$GITHUB_ACTION_PATH/pyproject.toml" ]`,
      # but for a composite action $GITHUB_ACTION_PATH *is* the checked-out
      # action repository and pyproject.toml sits beside this file at its root
      # -- so that test was true on every run, the else branch was unreachable
      # and `version` never reached pip (#204). Gating on the input instead
      # also puts a consumer who pins a release onto the signed PyPI artifact
      # that publish.yml produces, which `pip install -e <checkout>` bypassed.
      #
      # Non-emptiness is the one test GitHub expressions and bash agree on for
      # every casing (CONTRIBUTING.md), so this needs no `inputs.version ==` gate and
      # no case-folding. The default is blank on purpose: a workflow that never
      # sets `version` installs the checkout it is pinned to, exactly as every
      # run did before, so nothing that works today changes.
      #
      # To prevent contaminating the runner's global Python environment or
      # shared toolcache (SC10), repo2graph is installed into an isolated
      # virtual environment in $RUNNER_TEMP and prepended to $GITHUB_PATH.
      env:
        R2G_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VENV_DIR="${RUNNER_TEMP:-/tmp}/r2g-venv"
        test -d "$VENV_DIR" || python3 -m venv "$VENV_DIR" 2>/dev/null || python -m venv "$VENV_DIR" 2>/dev/null || true
        test -d "$VENV_DIR/bin" && VENV_BIN="$VENV_DIR/bin" || VENV_BIN="${VENV_DIR}/Scripts"
        test -d "$VENV_BIN" && test -n "${GITHUB_PATH:-}" && echo "$VENV_BIN" >> "$GITHUB_PATH" || true
        test -d "$VENV_BIN" && export PATH="$VENV_BIN:$PATH" || true
        if [ -n "$R2G_VERSION" ]; then
          pip install -q "$R2G_VERSION"
        elif [ -f "$GITHUB_ACTION_PATH/pyproject.toml" ]; then
          pip install -q -e "$GITHUB_ACTION_PATH"
        else
          echo "repo2graph: no pyproject.toml in \$GITHUB_ACTION_PATH and no \`version\`" >&2
          echo "input set -- pass e.g. version: repo2graph==<x.y.z> to install from PyPI." >&2
          exit 1
        fi

    - name: Build the graph
      id: build
      shell: bash
      # Inputs go through the environment, never straight into the script:
      # ${{ }} is substituted before bash sees it, so an input containing shell
      # metacharacters would otherwise execute.
      env:
        GH_TOKEN: ${{ inputs.token }}
        R2G_REPO: ${{ inputs.repo }}
        R2G_PATH: ${{ inputs.path }}
        R2G_REF: ${{ inputs.ref }}
        R2G_OUT: ${{ inputs.out }}
        R2G_FORMATS: ${{ inputs.formats }}
        R2G_HISTORY: ${{ inputs.git-history }}
        R2G_INCLUDE: ${{ inputs.include }}
        R2G_EXCLUDE: ${{ inputs.exclude }}
        R2G_INCLUDE_SECRETS: ${{ inputs.include-secrets }}
        R2G_SECRET_POLICY: ${{ inputs.secret-policy }}
        R2G_INCREMENTAL: ${{ inputs.incremental }}
        R2G_PARSE_POLICY: ${{ inputs.parse-policy }}
        R2G_MAX_CALL_CANDIDATES: ${{ inputs.max-call-candidates }}
        R2G_MAX_CHUNKS: ${{ inputs.max-chunks }}
        R2G_MAX_NODES: ${{ inputs.max-nodes }}
        R2G_MAX_TOTAL_BYTES: ${{ inputs.max-total-bytes }}
        R2G_MAX_BUILD_SECONDS: ${{ inputs.max-build-seconds }}
        R2G_LIMIT_POLICY: ${{ inputs.limit-policy }}
        R2G_SECRET_KEYWORDS: ${{ inputs.secret-keywords }}
        R2G_SECRET_DIRS: ${{ inputs.secret-dirs }}
        R2G_SMOKE_CHECK: ${{ inputs.smoke-check }}
        SUMMARY_FILE: ${{ runner.temp }}/summary.json
      run: |
        set -euo pipefail
        args=()
        if [ -n "$R2G_REPO" ]; then
          args=(github "$R2G_REPO")
          if [ -n "$R2G_REF" ]; then args+=(--ref "$R2G_REF"); fi
        else
          args=(build "$R2G_PATH")
        fi
        args+=(-o "$R2G_OUT" --formats "$R2G_FORMATS" --git-history "$R2G_HISTORY")
        inc_sec="$(printf '%s' "$R2G_INCLUDE_SECRETS" | tr '[:upper:]' '[:lower:]')"
        if [ "$inc_sec" = "true" ]; then
          args+=(--include-secrets)
        fi
        inc_mode="$(printf '%s' "${R2G_INCREMENTAL:-false}" | tr '[:upper:]' '[:lower:]')"
        if [ "$inc_mode" = "true" ]; then
          args+=(--incremental)
        fi
        if [ -n "${R2G_PARSE_POLICY:-}" ] && [ "$R2G_PARSE_POLICY" != "best-effort" ]; then
          args+=(--parse-policy "$R2G_PARSE_POLICY")
        fi
        if [ -n "${R2G_MAX_CALL_CANDIDATES:-}" ] && [ "$R2G_MAX_CALL_CANDIDATES" != "5" ]; then
          args+=(--max-call-candidates "$R2G_MAX_CALL_CANDIDATES")
        fi
        if [ -n "$R2G_SECRET_POLICY" ] && [ "$R2G_SECRET_POLICY" != "redact-match" ]; then
          args+=(--secret-policy "$R2G_SECRET_POLICY")
        fi
        if [ -n "${R2G_MAX_CHUNKS:-}" ]; then
          args+=(--max-chunks "$R2G_MAX_CHUNKS")
        fi
        if [ -n "${R2G_MAX_NODES:-}" ]; then
          args+=(--max-nodes "$R2G_MAX_NODES")
        fi
        if [ -n "${R2G_MAX_TOTAL_BYTES:-}" ]; then
          args+=(--max-total-bytes "$R2G_MAX_TOTAL_BYTES")
        fi
        if [ -n "${R2G_MAX_BUILD_SECONDS:-}" ]; then
          args+=(--max-build-seconds "$R2G_MAX_BUILD_SECONDS")
        fi
        if [ -n "${R2G_LIMIT_POLICY:-}" ] && [ "$R2G_LIMIT_POLICY" != "fail" ]; then
          args+=(--limit-policy "$R2G_LIMIT_POLICY")
        fi
        if [ -n "${R2G_SECRET_KEYWORDS:-}" ]; then
          IFS=$' \t\n' read -r -d '' -a skw <<< "$R2G_SECRET_KEYWORDS" || true
          for kw in "${skw[@]}"; do
            args+=(--secret-keyword "$kw")
          done
        fi
        if [ -n "${R2G_SECRET_DIRS:-}" ]; then
          IFS=$' \t\n' read -r -d '' -a sdir <<< "$R2G_SECRET_DIRS" || true
          for sd in "${sdir[@]}"; do
            args+=(--secret-dir "$sd")
          done
        fi
        # `read -a ... <<< "$VAR"` (no `-d`) reads only the FIRST line of a
        # multi-line input and silently drops the rest -- a multi-line
        # `exclude` then fails open, applying only its first entry. `-d ''`
        # makes `read` consume the whole here-string (it stops at EOF, not at
        # the first newline), while IFS still splits on spaces, tabs and
        # newlines, so every line and every space-separated entry on it is
        # captured without letting bash expand the globs itself.
        if [ -n "$R2G_INCLUDE" ]; then
          IFS=$' \t\n' read -r -d '' -a inc <<< "$R2G_INCLUDE" || true
          args+=(--include "${inc[@]}")
        fi
        if [ -n "$R2G_EXCLUDE" ]; then
          IFS=$' \t\n' read -r -d '' -a exc <<< "$R2G_EXCLUDE" || true
          args+=(--exclude "${exc[@]}")
        fi
        mkdir -p "$R2G_OUT"
        repo2graph "${args[@]}" > "$SUMMARY_FILE"
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os, sys
        d = json.load(open(os.environ["SUMMARY_FILE"]))
        s = d.get("stats", d)
        print(f"nodes={s.get('nodes', 0)}")
        print(f"edges={s.get('edges', 0)}")
        print(f"chunks={d.get('chunks', 0)}")
        smoke_flag = os.environ.get("R2G_SMOKE_CHECK", "true").strip().lower()
        stats_path = os.path.join(os.environ.get("R2G_OUT", ""), "agent", "stats.json")
        if smoke_flag == "true" and os.path.exists(stats_path):
            stats = json.load(open(stats_path))
            discovery = stats.get("discovery")
            symbols = sum(v for k, v in stats.items() if k.startswith("symbol:") and isinstance(v, int))
            if discovery != "git":
                print(f"::error::Smoke check failed: discovery mode was '{discovery}', expected 'git'", file=sys.stderr)
                sys.exit(1)
            if symbols <= 0:
                print(f"::error::Smoke check failed: index produced 0 symbols", file=sys.stderr)
                sys.exit(1)
        PY

    - name: Write job summary
      shell: bash
      # A small stdlib-only script, not inlined here, so it stays unit-testable
      # on its own (tests/test_summary_script.py runs it directly against mock
      # artifacts). It reads agent/{stats.json,nodes.jsonl,edges.jsonl} and the
      # optional human/CHANGELOG.md and prints Markdown to stdout; this step is
      # the only thing that redirects that output into $GITHUB_STEP_SUMMARY, so
      # the script itself never has to know it is running in CI.
      env:
        R2G_OUT: ${{ inputs.out }}
        R2G_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail
        python "$GITHUB_ACTION_PATH/.github/scripts/summary.py" \
          --stats "$R2G_OUT/agent/stats.json" \
          --nodes "$R2G_OUT/agent/nodes.jsonl" \
          --edges "$R2G_OUT/agent/edges.jsonl" \
          --changelog "$R2G_OUT/human/CHANGELOG.md" \
          --artifact-name "$R2G_ARTIFACT_NAME" \
          >> "$GITHUB_STEP_SUMMARY"

    - name: Embed the chunks
      if: ${{ inputs.embed == 'true' }}
      shell: bash
      # Same env-indirection rule as every other step. Off by default: the
      # model download is heavyweight and `build` must stay zero-dependency.
      env:
        R2G_OUT: ${{ inputs.out }}
        R2G_EMBED_MODEL: ${{ inputs.embed-model }}
      run: |
        set -euo pipefail
        pip install -q "sentence-transformers>=3.0" "numpy>=1.24"
        args=(embed -o "$R2G_OUT")
        # --embed-model, not --model: the LLM surface `rag --model` names must
        # never appear in this file (see the note on the rag step), and the
        # embed subcommand accepts both spellings for exactly this reason.
        if [ -n "$R2G_EMBED_MODEL" ]; then args+=(--embed-model "$R2G_EMBED_MODEL"); fi
        repo2graph "${args[@]}"

    - name: Pack a GraphRAG context
      id: rag
      if: ${{ inputs.query != '' }}
      shell: bash
      # Same rule as the build step: every input reaches bash through env:,
      # never through ${{ }} inside the script. There is deliberately no
      # --answer / --provider / --model input here: `rag --answer` POSTs
      # repository source to a third-party LLM endpoint, and this action never
      # makes a network call with your code.
      env:
        R2G_OUT: ${{ inputs.out }}
        R2G_QUERY: ${{ inputs.query }}
        R2G_K: ${{ inputs.query-k }}
        R2G_HOPS: ${{ inputs.query-hops }}
        R2G_BUDGET: ${{ inputs.query-budget }}
        R2G_BUDGET_TOKENS: ${{ inputs.query-budget-tokens }}
        R2G_MIN_CONF: ${{ inputs.query-min-conf }}
        R2G_FORMAT: ${{ inputs.query-format }}
        R2G_QUERY_OUT: ${{ inputs.query-out }}
        R2G_EMBED: ${{ inputs.embed }}
        R2G_EMBED_MODEL: ${{ inputs.embed-model }}
      run: |
        set -euo pipefail
        pack="$R2G_QUERY_OUT"
        if [ -z "$pack" ]; then
          if [ "$R2G_FORMAT" = "json" ]; then
            pack="$R2G_OUT/agent/pack.json"
          else
            pack="$R2G_OUT/agent/pack.md"
          fi
        fi
        mkdir -p "$(dirname "$pack")"
        args=(rag -o "$R2G_OUT" -k "$R2G_K" --hops "$R2G_HOPS"
              --budget "$R2G_BUDGET" --min-conf "$R2G_MIN_CONF"
              --format "$R2G_FORMAT")
        # Only when the input is non-empty, so an existing workflow that never
        # sets it keeps the character budget it has always had.
        if [ -n "$R2G_BUDGET_TOKENS" ]; then
          args+=(--budget-tokens "$R2G_BUDGET_TOKENS")
        fi
        # Dense fusion is opt-in on the CLI (it loads a model), so the pack only
        # uses the vectors when the embed step actually ran -- and with the same
        # checkpoint, or the index/query model guard would refuse and the run
        # would have paid for vectors it then ignored. --embed-model, never
        # --model: that spelling means `rag --answer`'s LLM, the one surface
        # this action does not expose.
        # Case-fold before comparing. The embed step above gates on the GitHub
        # expression `inputs.embed == 'true'`, and `==` there is
        # case-insensitive, so `embed: "True"` runs it; a case-sensitive test
        # here would then drop --vectors and emit a BM25-only pack from an index
        # the run just paid to embed.
        embed="$(printf '%s' "$R2G_EMBED" | tr '[:upper:]' '[:lower:]')"
        if [ "$embed" = "true" ]; then
          args+=(--vectors)
          if [ -n "$R2G_EMBED_MODEL" ]; then
            args+=(--embed-model "$R2G_EMBED_MODEL")
          fi
        fi
        # `--` ends the option list so a query starting with '-' is still a query
        repo2graph "${args[@]}" -- "$R2G_OUT" "$R2G_QUERY" > "$pack"
        PACK_FILE="$pack" python - <<'PY' >> "$GITHUB_OUTPUT"
        import os
        p = os.environ["PACK_FILE"]
        text = open(p, encoding="utf8", errors="replace").read()
        print(f"pack-file={p}")
        print(f"pack-chars={len(text)}")
        PY
        {
          echo "### repo2graph pack"
          echo
          # printf, not echo: a backtick in the query must not be substituted
          printf 'query: `%s`\n\n' "$R2G_QUERY"
          echo '```'
          head -c 8000 "$pack"
          echo
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        # local.json holds the runner's absolute checkout path: machine-local,
        # never shipped (.github/SECURITY.md).
        path: |
          ${{ inputs.out }}
          !${{ inputs.out }}/local.json
        retention-days: 30
        # `out` defaults to `.r2g`, a dot-directory, and upload-artifact has
        # excluded hidden files by default since v4. Without this the upload
        # silently matched nothing: the step still succeeded, the job stayed
        # green, and the only symptom was an empty artifact nobody checked.
        include-hidden-files: true

    - name: Push graph to branch
      if: ${{ inputs.commit-branch != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        R2G_OUT: ${{ inputs.out }}
        R2G_BRANCH: ${{ inputs.commit-branch }}
        R2G_COMMIT_FORCE: ${{ inputs.commit-force }}
        EVENT_NAME: ${{ github.event_name }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if [ "${IS_FORK:-}" = "true" ]; then
          echo "::error::Refusing to push graph to branch from a fork pull request. Use artifact-name instead or run on push events."
          exit 1
        fi
        if [ "${EVENT_NAME:-}" = "pull_request" ] || [ "${EVENT_NAME:-}" = "pull_request_target" ]; then
          echo "::warning::Pushing graph to branch during ${EVENT_NAME} events may expose tokens or overwrite branches unintentionally. Recommended: run on push to default branch."
        fi
        # Refuse any branch that looks like it carries real work, not a
        # dedicated disposable graph branch: the repository's default branch,
        # or the conventional main/master/trunk names some repos use without
        # making one of them the configured default.
        case "$R2G_BRANCH" in
          main|master|trunk|"${DEFAULT_BRANCH:-__none__}")
            echo "::error::commit-branch ('$R2G_BRANCH') looks like a protected/default branch carrying real work. Use a dedicated, disposable branch for the graph output."
            exit 1
            ;;
        esac
        tmp="$(mktemp -d)"
        cp -r "$R2G_OUT/." "$tmp/"
        # Machine-local build facts (the runner's absolute path) never ship.
        rm -f "$tmp/local.json"
        cd "$tmp"
        git init -q
        git checkout -q -b "$R2G_BRANCH"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -qm "graph for ${GITHUB_SHA:0:12}"
        # GITHUB_SERVER_URL/GITHUB_API_URL (set by the runner for every job,
        # including GHES) rather than a hardcoded github.com -- otherwise an
        # enterprise token leaves the GHES instance and is sent to github.com.
        server_url="${GITHUB_SERVER_URL:-https://github.com}"
        git remote add origin "${server_url}/${GITHUB_REPOSITORY}.git"
        # Credential goes through a config value, never CLI argv or a URL: argv is
        # readable via `ps`/`/proc/$PID/cmdline` by any process on the host.
        git config --local "http.${server_url}/.extraheader" \
          "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
        force_flag="$(printf '%s' "${R2G_COMMIT_FORCE:-false}" | tr '[:upper:]' '[:lower:]')"
        if [ "$force_flag" = "true" ]; then
          case "$R2G_BRANCH" in
            *graph*)
              ;;
            *)
              echo "::error::commit-force is true but commit-branch ('$R2G_BRANCH') is not a dedicated graph branch. Force-push is only permitted to branches containing 'graph' to prevent overwriting working branches."
              exit 1
              ;;
          esac
          git push -q --force origin "$R2G_BRANCH"
        else
          git push -q origin "$R2G_BRANCH"
        fi
