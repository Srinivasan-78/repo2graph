[project]
name = "repo2graph"
version = "1.5.4"
description = "Turn any repository into a code graph + graph-aware RAG chunks"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Srinivasan Vijayaraghavan", email = "srinivasan.shyam2000@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "code-graph", "graphrag", "rag",
            "tree-sitter", "static-analysis", "codebase-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.urls]
Homepage = "https://github.com/Srinivasan-78/repo2graph"
Repository = "https://github.com/Srinivasan-78/repo2graph"
Issues = "https://github.com/Srinivasan-78/repo2graph/issues"
"MCP server" = "https://github.com/Srinivasan-78/repo2graph/blob/main/docs/mcp.md"

[project.scripts]
repo2graph = "repo2graph.cli:main"
repo2graph-mcp = "repo2graph.mcp:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo2graph*"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.11", "pre-commit>=3.5"]
# Strictly optional: the GraphRAG layer falls back to BM25 + the identifier
# boost with zero extra dependencies when these are not installed.
rag = ["sentence-transformers>=3.0", "numpy>=1.24"]
# Only `repo2graph-mcp` needs this; the CLI and the Action never import it.
# Bounded below 3 on purpose: `serve()` prefers the 1.x decorator API
# (`@server.list_tools()` / `@server.call_tool()`) and falls back to the 2.x
# constructor hooks (`on_list_tools` / `on_call_tool`) when those methods
# are gone. 3.x is untested. A remaining native 2.x registration-API port
# is in docs/BACKLOG.md ("Port the MCP server to the 2.x SDK API").
mcp = ["mcp>=1.0,<3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E702", "E731", "E741"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# Legacy modules are not annotated yet. They are listed explicitly rather than
# excluded by a wildcard so that a *new* module is strict-checked by default and
# has to be added here deliberately to escape it -- the opposite of an allowlist,
# which would silently let new untyped code in. 223 errors remain across these
# ten; see DONE.md for the ranked plan.
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "repo2graph.answer", "repo2graph.chunks", "repo2graph.cli",
    "repo2graph.embed", "repo2graph.export", "repo2graph.fetch",
    "repo2graph.graph", "repo2graph.mcp", "repo2graph.parse",
    "repo2graph.query", "repo2graph.viz", "repo2graph.langs",
    "repo2graph.layout", "repo2graph.walker",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
# These modules call into each other, so an un-annotated return in one shows up
# as "returning Any" in the next. It disappears as the sweep progresses; until
# then it reports the same debt twice.
warn_return_any = false
