[project]
name = "repo2graph"
version = "2.0.0"
description = "Give coding agents cited, budget-bounded answers about any codebase — code graph + MCP server"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Srinivasan Vijayaraghavan", email = "srinivasan.shyam2000@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "code-graph", "graphrag", "rag",
            "tree-sitter", "static-analysis", "codebase-search", "coding-agent",
            "claude-code", "cursor", "code-navigation", "code-understanding",
            "onboarding", "impact-analysis", "citations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.urls]
Homepage = "https://github.com/Srinivasan-78/repo2graph"
Repository = "https://github.com/Srinivasan-78/repo2graph"
Issues = "https://github.com/Srinivasan-78/repo2graph/issues"
"MCP server" = "https://github.com/Srinivasan-78/repo2graph/blob/main/docs/mcp.md"
"Quality Score" = "https://glama.ai/mcp/servers/Srinivasan-78/repo2graph"

[project.scripts]
repo2graph = "repo2graph.cli:main"
repo2graph-mcp = "repo2graph.mcp:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo2graph*"]

[project.optional-dependencies]
# pyyaml: tests/test_doc_consistency.py parses action.yml directly. It was
# only ever present transitively (via pre-commit), so a clean `pip install
# -e ".[dev]"` without pre-commit's own deps resolved had no yaml module.
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "mypy>=1.11", "pre-commit>=3.5", "pyyaml>=6.0"]
# Strictly optional: the GraphRAG layer falls back to BM25 + the identifier
# boost with zero extra dependencies when these are not installed.
rag = ["sentence-transformers>=3.0", "numpy>=1.24"]
# Only `repo2graph-mcp` needs this; the CLI and the Action never import it.
# Both SDK generations are supported: `serve()` branches on
# `hasattr(Server, "list_tools")` and drives the 1.x decorator API or the 2.x
# registration API accordingly, so 2.x no longer crashes the server on start.
# The bound is `<3.0` -- an unreleased 3.x is the thing that has not been
# tested, not 2.x. Keep this in sync with `SDK_SPEC` in repo2graph/mcp.py.
mcp = ["mcp>=1.0,<3.0"]
# Shell tab completion via argcomplete
completion = ["argcomplete>=3.0"]


[tool.pytest.ini_options]
testpaths = ["tests"]

# branch=True is the point of measuring at all here: statement coverage counts
# an `if` as covered when only the taken side ever ran, which is exactly the
# question the suite could not answer about auth.py's refusal paths.
[tool.coverage.run]
source = ["repo2graph"]
branch = true
# Worker processes (build() above PARALLEL_MIN_FILES) need this or their
# coverage is dropped on exit and the parallel path reads as dead code.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# A floor, not a target. Measured at 86% (branch) across the 9-cell CI matrix,
# so this leaves room for the legitimate variance -- the `rag` extra is not
# installed in CI, and its tests skip -- while still failing a run that deletes
# or strands a meaningful body of tested code. Raise it when the floor is
# comfortably cleared; do not raise it to whatever today's number happens to be.
fail_under = 80
exclude_also = [
    # Import-time fallbacks for optional extras. The `rag`/`mcp` branch that
    # does not match the installed environment can never run in that run.
    "except ImportError:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E702", "E731", "E741"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# Legacy modules are not annotated yet. They are listed explicitly rather than
# excluded by a wildcard so that a *new* module is strict-checked by default and
# has to be added here deliberately to escape it -- the opposite of an allowlist,
# which would silently let new untyped code in.
#
# This list is the single source of truth for the strict scope: the Makefile
# target and the pre-commit hook both check the whole package and defer to it,
# so removing a module here is the one edit that tightens the check everywhere.
#
# 179 errors remain, concentrated in mcp (40), graph (39), parse (27) and
# cli (23). query.py and export.py are done -- they were taken first because
# everything else imports them, so their `Any` returns were what made callers
# unprovable. See DONE.md for the ranked plan.
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "repo2graph.answer", "repo2graph.chunks", "repo2graph.cli",
    "repo2graph.embed", "repo2graph.fetch",
    "repo2graph.graph", "repo2graph.mcp", "repo2graph.parse",
    "repo2graph.viz", "repo2graph.langs",
    "repo2graph.layout", "repo2graph.walker",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
# These modules call into each other, so an un-annotated return in one shows up
# as "returning Any" in the next. It disappears as the sweep progresses; until
# then it reports the same debt twice.
warn_return_any = false
