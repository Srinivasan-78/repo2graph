[project]
name = "repo2graph"
version = "1.3.0"
description = "Turn any repository into a code graph + graph-aware RAG chunks"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.scripts]
repo2graph = "repo2graph.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo2graph*"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
# Strictly optional: the GraphRAG layer falls back to BM25 + the identifier
# boost with zero extra dependencies when these are not installed.
rag = ["sentence-transformers>=3.0", "numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E702", "E731", "E741"]
