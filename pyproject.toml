[project]
name = "repo2graph"
version = "4.1.0"
description = "Give coding agents cited, budget-bounded answers about any codebase — code graph + MCP server"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Srinivasan Vijayaraghavan", email = "srinivasan.shyam2000@gmail.com"}]
keywords = ["mcp", "model-context-protocol", "code-graph", "graphrag", "rag",
            "tree-sitter", "static-analysis", "codebase-search", "coding-agent",
            "claude-code", "cursor", "code-navigation", "code-understanding",
            "onboarding", "citations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "tree-sitter>=0.23",
    # Capped below 1.0 deliberately, and this is a security boundary rather than a
    # compatibility one. 0.x ships every grammar compiled into the wheel (0.13.0 is
    # a 33 MB wheel); 1.x ships a 2.5 MB wheel and a 89 KB sdist and fetches the
    # grammars -- roughly 21 MB of unsigned native code -- from the network on first
    # `get_parser()`, into the process that is holding the user's source and, in CI,
    # their tokens.
    #
    # That breaks three things this project promises. The README and
    # .github/SECURITY.md both state that building, querying and the MCP server make
    # no network calls, with `rag --answer` and `github` named as the only
    # exceptions. `uv.lock` and the SBOM stop describing what actually executes,
    # because the hashed artefact is a loader rather than the grammars. And the
    # documented read-only container and egress-restricted CI simply cannot work.
    #
    # 1.x exposes no offline switch: `PackConfig` carries only `cache_dir`,
    # `languages` and `groups`, all of which are pre-*download* controls, so there is
    # no configuration that makes 1.x satisfy the no-network claim. Raising this cap
    # therefore means either dropping the claim or vendoring grammars first.
    "tree-sitter-language-pack>=0.7,<1.0",
]

[project.urls]
Homepage = "https://github.com/Srinivasan-78/repo2graph"
Repository = "https://github.com/Srinivasan-78/repo2graph"
Issues = "https://github.com/Srinivasan-78/repo2graph/issues"
"MCP server" = "https://github.com/Srinivasan-78/repo2graph/blob/main/docs/mcp.md"
"Quality Score" = "https://glama.ai/mcp/servers/Srinivasan-78/repo2graph"

[project.scripts]
repo2graph = "repo2graph.cli:main"
repo2graph-mcp = "repo2graph.mcp:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo2graph*"]

# PEP 561. Without this marker every downstream consumer of the Python API in
# docs/python-api.md gets `Any` from `import repo2graph`, however strictly the
# package itself is checked -- a type checker ignores inline annotations in an
# installed package that does not ship the file. `package-data` is the half
# that is easy to miss: the marker has to be *in the wheel*, not just in the
# source tree, which is what `test_version_surfaces.py` now asserts.
[tool.setuptools.package-data]
repo2graph = ["py.typed"]

[project.optional-dependencies]
# pyyaml: tests/test_doc_consistency.py parses action.yml directly. It was
# only ever present transitively (via pre-commit), so a clean `pip install
# -e ".[dev]"` without pre-commit's own deps resolved had no yaml module.
# pytest-xdist: the suite is ~1,700 mostly-independent tests with no shared
# database or fixture state, so it parallelises almost linearly -- 134s serial
# down to 36s on 16 cores, 49s on a 4-vCPU runner. `[tool.coverage.run]` below
# already sets `parallel = true`, which is what lets the workers' data combine.
# hypothesis: tests/test_properties.py only. Capped below 7 for the same reason
# the other caps here exist -- a major bump is the untested thing. Hypothesis
# ships behaviour changes (new health checks, strategy shrinking, deprecations
# promoted to errors) that turn a green property suite red without a line of
# this repository changing, and the floor is 6.100 because the profile that
# file registers uses `derandomize` together with `suppress_health_check`,
# which is what keeps the run reproducible across the 12-cell CI matrix.
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100,<7",
    "ruff>=0.5",
    "mypy>=1.11",
    "pre-commit>=3.5",
    "pyyaml>=6.0",
]
# Strictly optional: the GraphRAG layer falls back to BM25 + the identifier
# boost with zero extra dependencies when these are not installed.
# numpy is declared but never imported by repo2graph -- embed.py writes and
# reads vectors.npy by hand with `struct` precisely so the runtime needs no
# array library. It is here because the file is a real NPY v1.0 and is meant to
# be openable with `numpy.load`, so `[rag]` ships what you need to *use* the
# output. Do not delete it as unused; it is a deliberate consumer-side
# declaration (and sentence-transformers pulls it in regardless).
rag = ["sentence-transformers>=3.0", "numpy>=1.24"]
# The same dense retrieval without torch. `model2vec` is a static-embedding
# model -- a token -> vector table plus mean pooling, no transformer forward
# pass -- so inference is numpy and nothing here pulls torch or the NVIDIA
# CUDA wheels. Measured: ~60 MB of packages and a ~31 MB model, against the
# several GB `rag` costs on Linux.
#
# It is a *different model*, not a cheaper way to run the same one (256-dim
# against MiniLM's 384), so it must be expected to retrieve differently and
# the dense result recorded in benchmarks/real/README.md does not transfer.
# Both extras can be installed together; `--embed-backend` chooses, and the
# recorded model id is prefixed per backend so an index built with one is
# refused by the other rather than silently fused.
#
# Capped below 1.0 for the reason every cap here exists: a major bump is the
# untested thing, and this one owns the vector width, which `vectors.meta.json`
# records and the query side refuses a mismatch on.
rag-static = ["model2vec>=0.10,<1.0", "numpy>=1.24"]
# Only `repo2graph-mcp` needs this; the CLI and the Action never import it.
# 1.x is no longer supported (#407): under mcp 1.30.0 the server hangs on the
# first `tools/call` on the parallel path
# (test_tools_call_over_serve_completes_on_the_parallel_path), deterministic,
# ~4 minutes to time out. serve() drove 1.x's decorator API
# (`hasattr(Server, "list_tools")`) only to work around that generation, and the
# workaround was untested -- CI always resolved 2.x from PyPI. The lower bound is
# now 2.0, matching what is actually exercised. The upper bound stays `<3.0`: an
# unreleased 3.x is the thing that has not been tested, not 2.x. Keep this in
# sync with `SDK_SPEC` in repo2graph/mcp/server.py.
mcp = ["mcp>=2.0,<3.0"]
# Shell tab completion via argcomplete
completion = ["argcomplete>=3.0"]


[tool.pytest.ini_options]
testpaths = ["tests"]

# branch=True is the point of measuring at all here: statement coverage counts
# an `if` as covered when only the taken side ever ran, which is exactly the
# question the suite could not answer about the refusal paths in security.py's
# redaction or the clamps in mcp/guardrails.py -- the branch that *declines*
# is the one worth proving runs.
[tool.coverage.run]
source = ["repo2graph"]
branch = true
# Worker processes (build() above PARALLEL_MIN_FILES) need this or their
# coverage is dropped on exit and the parallel path reads as dead code.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# A floor, not a target. Measured at 86% (branch) across the 9-cell CI matrix,
# so this leaves room for the legitimate variance -- the `rag` extra is not
# installed in CI, and its tests skip -- while still failing a run that deletes
# or strands a meaningful body of tested code. Raise it when the floor is
# comfortably cleared; do not raise it to whatever today's number happens to be.
fail_under = 80
exclude_also = [
    # Import-time fallbacks for optional extras. The `rag`/`mcp` branch that
    # does not match the installed environment can never run in that run.
    "except ImportError:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# `E`, `F`, `W` and `BLE` were the whole set for a long time, which is style
# plus blind-except: nothing in CI read the *code* for a bug or a security
# pattern. `zizmor` audits the workflows and `reuse` audits the licensing, so
# the source itself was the unscanned surface. The four additions each buy a
# class of finding rather than a preference:
#
#   B   flake8-bugbear  -- real bug classes. `B023` (a closure over a loop
#                          variable) and `B905` (an unequal-length `zip`
#                          silently truncating) are both live here.
#   S   flake8-bandit   -- the security rules. This project redacts secrets,
#                          hardens output paths and parses untrusted protobuf,
#                          so "no SAST on the Python source" was the gap least
#                          consistent with what SECURITY.md promises.
#   I   isort           -- import order, so a merge does not reorder imports.
#   UP  pyupgrade       -- syntax the 3.10 floor already allows.
#   RUF ruff's own      -- includes `RUF100`, which deletes a `noqa` that has
#                          stopped suppressing anything; several here had.
#
# `SIM` is deliberately out: ~60 findings, all preference (`SIM105` wants
# `contextlib.suppress` for a bare try/except/pass), and none of them is a bug.
select = ["E", "F", "W", "BLE", "B", "S", "I", "UP", "RUF"]
ignore = [
    "E501",
    "E702",
    "E731",
    "E741",
    # `assert` is the test suite's only assertion mechanism and is used inside
    # the package for invariants that are programming errors rather than input
    # errors. S101 flags every one of the ~5,100 of them; enabling it would
    # mean a blanket per-file-ignore for `tests/`, which is the same decision
    # with more moving parts.
    "S101",
    # Unicode in strings is the subject matter here: `security.py` spells out
    # confusable and control characters, `test_encoding.py` fixtures contain
    # U+2028/U+2029 on purpose, and `viz.py` emits typographic punctuation.
    # RUF001 cannot tell those from a typo.
    "RUF001",
    # `BLE001` already governs this exact pattern, and it is *selected*, so a
    # swallowed exception has to carry a written reason to pass the gate --
    # which every one of these sites does ("resilience boundary: ..."). S110 is
    # the same finding without the escape hatch, so enabling both would mean
    # two suppressions per site and would make the BLE reason the quieter one.
    "S110",
]

[tool.ruff.lint.per-file-ignores]
# Subprocess use is the point of these modules, not an oversight: discovery
# shells out to `git ls-files`, `cochange.py` reads `git log`, `fetch.py`
# clones, `doctor.py` probes the environment. Every call site passes an
# argument list (never a string, never `shell=True`), which is the actual
# S602/S604 risk; S603 fires on the safe form too, and S607 wants absolute
# paths for `git` and `node`, which would break every PATH-based install.
# Scoped to the modules that genuinely spawn processes so a *new* subprocess
# call elsewhere still has to be justified.
"repo2graph/cochange.py" = ["S603", "S607"]
"repo2graph/discovery.py" = ["S603", "S607"]
"repo2graph/doctor.py" = ["S603", "S607"]
"repo2graph/fetch.py" = ["S603", "S607"]
"repo2graph/graphdiff.py" = ["S603", "S607"]
"repo2graph/integrity.py" = ["S603", "S607"]
"repo2graph/graph.py" = ["S603", "S607"]
# `_run_cpp` shells out to the C preprocessor for the macro-expansion path.
"repo2graph/parse.py" = ["S603", "S607"]
"repo2graph/neo4j.py" = ["S310"]
"repo2graph/answer.py" = ["S310"]
# The test suite and the repo's own tooling are not shipped artifacts. They
# spawn processes, bind throwaway sockets, write temp files and embed
# credential-shaped literals as fixtures, all of which S flags by design.
# RUF012 (a mutable class default) and B008 (a call in a default argument) are
# how several fixtures here are deliberately shaped -- a fake clock built on
# `itertools.count()`, a stub whose class-level list collects calls.
"tests/**" = ["S", "B011", "B017", "RUF012", "B008"]
"scripts/**" = ["S"]
".github/scripts/**" = ["S"]
"benchmarks/**" = ["S"]
# The synthetic corpus is *input to the parser*, not code that runs: it exists
# to contain the reflection dispatch, string-keyed registries and barrel
# re-exports that defeat name resolution (benchmarks/corpus/README.md pins them
# as known failures). Lint findings there are describing the fixture working as
# intended, and any rule added later would fire on it for the same reason.
# `ALL` here, rather than a top-level `exclude`, so `ruff format` still covers
# it -- the files stay formatted, which keeps the line numbers the benchmark
# baselines cite stable.
"benchmarks/corpus/**" = ["ALL"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# There is no per-module escape hatch any more. `strict` applies to all 59
# modules in the package, so a new module is strict-checked with no edit here
# and there is nothing to add oneself to.
#
# The last three to be annotated were `cli.py`, `graph.py` and `parse.py` --
# the three largest, 6,000 lines between them. What came out of it was not
# just annotations: the exemption had been masking two errors in *other*
# modules (`fetch.py` set an undeclared `source_remote` on `Graph`, which is a
# documented `manifest.json` field; `demo.py` assigned a list into what
# `dict(Counter)` makes a `dict[str, int]`), because an untyped `graph.py`
# made both unprovable rather than wrong.
#
# Check it the way CI does -- `mypy --platform linux|darwin|win32 repo2graph`.
# A single native run checks only the stubs the runner's own platform selects,
# and one real finding here (`parse.py`'s ctypes `HANDLE` returning `Any`)
# existed on win32 alone.
follow_imports = "silent"

# numpy ships stubs that use PEP 695 `type` statements, which mypy refuses to
# parse under `python_version = "3.10"` -- it reports a *syntax* error in
# numpy/__init__.pyi and then stops, so `make typecheck` fails before checking a
# single line of this package. CI never caught it because CI does not install
# the `rag` extra; anyone who ran `make install` (which does) saw the whole
# typecheck target break. `python_version` stays at 3.10 because that is the
# declared floor in `requires-python`, so the fix is to stop following numpy's
# stubs rather than to raise the floor. `skip`, not `silent`: `silent` still
# parses the file.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

#
# The list is now empty: `cli.py`, `graph.py` and `parse.py` were the last
# three, and they are annotated. Nothing in the package escapes `strict` any
# more, so a new module is strict-checked with no further edit here.
