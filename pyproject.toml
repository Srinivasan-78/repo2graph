[project]
name = "repo2graph"
version = "0.1.0"
description = "Turn any repository into a code graph + graph-aware RAG chunks"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "networkx>=3.0",
]

[project.scripts]
repo2graph = "repo2graph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
