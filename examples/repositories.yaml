# Registry of real-world repositories analyzed by repo2graph.
#
# Consumed by scripts/generate_examples.py. Do not hand-edit the generated
# artifacts under examples/<id>/ — edit this file and regenerate:
#
#   python scripts/generate_examples.py --repo <id>
#   python scripts/generate_examples.py --all
#
# `sparse_paths` (git sparse-checkout, non-cone patterns) keep the clone from
# downloading blobs outside the analyzed scope. `include`/`exclude` are
# repo2graph's own discovery globs, applied after checkout, and are the
# authoritative record of what was actually indexed — `sparse_paths` is only
# a bandwidth optimization and must be a superset of `include`.
#
# scope: full   -> the whole repository at the pinned commit was indexed.
# scope: scoped -> only the listed subtrees were indexed; see each repo's
#                  README.md "Why this scope" section for the reasoning.
# `git_history` > 0 requires a clone deep enough to carry that many commits
# (clone_depth 0 = full history); scoped repositories use depth 1 and skip
# CO_CHANGE edges entirely, since a 1-commit clone has no history to mine.

repositories:
  - id: django
    name: Django
    url: https://github.com/django/django
    ref: main
    clone_depth: 300
    git_history: 200
    scope: full
    sparse_paths: null
    include: null
    exclude: []
    max_files: 0
    language_focus: [python]
    category: [web-framework, mature, single-language]
    why: >
      Mature, long-lived, single-language Python framework — decorators, URL
      routing, an ORM, middleware, and an extensive test suite. Small enough
      relative to the other four that the whole repository is indexed at
      once, making it the pipeline's full-repository (non-scoped) baseline.
    queries:
      - "How does a request travel through Django middleware?"
      - "How does URL resolution reach a view?"
      - "Where does model query execution originate?"
      - "How does a management command get invoked?"

  - id: kubernetes
    name: Kubernetes
    url: https://github.com/kubernetes/kubernetes
    ref: master
    clone_depth: 1
    git_history: 0
    scope: scoped
    sparse_paths:
      - /cmd/kube-controller-manager/
      - /pkg/controller/
      - /pkg/scheduler/
      - /pkg/registry/core/pod/
      - /staging/src/k8s.io/apiserver/pkg/endpoints/
    include:
      - cmd/kube-controller-manager/**
      - pkg/controller/**
      - pkg/scheduler/**
      - pkg/registry/core/pod/**
      - staging/src/k8s.io/apiserver/pkg/endpoints/**
    exclude:
      - "**/testdata/**"
    max_files: 4000
    language_focus: [go]
    category: [cloud-native, monorepo, large-scale]
    why: >
      Kubernetes' full tree is on the order of hundreds of thousands of files
      once vendor/ and generated clients are counted — not a repository size
      that a single reproducible CI-friendly run should attempt whole. This
      is a scoped benchmark (see docs/architecture.md and section "Why this
      scope" below): the controller-manager entrypoint, the built-in
      controllers, the scheduler, the pod registry, and the API server's
      request-handling package (apiserver/pkg/endpoints) — a coherent slice
      that a "how does a request flow through the API server" or "what calls
      a specific controller" question can actually be answered against.
    queries:
      - "How does a request flow through the API server?"
      - "Where are controller entry points?"
      - "What calls the pod controller?"
      - "What is the impact radius of changing the scheduler's core interface?"

  - id: tensorflow
    name: TensorFlow
    url: https://github.com/tensorflow/tensorflow
    ref: master
    clone_depth: 1
    git_history: 0
    scope: scoped
    sparse_paths:
      - /tensorflow/python/framework/
      - /tensorflow/python/eager/
      - /tensorflow/core/framework/
      - /tensorflow/core/common_runtime/
    include:
      - tensorflow/python/framework/**
      - tensorflow/python/eager/**
      - tensorflow/core/framework/**
      - tensorflow/core/common_runtime/**
    exclude:
      - "**/testdata/**"
    max_files: 4000
    language_focus: [python, cpp]
    category: [machine-learning, multi-language, large-scale]
    why: >
      TensorFlow's full tree includes generated bindings, third-party
      vendoring and a bazel build graph that dwarf the hand-written source.
      This scope covers the Python/C++ boundary directly: `python/framework`
      and `python/eager` are the Python-side op/eager machinery, `core/framework`
      and `core/common_runtime` are the C++ execution core they call into —
      the pair this project exists to test cross-language behavior against
      (see docs/architecture.md, "cross-language resolution").
    queries:
      - "Where does a Python API cross into C++?"
      - "What participates in eager execution?"
      - "What is the dependency path between the Python framework and the C++ core runtime?"

  - id: vscode
    name: VS Code
    url: https://github.com/microsoft/vscode
    ref: main
    clone_depth: 1
    git_history: 0
    scope: scoped
    sparse_paths:
      - /src/vs/
    include:
      - src/vs/**
    exclude:
      - "**/test/**"
      - "**/*.test.ts"
    max_files: 6000
    language_focus: [typescript]
    category: [application, editor, large-scale]
    why: >
      `extensions/` (bundled extensions, each with its own dependency tree)
      and `node_modules`-shaped build tooling dominate file count without
      adding architecturally interesting graph structure. `src/vs/` is the
      actual editor/workbench/platform source — base services, the editor,
      the workbench UI, and the Electron/Node entry points — where the
      "command to handler" and "editor action to service" flows this example
      set is built around actually live.
    queries:
      - "How does a command reach its handler?"
      - "What is the flow from an editor action to a service?"
      - "What are the core platform services other layers depend on?"

  - id: linux
    name: Linux kernel
    url: https://github.com/torvalds/linux
    ref: master
    clone_depth: 1
    git_history: 0
    scope: scoped
    sparse_paths:
      - /kernel/
      - /fs/ext4/
      - /drivers/net/ethernet/intel/e1000/
      - /include/linux/
    include:
      - kernel/**
      - fs/ext4/**
      - drivers/net/ethernet/intel/e1000/**
      - include/linux/**
    exclude: []
    max_files: 6000
    language_focus: [c]
    category: [kernel, extreme-scale, heterogeneous]
    why: >
      The full kernel tree is architecture-specific code times every
      supported CPU family times every driver ever merged — not a size any
      single machine should attempt to index in one CI-friendly run (see
      docs/architecture.md, "extreme-scale"). This scope is one representative
      slice of each category the task calls out: `kernel/` (core subsystems:
      scheduler, cgroups, module loading), `fs/ext4/` (a representative
      filesystem), `drivers/net/ethernet/intel/e1000/` (a representative
      driver), and `include/linux/` (the headers those subsystems share).
    queries:
      - "Where is the scheduler subsystem initialized?"
      - "What calls into the e1000 driver's probe function?"
      - "What are the major relationships around ext4's core structures?"

  - id: react
    name: React
    url: https://github.com/facebook/react
    ref: main
    clone_depth: 1
    git_history: 0
    scope: scoped
    sparse_paths:
      - /packages/react/
      - /packages/react-reconciler/
      - /packages/react-dom/
      - /packages/react-dom-bindings/
      - /packages/scheduler/
      - /packages/shared/
    include:
      - packages/react/**
      - packages/react-reconciler/**
      - packages/react-dom/**
      - packages/react-dom-bindings/**
      - packages/scheduler/**
      - packages/shared/**
    exclude:
      - "**/__tests__/**"
    max_files: 4000
    language_focus: [javascript]
    category: [ui-library, monorepo, single-language]
    why: >
      One of the most widely used UI libraries, and a JavaScript monorepo
      wired together partly at build time: the reconciler imports a
      host-config module (`ReactFiberConfig.js`) that only throws, and the
      bundler swaps it for each renderer's real one — an edge no parser of the
      source can see. The repository's other half — the React
      Compiler (`compiler/`), DevTools and test fixtures — is excluded, as
      are `__tests__/` directories; this scope is the runtime a "how does
      setState become a DOM update" question is actually answered from.
      React's `.js` files carry Flow type annotations, which repo2graph
      parses with the plain JavaScript grammar, which has no Flow support.
      That costs real structure: read "Files with parse errors" below, and
      treat the symbol and CALLS counts as a lower bound on what the code
      actually contains. It is in the gallery because it is the honest
      picture of a Flow codebase today, not a showcase.
    queries:
      - "How does setState schedule a re-render?"
      - "How does the reconciler begin work on a fiber?"
      - "Where does a committed fiber tree reach the DOM?"
      - "What calls the scheduler to run a callback?"

  - id: fastapi
    name: FastAPI
    url: https://github.com/fastapi/fastapi
    ref: master
    clone_depth: 300
    git_history: 200
    scope: full
    sparse_paths: null
    include: null
    exclude: []
    max_files: 0
    language_focus: [python]
    category: [web-framework, async, single-language]
    why: >
      A modern async Python web framework built on Starlette and Pydantic,
      where most of the interesting behaviour — dependency injection, request
      validation, OpenAPI generation — is reached through decorators and
      function signatures rather than explicit calls. Indexed whole, with git
      history, so `CO_CHANGE` edges are present. The repository is also one of
      the four in the retrieval benchmark (benchmarks/real/), so its graph can
      be read next to measured questions about it. Over half of the indexed
      files are Markdown documentation under `docs/`, most of it
      translations; those are indexed as text, with no symbols.
    queries:
      - "How are a path operation's dependencies resolved?"
      - "Where is a request body validated into a Pydantic model?"
      - "How is the OpenAPI schema generated?"
      - "What calls solve_dependencies?"

  - id: gin
    name: Gin
    url: https://github.com/gin-gonic/gin
    ref: master
    clone_depth: 300
    git_history: 200
    scope: full
    sparse_paths: null
    include: null
    exclude: []
    max_files: 0
    language_focus: [go]
    category: [web-framework, small, single-language]
    why: >
      One of the most widely used Go web frameworks, and small enough to index whole
      with git history — the counterpoint to Kubernetes, which is Go at a
      scale that has to be scoped. A radix-tree router, a middleware chain
      driven by `Context.Next`, and pluggable binding and rendering packages
      make it a compact test of method resolution on Go receivers.
    queries:
      - "How does a request reach a handler through the router?"
      - "How are middleware handlers chained with Next?"
      - "Where is a request bound to a struct?"
      - "What renders a JSON response?"

  - id: ripgrep
    name: ripgrep
    url: https://github.com/BurntSushi/ripgrep
    ref: master
    clone_depth: 300
    git_history: 200
    scope: full
    sparse_paths: null
    include: null
    exclude: []
    max_files: 0
    language_focus: [rust]
    category: [cli-tool, workspace, single-language]
    why: >
      The gallery's Rust entry, and the tool the retrieval benchmark's grep
      baseline actually runs. A Cargo workspace split into reusable crates
      (`ignore`, `globset`, `grep-searcher`, `grep-printer`, `grep-regex`)
      behind one binary, which makes the cross-crate edges — the binary
      calling into the searcher, the searcher into the matcher — the
      structure worth looking at. Small enough to index whole with git
      history.
    queries:
      - "How does a search get dispatched across files?"
      - "Where are command-line flags parsed?"
      - "How does the searcher detect binary files?"
      - "What decides which files are ignored?"

  - id: guava
    name: Guava
    url: https://github.com/google/guava
    ref: master
    clone_depth: 1
    git_history: 0
    scope: scoped
    sparse_paths:
      - /guava/src/
    include:
      - guava/src/**
    exclude: []
    max_files: 4000
    language_focus: [java]
    category: [library, interface-heavy, single-language]
    why: >
      The gallery's Java entry: Google's core libraries for Java, a codebase
      built from interfaces, abstract base classes and many small
      implementations of each. A call made through an interface has many
      same-named candidates, which name-based resolution prices at `1/n`
      rather than picks — the ambiguous-call count below is that cost, shown
      rather than avoided. The repository carries the same library twice
      (`guava/` for the JRE and `android/guava/` for Android) plus test
      suites, a test library and a GWT variant; this scope is the JRE
      library's production source, `guava/src/`, once.
    queries:
      - "How does an immutable list get built?"
      - "Where does a LoadingCache load a missing value?"
      - "How are listeners notified when a ListenableFuture completes?"
      - "What implements the Multimap interface?"

  - id: jekyll
    name: Jekyll
    url: https://github.com/jekyll/jekyll
    ref: master
    clone_depth: 300
    git_history: 200
    scope: full
    sparse_paths: null
    include: null
    exclude: []
    max_files: 0
    language_focus: [ruby]
    category: [static-site-generator, plugin-architecture, single-language]
    why: >
      The gallery's Ruby entry: a widely used static site generator, and
      small enough to index whole with git history. Its build is a pipeline
      — read, generate, render, write — driven from one `Site` object.
      Converters and generators are found at runtime as subclasses of
      `Jekyll::Plugin` (`Site#instantiate_subclasses`) and Liquid tags are
      registered by name, so it tests how much of a Ruby codebase's structure
      a parser recovers when part of the wiring is subclass registration
      rather than explicit calls.
    queries:
      - "How does a site build go from reading files to writing output?"
      - "How is a Markdown page converted to HTML?"
      - "Where are plugins loaded?"
      - "What calls the Liquid renderer?"

  - id: rails
    name: Rails
    url: https://github.com/rails/rails
    ref: main
    clone_depth: 1
    git_history: 0
    scope: scoped
    sparse_paths:
      - /actionpack/lib/
      - /activerecord/lib/
      - /activesupport/lib/
      - /railties/lib/
    include:
      - actionpack/lib/**
      - activerecord/lib/**
      - activesupport/lib/**
      - railties/lib/**
    exclude: []
    max_files: 4000
    language_focus: [ruby]
    category: [web-framework, metaprogramming-heavy, single-language]
    why: >
      The gallery's second Ruby entry, and the one that shows where a
      name-based call graph thins out. Rails builds much of its own API at load
      time — `ActiveSupport::Concern`'s `included do` blocks, `delegate`,
      `define_method`, and Active Record's `method_missing` fallbacks — so for
      a large part of what application code calls there is no call site in the
      source to find, and the graph is honest about the structure it can see
      rather than guessing at the rest. Jekyll is the Ruby entry indexed whole
      with history; this is the four libraries a request actually passes
      through: routing and controllers (`actionpack`), the ORM
      (`activerecord`), the boot sequence (`railties`) and the core extensions
      underneath all of it (`activesupport`).
    queries:
      - "How does a request travel through the Rails middleware stack?"
      - "How does routing reach a controller action?"
      - "Where does an Active Record relation become SQL?"
      - "How does a Rails application boot?"

  - id: spring-framework
    name: Spring Framework
    url: https://github.com/spring-projects/spring-framework
    ref: main
    clone_depth: 1
    git_history: 0
    scope: scoped
    sparse_paths:
      - /spring-beans/src/main/java/
      - /spring-context/src/main/java/
      - /spring-web/src/main/java/
      - /spring-webmvc/src/main/java/
    include:
      - spring-beans/src/main/java/**
      - spring-context/src/main/java/**
      - spring-web/src/main/java/**
      - spring-webmvc/src/main/java/**
    exclude: []
    max_files: 4000
    language_focus: [java]
    category: [framework, dependency-injection, single-language]
    why: >
      The gallery's second Java entry, and a different limit from Guava's. Where
      Guava shows what interface dispatch costs a name-based resolver, Spring
      shows what dependency injection hides from one: the container decides at
      runtime which implementation a bean receives, and the decision lives in
      annotations, component scans and XML rather than in a call. So the graph
      maps the framework's own machinery — bean definition, post-processing,
      request dispatch, argument resolution — while the application-level
      wiring it exists to perform is not in the source to be found. The scope is
      the container (`spring-beans`, `spring-context`) and the web stack on top
      of it (`spring-web`, `spring-webmvc`), production source only.
    queries:
      - "How does the bean factory create and wire a bean?"
      - "Where is a web request dispatched to a handler method?"
      - "How is an annotated configuration class turned into bean definitions?"
      - "What resolves the arguments of a handler method?"
