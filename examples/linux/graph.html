<style>
  :root {

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {

    color: var(--ink); background: var(--bg); overflow: hidden;
  }
  #app { display: flex; height: 100%; }
  #side {

  }
  #side h1 { font-size: 14px; margin: 0; letter-spacing: .2px; }
  #side h2 { font-size: 13px; margin: 0 0 6px; }

  .sub { color: var(--muted); font-size: 11.5px; margin-top: 4px; }

  }
  #search:focus { outline: 2px solid rgba(47,111,237,.35); border-color: var(--accent); }
  .legend { display: flex; flex-direction: column; gap: 4px; }
  .legend label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .legend input { margin: 0; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; }
  .bar { width: 12px; height: 3px; border-radius: 2px; background: var(--edge); flex: 0 0 12px; }
  .count { margin-left: auto; color: var(--muted); font-size: 11px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 12px; padding: 5px 10px; border: 1px solid var(--line);
    background: #fff; border-radius: 6px; cursor: pointer; color: inherit;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #details { padding: 12px 14px; overflow: auto; flex: 1; }
  #details .kv { display: grid; grid-template-columns: 74px 1fr; gap: 3px 8px; margin: 8px 0; }
  #details .kv span:first-child { color: var(--muted); }
  #details .kv span:last-child { overflow-wrap: anywhere; }
  #details pre {
    margin: 6px 0; padding: 8px; background: #f3f5f8; border-radius: 6px;
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #details .nb { display: block; width: 100%; text-align: left; margin: 3px 0; }
  #details .nb .count { font-size: 10.5px; }
  .chip {
    display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
    color: #2b2b2b; font-weight: 600;
  }
  #stage { flex: 1; position: relative; }
  #progress { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
              z-index: 5; background: #1c2333; color: #c9d1d9; border-radius: 6px;
              padding: 6px 10px; font-size: 12px; display: flex; align-items: center;
              gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #progress[hidden] { display: none; }
  #progress-track { width: 120px; height: 4px; background: #30363d; border-radius: 2px; }
  #progress-bar { height: 4px; width: 0%; background: #58a6ff; border-radius: 2px;
                  transition: width .08s linear; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  svg.panning { cursor: grabbing; }
  .link { stroke: var(--edge); stroke-width: 1.1px; }
  .link-label {
    fill: var(--muted); font-size: 8.8px; letter-spacing: .3px; text-anchor: middle;
    paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none;
    user-select: none;
  }
  .node { cursor: pointer; }
  .node circle { stroke: rgba(0,0,0,.16); stroke-width: 1px; }
  .node text {
    text-anchor: middle; dominant-baseline: central; font-size: 9.5px; fill: #23262b;
    pointer-events: none; user-select: none;
  }
  .node.pinned circle { stroke: #23262b; stroke-width: 1.6px; stroke-dasharray: 3 2; }
  .node.hit circle { stroke: #b8860b; stroke-width: 2.5px; }
  .dim { opacity: .18; }
  .fade { opacity: .18; }
  #hud {
    position: absolute; right: 12px; bottom: 10px; color: var(--muted); font-size: 11px;
    background: rgba(255,255,255,.85); padding: 4px 8px; border-radius: 6px;
  }
</style>

<div id="app">

        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"

          <path d="M 0 0 L 10 5 L 0 10 z" fill="#a5adba"></path>

      <g id="view">
        <g id="g-edges"></g>
        <g id="g-edge-labels"></g>
        <g id="g-nodes"></g>
      </g>
    </svg>
    <div id="hud">drag to pan · scroll to zoom · drag a node to pin it · double-click to release</div>
  </div>
</div>

things like bitshifts * need extra checks in the 32-bit case. */"}, {"id": "sym:kernel/bpf/verifier.c::bpf_check", "label": "bpf_check", "type": "symbol", "deg": 14, "path": "kernel/bpf/verifier.c", "kind": "function", "lang": "c", "start_line": 21132, "end_line": 21466, "sig": "int bpf_check(struct bpf_prog **prog, union bpf_attr *attr, bpfptr_t uattr, struct bpf_log_attr *attr_log)"}, {"id": "sym:kernel/capability.c::capable", "label": "capable", "type": "symbol", "deg": 3, "path": "kernel/capability.c", "kind": "function", "lang": "c", "start_line": 413, "end_line": 416, "sig": "bool capable(int cap)", "doc": "/** * capable - Determine if the current task has a superior capability in effect * @cap: The capability to be tested for * * Return true if the current task has the given superior capability currently * available for use, false if not. * * This sets PF_SUPERPRIV on the task if the capability is available on the * assumption that it's about to be used. */"}, {"id": "file:kernel/cgroup/cgroup.c", "label": "cgroup.c", "type": "file", "deg": 13, "path": "kernel/cgroup/cgroup.c", "lang": "c", "lines": 7621}, {"id": "file:kernel/cgroup/cpuset.c", "label": "cpuset.c", "type": "file", "deg": 9, "path": "kernel/cgroup/cpuset.c", "lang": "c", "lines": 4588}, {"id": "file:kernel/cpu.c", "label": "cpu.c", "type": "file", "deg": 18, "path": "kernel/cpu.c", "lang": "c", "lines": 3340}, {"id": "sym:kernel/cpu.c::cpus_read_unlock", "label": "cpus_read_unlo…", "type": "symbol", "deg": 2, "path": "kernel/cpu.c", "kind": "function", "lang": "c", "start_line": 500, "end_line": 503, "sig": "void cpus_read_unlock(void)"}, {"id": "sym:kernel/debug/kdb/kdb_io.c::kdb_printf", "label": "kdb_printf", "type": "symbol", "deg": 0, "path": "kernel/debug/kdb/kdb_io.c", "kind": "function", "lang": "c", "start_line": 907, "end_line": 917, "sig": "int kdb_printf(const char *fmt, ...)"}, {"id": "file:kernel/debug/kdb/kdb_main.c", "label": "kdb_main.c", "type": "file", "deg": 17, "path": "ker unlock() can NOT directly be used to release an object su…"}, {"id": "sym:kernel/locking/rtmutex_api.c::mutex_lock", "label": "mutex_lock", "type": "symbol", "deg": 5, "path": "kernel/locking/rtmutex_api.c", "kind": "function", "lang": "c", "start_line": 640, "end_line": 643, "sig": "void __sched mutex_lock(struct mutex *lock)"}, {"id": "sym:kernel/locking/rtmutex_api.c::mutex_unlock", "label": "mutex_unlock", "type": "symbol", "deg": 6, "path": "kernel/locking/rtmutex_api.c", "kind": "function", "lang": "c", "start_line": 677, "end_line": 682, "sig": "void __sched mutex_unlock(struct mutex *lock) __releases(lock) __no_context_analysis", "doc": "/* !CONFIG_DEBUG_LOCK_ALLOC */"}, {"id": "sym:kernel/locking/rwsem.c::down_read", "label": "down_read", "type": "symbol", "deg": 1, "path": "kernel/locking/rwsem.c", "kind": "function", "lang": "c", "start_line": 1570, "end_line": 1577, "sig": "void __sched down_read(struct rw_semaphore *sem) __no_context_analysis", "doc": "/* CONFIG_PREEMPT_RT */ /* * lock for reading */"}, {"id": "sym:kernel/locking/rwsem.c::down_write", "label": "down_write", "type": "symbol", "deg": 0, "path": "kernel/locking/rwsem.c", "kind": "function", "lang": "c", "start_line": 1627, "end_line": 1633, "sig": "void __sched down_write(struct rw_semaphore *sem) __no_context_analysis", "doc": "/* * lock for writing */"}, {"id": "sym:kernel/locking/rwsem.c::up_read", "label": "up_read", "type": "symbol", "deg": 1, "path": "kernel/locking/rwsem.c", "kind": "function", "lang": "c", "start_line": 1673, "end_line": 1678, "sig": "void up_read(struct rw_semaphore *sem) __no_context_analysis", "doc": "/* * release a read lock */"}, {"id": "sym:kernel/locking/rwsem.c::up_write", "label": "up_write", "type": "symbol", "deg": 0, "path": "kernel/locking/rwsem.c", "kind": "function", "lang": "c", "start_line": 1684, "end_line": 1689, "sig": "void up_write(struct rw_semaphore *sem) __no_context_analysis", "doc": "/* * release a write lock */"}, {"id": "file:kernel/module/main.c", "label": "main.c", "type": "file", "deg": 25, "path": "kernel/module/main.c", "lang": "c", "lines": 4002}, {"id": "sym:kernel/module/main.c::module_put", "label": "module_put", "type": "symbol", "deg": 4, "path": "kernel/module/main.c", "kind": "function", "lang": "c", "start_line": 951, "end_line": 960, "sig": "void module_put(struct module *module)"}, {"id": "sym:kernel/module/main.c::load_module", "label": "load_module", "type": "symbol", "deg": 13, "path": "kernel/module/main.c", "kind": "function", "lang": "c", "start_line": 3433, "end_line": 3645, "sig": "static int load_module(struct load_info *info, const char __user *uargs, int flags)", "doc": "/* * Allocate and load the module: note that size of section 0 is always * zero, and we rely on this for optional sections. */"}, {"id": "file:kernel/power/snapshot.c", "label": "snapshot.c", "type": "file", "deg": 15, "path": "kernel/power/snapshot.c", "lang": "c", "lines": 2932}, {"id": "file:kernel/printk/printk.c", "label": "printk.c", "type": "file", "deg": 11, "path": "kernel/printk/printk.c", "lang": "c", "lines": 5189}, {"id": "file:kernel/rcu/rcutorture.c", "label": "rcutorture.c", "type": "file", "deg": 19, "path": "kernel/rcu/rcutorture.c", "lang": "c", "lines": 4925}, {"id": "file:kernel/rcu/refscale.c", "label": "refscale.c", "type": "file", "deg": 20, "path": "kernel/rcu/refscale.c", "lang": "c", "lines": 1593}, {"id": "sym:kernel/rcu/tiny.c::synchronize_rcu", "label": "synchronize_rcu", "type": "symbol", "deg": 2, "path": "kernel/rcu/tiny.c", "kind": "function", "lang": "c", "start_line": 141, "end_line": 150, "sig": "void synchronize_rcu(void)", "doc": "/* * Wait for a grace period to elapse. But it is illegal to invoke * synchronize_rcu() from within an RCU read-side critical section. * Therefore, any legal call to synchronize_rcu() is a quiescent state, * and so on a UP system, synchronize_rcu() need do nothing, other than * let the polled APIs know that another grace period elapsed. * * (But Lai Jiangshan points out the benefits of doing migh…"}, {"id": "sym:kernel/rcu/tiny.c::call_rcu", "label": "call_rcu", "type": "symbol", "deg": 3, "path": "kernel/rcu/tiny.c", "kind": "function", "lang": "c", "start_line": 158, "end_line": 183, "sig": "void call_rcu(struct rcu_head *head, rcu_callback_t func)", "doc": "/* * Post an RCU callback to be invoked after the end of an RCU grace * period. But since we have but one CPU, that would be after any * quiescent state. */"}, {"id": "file:kernel/rcu/tree.c", "label": "tree.c", "type": "file", "deg": 28, "path": "kernel/rcu/tree.c", "lang": "c", "lines": 5005}, {"id": "sym:kernel/rcu/tree.c::call_rcu", "label": "call_rcu", "type": "symbol", "deg": 2, "path": "kernel/rcu/tree.c", "kind": "function", "lang": "c", "start_line": 3299, "end_line": 3302, "sig": "void call_rcu(struct rcu_head *head, rcu_callback_t func)", "doc": "/** * call_rcu() - Queue an RCU callback for invocation after a grace period. * By default the callbacks are 'lazy' and are kept hidden from the main * ->cblist to prevent starting of grace periods too soon. * If you desire grace periods to start very soon, use call_rcu_hurry(). * * @head: structure to be used for queueing the RCU updates. * @func: actual callback function to be invoked after the…"}, {"id": "sym:kernel/rcu/tree.c::synchronize_rcu", "label": "synchronize_rcu", "type": "symbol", "deg": 4, "path": "kernel/rcu/tree.c", "kind": "function", "lang": "c", "start_line": 3400, "end_line": 3436, "sig": "void synchronize_rcu(void)", "doc": "/** * synchronize_rcu - wait until a grace period has elapsed. * * Control will return to the caller some time after a full grace * period has elapsed, in other words after all currently executing RCU * read-side critical sections have completed. Note, however, that * upon return from synchronize_rcu(), the caller might well be executing * concurrently with new RCU read-side critical sections tha…"}, {"id": "file:kernel/sched/build_utility.c", "label": "build_utility.c", "type": "file", "deg": 5, "path": "kernel/sched/build_utility.c", "lang": "c", "lines": 107}, {"id": "sym:kernel/sched/completion.c::complete", "label": "complete", "type": "symbol", "deg": 0, "path": "kernel/sched/completion.c", "kind": "function", "lang": "c", "start_line": 50, "end_line": 53, "sig": "void complete(struct completion *x)", "doc": "/** * complete: - signals a single thread waiting on this completion * @x: holds the state of this particular completion * * This will wake up a single thread waiting on this completion. Threads will be * awakened in the same order in which they were queued. * * See also complete_all(), wait_for_completion() and related routines. * * If this function wakes up a task, it executes a full memory bar…"}, {"id": "file:kernel/sched/core.c", "label": "core.c", "type": "file", "deg": 18, "path": "kernel/sched/core.c", "lang": "c", "lines": 11345}, {"id": "sym:kernel/sched/core.c::update_rq_clock", "label": "update_rq_clock", "type": "symbol", "deg": 4, "path": "kernel/sched/core.c", "kind": "function", "lang": "c", "start_line": 870, "end_line": 893, "sig": "void update_rq_clock(struct rq *rq)"}, {"id": "sym:kernel/sched/core.c::resched_curr", "label": "resched_curr", "type": "symbol", "deg": 1, "path": "kernel/sched/core.c", "kind": "function", "lang": "c", "start_line": 1241, "end_line": 1244, "sig": "void resched_curr(struct rq *rq)"}, {"id": "sym:kernel/sched/core.c::wake_up_process", "label": "wake_up_process", "type": "symbol", "deg": 1, "path": "kernel/sched/core.c", "kind": "function", "lang": "c", "start_line": 4561, "end_line": 4564, "sig": "int wake_up_process(struct task_struct *p)", "doc": "/** * wake_up_process - Wake up a specific process * @p: The process to be woken up. * * Attempt to wake up the nominated process and move it to the set of runnable * processes. * * Return: 1 if the process was woken up, 0 if it was already running. * * This function executes a full memory barrier before acce     l.line.setAttribute("x2", x2.toFixed(1)); l.line.setAttribute("y2", y2.toFixed(1));
    if (showLabels) {
      let ang = Math.atan2(dy, dx) * 180 / Math.PI;
      if (ang > 90 || ang < -90) ang += 180;   // labels stay right way up
      l.text.setAttribute("transform",
        "translate(" + ((x1 + x2) / 2).toFixed(1) + "," + ((y1 + y2) / 2).toFixed(1) +
        ") rotate(" + ang.toFixed(1) + ")");
    }
  }
  for (const n of nodes) {
    n.el.style.display = nodeShown(n) ? "" : "none";
    n.el.setAttribute("transform",
      "translate(" + n.x.toFixed(1) + "," + n.y.toFixed(1) + ")");
  }
  view.setAttribute("transform",
    "translate(" + tx.toFixed(1) + "," + ty.toFixed(1) + ") scale(" + scale.toFixed(3) + ")");
}

function frame() {
  step(); render();
  raf = (alpha > 0.02 || drag) ? requestAnimationFrame(frame) : null;
}
function reheat(a) {
  alpha = Math.max(alpha, a === undefined ? 0.6 : a);
  if (!raf) raf = requestAnimationFrame(frame);
}
function fit() {
  const active = nodes.filter(nodeShown);
  if (!active.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of active) {
    const r = radius(n) + 26;
    x0 = Math.min(x0, n.x - r); y0 = Math.min(y0, n.y - r);
    x1 = Math.max(x1, n.x + r); y1 = Math.max(y1, n.y + r);
  }
  const box = svg.getBoundingClientRect();
  scale = Math.max(0.15, Math.min(box.width / (x1 - x0), box.height / (y1 - y0), 1.6));
  tx = box.width / 2 - ((x0 + x1) / 2) * scale;
  ty = box.height / 2 - ((y0 + y1) / 2) * scale;
  render();
}
// How many settle iterations a relayout may run before it gives up and fits
// whatever it has. Overridable per page with data-max-iterations on #stage, so
// a very large graph can be given a longer settle without a rebuild.
const DEFAULT_MAX_ITERATIONS = 500;
// Iterations per animation frame. The browser gets control back between
// batches, so the page stays responsive and the progress bar actually paints.
const SETTLE_BATCH = 20;

function maxIterations() {
  const raw = parseInt(stage.dataset.maxIterations, 10);
  return (Number.isFinite(raw) && raw > 0) ? raw : DEFAULT_MAX_ITERATIONS;
}

function showProgress(done, total) {
  progress.hidden = false;
  progressBar.style.width = Math.round((done / total) * 100) + "%";
}

function relayout() {
  scatter();
  document.querySelectorAll(".node.pinned").forEach(el => el.classList.remove("pinned"));
  alpha = 1;
  // The settle used to run as one synchronous `while` loop, which blocks the
  // browser's main thread for its whole duration: on a large graph the page is
  // frozen -- no paint, no input, no scroll -- and looks hung. Iteration count
  // was capped to bound that, but a bounded freeze is still a freeze.
  //
  // Now it runs in small batches across animation frames. The thread is handed
  // back between batches, so the layout is visibly converging and the page
  // stays interactive while it does. Cancelling an in-flight settle matters
  // too: two overlapping relayouts would otherwise fight over `alpha`.
  if (settleRaf) cancelAnimationFrame(settleRaf);
  const cap = maxIterations();
  let iters = 0;
  function settle() {
    for (let i = 0; i < SETTLE_BATCH && alpha > 0.02 && iters < cap; i++) {
      step(); iters++;
    }
    showProgress(iters, cap);
    render();
    if (alpha > 0.02 && iters < cap) {
      settleRaf = requestAnimationFrame(settle);
      return;
    }
    settleRaf = null;
    progress.hidden = true;
    fit();
  }
  settleRaf = requestAnimationFrame(settle);
}

// ---------- selection + details ----------
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function kv(parent, key, value) {
  if (value === undefined || value === null || value === "") return;
  const row = el("div", "kv");
  row.append(el("span", "", key), el("span", "", String(value)));
  parent.appendChild(row);
}
function emptyDetails() {
  panel.replaceChildren(el("p", "sub", "Click a node to see what it is and what it touches."));
}
function showDetails(n) {
  panel.replaceChildren();
  const chip = el("span", "chip", n.type);
  chip.style.background = colorOf(n);
  panel.append(chip, el("h2", "", n.label));
  const box = el("div");
  kv(box, "id", n.id);
  kv(box, "path", n.path);
  kv(box, "kind", n.kind);
  kv(box, "lang", n.lang);
  kv(box, "lines", n.start_line ? n.start_line + "-" + n.end_line : n.lines);
  kv(box, "degree", n.deg);
  panel.appendChild(box);
  if (n.sig) { panel.append(el("h2", "", "signature"), el("pre", "", n.sig)); }
  if (n.doc) { panel.append(el("h2", "", "doc"), el("pre", "", n.doc)); }

  const list = neighbours(n.id);
  panel.appendChild(el("h2", "", "connections (" + list.length + ")"));
  for (const link of list.slice(0, 80)) {
    const b = el("button", "nb");
    const dot = el("span", "swatch");
    dot.style.background = colorOf(link.other);
    dot.style.display = "inline-block";
    dot.style.marginRight = "6px";
    b.append(dot, document.createTextNode(
      (link.dir === "out" ? "-[" : "<-[") + link.type + (link.dir === "out" ? "]-> " : "]- ") +
      link.other.label));
    b.addEventListener("click", () => selectNode(link.other, true));
    panel.appendChild(b);
  }
}
function selectNode(n, centre) {
  selected = n;
  const near = new Set([n.id]);
  for (const link of neighbours(n.id)) near.add(link.other.id);
  for (const m of nodes) {
    m.el.classList.remove("fade");   // selection dimming replaces search dimming
    m.el.classList.toggle("dim", !near.has(m.id));
  }
  for (const l of links) {
    const on = l.source.id === n.id || l.target.id === n.id;
    l.line.classList.toggle("dim", !on);
    l.text.classList.toggle("dim", !on);
  }
  if (centre) centreOn(n);
  showDetails(n);
}
function clearSelection() {
  selected = null;
  for (const m of nodes) m.el.classList.remove("dim");
  for (const l of links) { l.line.classList.remove("dim"); l.text.classList.remove("dim"); }
  emptyDetails();
}
function centreOn(n) {
  const box = svg.getBoundingClientRect();
  tx = box.width / 2 - n.x * scale;
  ty = box.height / 2 - n.y * scale;
  render();
}

// ---------- controls ----------
function legendRow(host, key, count, colour, kind) {
  const label = el("label");
  const box = el("input");
  box.type = "checkbox";
  box.checked = !(kind === "node" ? hiddenNodeTypes : hiddenEdgeTypes).has(key);
  box.addEventListener("change", () => {
    const hidden = kind === "node" ? hiddenNodeTypes : hiddenEdgeTypes;
    if (box.checked) hidden.delete(key); else hidden.add(key);
    reheat(0.5);
  });
  const mark = el("span", kind === "node" ? "swatch" : "bar");
  if (colour) mark.style.background = colour;
  label.append(box, mark, el("span", "", key), el("span", "count", count));
  host.appendChild(label);
}
for (const [type, count] of DATA.nodeTypes) {
  legendRow(document.getElementById("node-legend"), type, count,
            DATA.colors[type] || DATA.colors._, "node");
}
for (const [type, count] of DATA.edgeTypes) {
  legendRow(document.getElementById("edge-legend"), type, count, null, "edge");
}
document.getElementById("counts").textContent =
  nodes.length + " of " + DATA.totals.nodes + " nodes · " +
  links.length + " of " + DATA.totals.edges + " edges";

const search = document.getElementById("search");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  for (const n of nodes) {
    const hit = q !== "" && n.hay.includes(q);
    n.el.classList.toggle("hit", hit);
    n.el.classList.toggle("fade", q !== "" && !hit);
  }
});
search.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const q = search.value.trim().toLowerCase();
  const hit = q && nodes.find(n => nodeShown(n) && n.hay.includes(q));
  if (hit) selectNode(hit, true);
});
document.getElementById("btn-fit").addEventListener("click", fit);
document.getElementById("btn-relayout").addEventListener("click", relayout);
document.getElementById("btn-unpin").addEventListener("click", () => {
  for (const n of nodes) { n.fx = null; n.fy = null; n.el.classList.remove("pinned"); }
  reheat(0.6);
});

// ---------- pointer: drag nodes, pan and zoom the canvas ----------
function toGraph(ev) {
  const box = svg.getBoundingClientRect();
  return [(ev.clientX - box.left - tx) / scale, (ev.clientY - box.top - ty) / scale];
}
function startDrag(ev, n) {
  ev.stopPropagation();
  drag = n;
  n.fx = n.x; n.fy = n.y;
  n.el.classList.add("pinned");
  svg.setPointerCapture(ev.pointerId);
  reheat(0.4);
}
svg.addEventListener("pointerdown", ev => {
  if (ev.target.closest(".node")) return;
  pan = { x: ev.clientX, y: ev.clientY, tx: tx, ty: ty, moved: false };
  svg.classList.add("panning");
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove", ev => {
  if (drag) {
    const p = toGraph(ev);
    drag.fx = p[0]; drag.fy = p[1];
    reheat(0.3);
  } else if (pan) {
    tx = pan.tx + (ev.clientX - pan.x);
    ty = pan.ty + (ev.clientY - pan.y);
    if (Math.abs(ev.clientX - pan.x) + Math.abs(ev.clientY - pan.y) > 3) pan.moved = true;
    render();
  }
});
svg.addEventListener("pointerup", ev => {
  if (pan && !pan.moved && selected) clearSelection();
  drag = null; pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
});
svg.addEventListener("pointercancel", ev => {
  drag = null; pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
});
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const box = svg.getBoundingClientRect();
  const mx = ev.clientX - box.left, my = ev.clientY - box.top;
  const next = Math.max(0.12, Math.min(4, scale * Math.exp(-ev.deltaY * 0.0015)));
  tx = mx - (mx - tx) * (next / scale);
  ty = my - (my - ty) * (next / scale);
  scale = next;
  render();
}, { passive: false });
window.addEventListener("resize", render);

emptyDetails();
relayout();
</script>
</body>
</html>
